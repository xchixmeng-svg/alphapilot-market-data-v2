name: Reanalyse large candidates after 10-12 percent pullback

on:
  workflow_dispatch:
  push:
    branches: [three-layer-strategy-20260902]
    paths:
      - scripts/validate_large_pullback_reanalysis_v4.py
      - .github/workflows/validate_large_pullback_reanalysis_v4.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow lxml html5lib beautifulsoup4
      - name: Run pullback and full reanalysis comparison
        run: python -u scripts/validate_large_pullback_reanalysis_v4.py
      - name: Commit audited results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/large_pullback_10_12_reanalysis artifacts/six_factor_validation/corporate_action_audit.csv artifacts/six_factor_validation/unresolved_price_discontinuities.csv
          git diff --cached --quiet || git commit -m "results: reanalysed large pullback candidates"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-pullback-reanalysis
          path: |
            artifacts/large_pullback_10_12_reanalysis
            artifacts/six_factor_validation/corporate_action_audit.csv
            artifacts/six_factor_validation/unresolved_price_discontinuities.csv
