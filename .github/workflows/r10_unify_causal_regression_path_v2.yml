name: R10 Unify Causal Regression Path V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_unify_causal_regression_path_v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Robust causal-path repair
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/r10_full_battery.py')
          s=p.read_text(encoding='utf-8')
          old='''    if name=="validation2021_2025":\n        apply_locked_baseline_execution_profile()\n    else:\n        restore_stress_execution_profile()\n        bt.VERSION="AlphaPilot-R10-MAX-0p5-Stress-v1.2-FULL"\n    result=bt.simulate(name,bt.SCENARIOS[name])\n    result["execution_profile"]="LOCKED_BASELINE" if name=="validation2021_2025" else "STRESS_DIAGNOSTIC"\n'''
          new='''    # Start every executable path from the documented causal controls. The\n    # legacy baseline helper disables ADV/DD defenses and is forensic-only.\n    restore_stress_execution_profile()\n    bt.VERSION="AlphaPilot-R10-MAX-0p5-Stress-v1.3-CAUSAL" if name=="validation2021_2025" else "AlphaPilot-R10-MAX-0p5-Stress-v1.3-FULL"\n    result=bt.simulate(name,bt.SCENARIOS[name])\n    result["execution_profile"]="DOCUMENTED_CAUSAL" if name=="validation2021_2025" else "STRESS_DIAGNOSTIC"\n'''
          if old not in s: raise SystemExit('full-battery legacy validation branch not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('scripts/r10_contract_test.py')
          s=p.read_text(encoding='utf-8')
          anchor='''ok("CAUSAL_NO_IMPLICIT_COMPOUND_PROFILE", 'if Path(sys.argv[0]).name == "r10_five_year_compound.py"' not in full_battery)\n'''
          add='''ok("CAUSAL_NO_IMPLICIT_COMPOUND_PROFILE", 'if Path(sys.argv[0]).name == "r10_five_year_compound.py"' not in full_battery)\nok("CAUSAL_FULL_BATTERY_NO_LEGACY_VALIDATION_CALL", 'apply_locked_baseline_execution_profile()\\n    else:' not in full_battery)\n'''
          if anchor not in s: raise SystemExit('contract profile anchor not found')
          p.write_text(s.replace(anchor,add,1),encoding='utf-8')
          PY
      - name: Compile and contract gate
        run: |
          pip install -q numpy pandas requests
          python -m py_compile scripts/r10_full_battery.py scripts/r10_five_year_compound.py scripts/r10_locked_validation_v2.py scripts/r10_contract_test.py
          python scripts/r10_contract_test.py
      - name: Commit Python causal path
        run: |
          git config user.name "AlphaPilot CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/r10_full_battery.py scripts/r10_contract_test.py
          git commit -m "fix: remove legacy profile from full-battery validation"
          git push
