name: V6 Stage0 0B Coverage Audit
on:
  workflow_dispatch:
  push:
    branches: [research-ai-market-reasoning-v6-cpu-quantile-20260916]
    paths:
      - '.github/workflows/research_ai_market_reasoning_v6_stage0_0b_coverage_audit.yml'
      - 'scripts/audit_v6_stage0_0b_coverage_blocker.py'
permissions:
  contents: read
jobs:
  coverage_audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 pyarrow==18.1.0
      - name: Restore completed 0B checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/v6-stage0-industry
          key: v6-stage0-industry-${{ github.ref_name }}-coverage-audit-${{ github.run_id }}
          restore-keys: |
            v6-stage0-industry-${{ github.ref_name }}-
      - name: Diagnose immutable completed checkpoint coverage
        run: python -u scripts/audit_v6_stage0_0b_coverage_blocker.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-stage0-0b-coverage-audit
          path: artifacts/v6-stage0-0b-coverage-audit/
          if-no-files-found: error
