name: V6.2 V4.2 Contract Only
on:
  workflow_dispatch:
  push:
    branches: [v6-2-causal-context-v4-2-20260920]
    paths:
      - 'scripts/v6_2_v4_2_contract.py'
      - 'scripts/build_v6_2_causal_context_sidecar.py'
      - 'scripts/upgrade_v6_2_v4_2_packets.py'
      - 'scripts/validate_v6_2_v4_2_delivery.py'
      - 'scripts/run_v6_2_v4_2_stage_c.py'
      - 'scripts/benchmark_v6_2_v4_2_transport.py'
      - 'tests/test_v6_2_v4_2_contract.py'
      - 'windows/**'
      - '.github/workflows/v6_2_v4_2_contract_only.yml'
permissions:
  contents: read
  actions: read
jobs:
  contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      V2_ARTIFACT: '10577910077'
      CONSUMED_PREPARED_ARTIFACT: '10582014726'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned contract dependencies
        run: python -m pip install -r windows/requirements-v6-2-v4-2.txt
      - name: Compile and run fail-closed unit tests
        run: |
          python -m py_compile scripts/v6_2_v4_2_contract.py scripts/build_v6_2_causal_context_sidecar.py scripts/upgrade_v6_2_v4_2_packets.py scripts/validate_v6_2_v4_2_delivery.py scripts/run_v6_2_v4_2_stage_c.py scripts/benchmark_v6_2_v4_2_transport.py
          python -m unittest -v tests.test_v6_2_v4_2_contract
      - name: Download exact frozen V2 and already-consumed packets only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw_v2 inputs/consumed inputs output
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V2_ARTIFACT}/zip" >/tmp/v2.zip
          unzip -oq /tmp/v2.zip -d raw_v2
          V2=$(find raw_v2 -name 'EVIDENCE_BUNDLE_V2.parquet' -print -quit)
          test -n "$V2"
          cp "$V2" inputs/EVIDENCE_BUNDLE_V2.parquet
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CONSUMED_PREPARED_ARTIFACT}/zip" >/tmp/consumed.zip
          unzip -oq /tmp/consumed.zip 'cases_shard_*.jsonl' 'CASE_MANIFEST.csv' 'PREP_SUMMARY.json' -d inputs/consumed
          test "$(find inputs/consumed -name 'cases_shard_*.jsonl' | wc -l)" -eq 4
          test ! -e inputs/consumed/HIDDEN_OUTCOMES.csv
          test ! -e inputs/consumed/HIDDEN_FUTURE_PATHS.parquet
      - name: Build and validate true consumed-packet transport
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_v6_2_causal_context_sidecar.py --evidence inputs/EVIDENCE_BUNDLE_V2.parquet --cases inputs/consumed/cases_shard_0.jsonl inputs/consumed/cases_shard_1.jsonl inputs/consumed/cases_shard_2.jsonl inputs/consumed/cases_shard_3.jsonl --out output/causal_context_sidecar.jsonl
          python scripts/upgrade_v6_2_v4_2_packets.py --cases inputs/consumed/cases_shard_0.jsonl inputs/consumed/cases_shard_1.jsonl inputs/consumed/cases_shard_2.jsonl inputs/consumed/cases_shard_3.jsonl --sidecar output/causal_context_sidecar.jsonl --out output/v6_2_v4_2_stage_c_packets.jsonl
          python scripts/validate_v6_2_v4_2_delivery.py output/v6_2_v4_2_stage_c_packets.jsonl --summary output/CONTRACT_ONLY_SUMMARY.json
          python scripts/run_v6_2_v4_2_stage_c.py output/v6_2_v4_2_stage_c_packets.jsonl --out output/STAGE_C_TRANSPORT_RECEIPTS.jsonl --transport-only
          python scripts/benchmark_v6_2_v4_2_transport.py output/STAGE_C_TRANSPORT_RECEIPTS.jsonl --expected 64 --out output/TRANSPORT_BENCHMARK_SUMMARY.json
      - name: Build reproducible Windows delivery bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/AlphaPilot_V6_2_V4_2/scripts delivery/AlphaPilot_V6_2_V4_2/tests delivery/AlphaPilot_V6_2_V4_2/windows delivery/AlphaPilot_V6_2_V4_2/output
          cp scripts/v6_2_v4_2_contract.py scripts/build_v6_2_causal_context_sidecar.py scripts/upgrade_v6_2_v4_2_packets.py scripts/validate_v6_2_v4_2_delivery.py scripts/run_v6_2_v4_2_stage_c.py scripts/benchmark_v6_2_v4_2_transport.py delivery/AlphaPilot_V6_2_V4_2/scripts/
          cp tests/test_v6_2_v4_2_contract.py delivery/AlphaPilot_V6_2_V4_2/tests/
          cp windows/RUN_V6_2_V4_2_CONTRACT_ONLY.cmd windows/RUN_V6_2_V4_2_LOCAL_MODEL.cmd windows/requirements-v6-2-v4-2.txt delivery/AlphaPilot_V6_2_V4_2/windows/
          cp output/CONTRACT_ONLY_SUMMARY.json output/CAUSAL_CONTEXT_BUILD_SUMMARY.json output/TRANSPORT_BENCHMARK_SUMMARY.json delivery/AlphaPilot_V6_2_V4_2/output/
          cp inputs/consumed/cases_shard_*.jsonl inputs/consumed/CASE_MANIFEST.csv inputs/consumed/PREP_SUMMARY.json delivery/AlphaPilot_V6_2_V4_2/output/
          cp output/causal_context_sidecar.jsonl output/v6_2_v4_2_stage_c_packets.jsonl delivery/AlphaPilot_V6_2_V4_2/output/
          (cd delivery && zip -qr AlphaPilot_V6_2_V4_2_contract_complete.zip AlphaPilot_V6_2_V4_2)
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaPilot-V6-2-V4-2-contract-complete
          path: delivery/AlphaPilot_V6_2_V4_2_contract_complete.zip
          if-no-files-found: error
          retention-days: 90
  windows-one-click:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      V2_ARTIFACT: '10577910077'
      CONSUMED_PREPARED_ARTIFACT: '10582014726'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare exact inputs without extracting hidden outcomes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force raw_v2, inputs, inputs/consumed | Out-Null
          gh api -H 'Accept: application/vnd.github+json' "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:V2_ARTIFACT/zip" > "$env:RUNNER_TEMP/v2.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP/v2.zip" raw_v2
          $v2 = Get-ChildItem raw_v2 -Recurse -Filter EVIDENCE_BUNDLE_V2.parquet | Select-Object -First 1
          if (-not $v2) { throw 'V2 missing' }
          Copy-Item $v2.FullName inputs/EVIDENCE_BUNDLE_V2.parquet
          gh api -H 'Accept: application/vnd.github+json' "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CONSUMED_PREPARED_ARTIFACT/zip" > "$env:RUNNER_TEMP/consumed.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP/consumed.zip")
          try {
            foreach ($entry in $zip.Entries) {
              if ($entry.Name -like 'cases_shard_*.jsonl' -or $entry.Name -in @('CASE_MANIFEST.csv','PREP_SUMMARY.json')) {
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path (Resolve-Path inputs/consumed) $entry.Name), $true)
              }
            }
          } finally { $zip.Dispose() }
          if (Test-Path inputs/consumed/HIDDEN_OUTCOMES.csv) { throw 'hidden outcomes extracted' }
          if (Test-Path inputs/consumed/HIDDEN_FUTURE_PATHS.parquet) { throw 'hidden future paths extracted' }
      - name: Execute Windows one-click contract flow
        shell: cmd
        run: windows\RUN_V6_2_V4_2_CONTRACT_ONLY.cmd
      - name: Execute packaged Windows Stage-C launcher in transport-only mode
        shell: cmd
        env:
          V62_TRANSPORT_ONLY: '1'
        run: windows\RUN_V6_2_V4_2_LOCAL_MODEL.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaPilot-V6-2-V4-2-windows-smoke
          path: |
            output/CONTRACT_ONLY_SUMMARY.json
            output/CAUSAL_CONTEXT_BUILD_SUMMARY.json
          if-no-files-found: error
          retention-days: 90
