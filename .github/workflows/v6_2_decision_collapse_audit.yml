name: V6.2 Decision Collapse Audit
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'research/V6_2_DECISION_COLLAPSE_AUDIT_TRIGGER.txt'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      FINAL_ARTIFACT: '10582872959'
      PREPARED_ARTIFACT: '10582014726'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install pandas==2.2.3 numpy==2.3.5
          python -m py_compile scripts/audit_v6_2_decision_collapse.py
      - name: Download exact successful 64-case outputs and hidden outcomes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/final inputs/prepared
          get(){ gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" >/tmp/x.zip; unzip -oq /tmp/x.zip -d "$2"; }
          get "$FINAL_ARTIFACT" inputs/final
          get "$PREPARED_ARTIFACT" inputs/prepared
          test -n "$(find inputs/final -name 'AI_REPLAY_64_CASES.json' -print -quit)"
          test -n "$(find inputs/prepared -name 'HIDDEN_OUTCOMES.csv' -print -quit)"
      - run: python -u scripts/audit_v6_2_decision_collapse.py
      - uses: actions/upload-artifact@v4
        with:
          name: v6-2-decision-collapse-audit
          path: out/
          if-no-files-found: error
          retention-days: 90
