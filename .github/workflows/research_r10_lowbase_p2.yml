name: R10 Low-base P2 Research

on:
  workflow_dispatch:
  push:
    branches:
      - research-r10-lowbase-persistence-20260914
    paths:
      - scripts/backtest_r10_lowbase_p2.py
      - .github/workflows/research_r10_lowbase_p2.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 tabulate==0.9.0
      - name: Verify immutable market inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Verify locked R10 engine fingerprint
        run: |
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          test "$(git rev-parse refs/remotes/origin/r10-no-trail-formal-fix-20260907)" = "3728a0045ab77d65b1bd9c73fcbe942f6c0bc0d9"
      - name: Run low-base P2/P3 comparison
        run: python scripts/backtest_r10_lowbase_p2.py | tee lowbase_p2_execution.log
      - name: Show comparison
        run: cat lowbase_p2_results/LOWBASE_PERSISTENCE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: r10-lowbase-p2-results
          path: |
            lowbase_p2_execution.log
            lowbase_p2_results/**
          if-no-files-found: error
          retention-days: 30
