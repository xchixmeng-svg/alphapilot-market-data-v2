name: Adaptive Router Stage13 Benchmark Relative Alpha Ranking
on:
  push:
    branches: [r10-stage13-benchmark-alpha-ranking-20260910]
    paths:
      - 'scripts/adaptive_router_stage13_benchmark_alpha_ranking.py'
      - '.github/workflows/adaptive_router_stage13.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  stage13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow scipy
      - name: Restore cached market bundle
        uses: actions/download-artifact@v4
        with:
          name: R10-2016-2020-reference-data-complete
          path: reference_bundle
          github-token: ${{ github.token }}
          repository: xchixmeng-svg/alphapilot-market-data-v2
          run-id: 34313660140
      - name: Run Stage13
        run: python scripts/adaptive_router_stage13_benchmark_alpha_ranking.py
      - name: Guard research contract
        run: |
          python - <<'PY'
          import json
          m=json.load(open('adaptive_router_stage13/stage13_manifest.json'))
          assert m['market_refetch'] is False
          assert m['formal_r10_modified'] is False
          assert m['uses_2021_2025'] is False
          assert m['benchmark_gate_required'] is True and m['benchmark']=='0050'
          assert m['oos1_used_for_feature_discovery'] is False
          assert m['oos2_used_for_feature_or_variant_selection'] is False
          assert m['t_plus_1'] is True and m['integer_shares'] is True and m['shared_cash'] is True
          print('STAGE13_GATES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-router-stage13
          path: adaptive_router_stage13/
          if-no-files-found: error