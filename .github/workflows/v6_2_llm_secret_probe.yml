name: V6.2 LLM Secret Presence Probe
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - '.github/workflows/v6_2_llm_secret_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check secret presence only
        shell: bash
        run: |
          python - <<'PY'
          import os, json
          names=[
            "OPENAI_API_KEY","ANTHROPIC_API_KEY","CLAUDE_API_KEY",
            "GEMINI_API_KEY","GOOGLE_API_KEY","AZURE_OPENAI_API_KEY",
            "OPENROUTER_API_KEY"
          ]
          out={k: bool(os.environ.get(k)) for k in names}
          print(json.dumps(out, sort_keys=True))
          print("ANY_LLM_SECRET="+str(any(out.values())).lower())
          PY
