name: R10 Promote Causal Benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_promote_causal_benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote causal benchmark and quarantine legacy oracle result
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Benchmark identities in engine.
          p=Path('scripts/backtest_r10_stress.py')
          s=p.read_text(encoding='utf-8')
          old='''LOCKED_BENCHMARK = {\n    "end_nav": 9_888_538.413551485,\n    "cagr": 0.5019270634416155,\n    "max_dd": -0.12258760312884043,\n    "completed_trades": 241,\n}\n'''
          new='''# Historical reference retained only for forensic comparison. It is NOT a\n# valid causal regression target: the inherited R0.5 ledger used exit-day\n# intraday stop/trailing information to select the exit date, then repriced that\n# same exit at the already-passed opening price (confirmed 15/15 hard stops and\n# 2/2 trailing exits).\nLEGACY_CONTAMINATED_BENCHMARK = {\n    "end_nav": 9_888_538.413551485,\n    "cagr": 0.5019270634416155,\n    "max_dd": -0.12258760312884043,\n    "completed_trades": 241,\n    "causal": False,\n}\n\n# Zero-look-ahead reference produced by the documented T-close -> T+1 engine\n# after repairing buy-side 0.5% adverse execution. This is the active regression\n# target; it must be reproduced before long historical/capital-path results are\n# accepted.\nCAUSAL_BENCHMARK = {\n    "end_nav": 4_020_109.243251493,\n    "cagr": 0.2539714041310821,\n    "max_dd": -0.1813892621615033,\n    "completed_trades": 217,\n    "causal": True,\n}\n\n# Backward-compatible alias. All validation deltas now point to the causal gate.\nLOCKED_BENCHMARK = CAUSAL_BENCHMARK\n'''
          if old not in s: raise SystemExit('benchmark block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 2) Validation output names both references explicitly.
          p=Path('scripts/r10_fast_validation.py')
          s=p.read_text(encoding='utf-8')
          old='''"r05_enabled":True,"locked_benchmark":bt.LOCKED_BENCHMARK,"validation_delta":{"end_nav_pct":end_nav/bt.LOCKED_BENCHMARK["end_nav"]-1,"cagr":cagr-bt.LOCKED_BENCHMARK["cagr"],"max_dd":max_dd-bt.LOCKED_BENCHMARK["max_dd"],"trades":int(len(trades_df))-bt.LOCKED_BENCHMARK["completed_trades"]},"causal_assertions"'''
          new='''"r05_enabled":True,"causal_benchmark":bt.CAUSAL_BENCHMARK,"legacy_contaminated_benchmark":bt.LEGACY_CONTAMINATED_BENCHMARK,"locked_benchmark":bt.CAUSAL_BENCHMARK,"validation_delta":{"end_nav_pct":end_nav/bt.CAUSAL_BENCHMARK["end_nav"]-1,"cagr":cagr-bt.CAUSAL_BENCHMARK["cagr"],"max_dd":max_dd-bt.CAUSAL_BENCHMARK["max_dd"],"trades":int(len(trades_df))-bt.CAUSAL_BENCHMARK["completed_trades"]},"legacy_delta":{"end_nav_pct":end_nav/bt.LEGACY_CONTAMINATED_BENCHMARK["end_nav"]-1,"cagr":cagr-bt.LEGACY_CONTAMINATED_BENCHMARK["cagr"],"max_dd":max_dd-bt.LEGACY_CONTAMINATED_BENCHMARK["max_dd"],"trades":int(len(trades_df))-bt.LEGACY_CONTAMINATED_BENCHMARK["completed_trades"]},"legacy_benchmark_status":"QUARANTINED_LOOKAHEAD_CONTAMINATION","causal_assertions"'''
          if old not in s: raise SystemExit('fast validation benchmark clause not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 3) Five-year capital path must use documented controls, not the old
          #    profile that disabled DD throttle/force reduction and ADV cap.
          p=Path('scripts/r10_full_battery.py')
          s=p.read_text(encoding='utf-8')
          old='''# r10_five_year_compound imports this module and then calls bt.simulate directly,\n# so select the locked profile at import time for that script only.\nif Path(sys.argv[0]).name == "r10_five_year_compound.py":\n    apply_locked_baseline_execution_profile()\n'''
          new='''# IMPORTANT: five-year capital-path runs use the documented causal controls.\n# Do not activate the legacy baseline profile at import time: it disables the\n# locked 2% ADV cap, DD sizing throttle, and force-DD defense.\n# apply_locked_baseline_execution_profile() is retained only for explicit legacy\n# forensic experiments and must never be selected implicitly.\n'''
          if old not in s: raise SystemExit('compound import profile clause not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 4) Contract test guards benchmark identity and compound profile.
          p=Path('scripts/r10_contract_test.py')
          s=p.read_text(encoding='utf-8')
          anchor='''ok("E04_SELL_SLIPPAGE", bt.SELL_SLIPPAGE == 0.005)\n'''
          add='''ok("E04_SELL_SLIPPAGE", bt.SELL_SLIPPAGE == 0.005)\nok("B01_CAUSAL_BENCHMARK_ACTIVE", bt.LOCKED_BENCHMARK is bt.CAUSAL_BENCHMARK)\nok("B02_CAUSAL_NAV", abs(bt.CAUSAL_BENCHMARK["end_nav"] - 4_020_109.243251493) < 1e-6)\nok("B03_CAUSAL_FLAG", bt.CAUSAL_BENCHMARK.get("causal") is True)\nok("B04_LEGACY_QUARANTINED", bt.LEGACY_CONTAMINATED_BENCHMARK.get("causal") is False)\nok("B05_LEGACY_NOT_ACTIVE", bt.LEGACY_CONTAMINATED_BENCHMARK is not bt.LOCKED_BENCHMARK)\n'''
          if anchor not in s: raise SystemExit('contract anchor not found')
          s=s.replace(anchor,add,1)
          anchor2='''engine = (ROOT / "scripts" / "backtest_r10_stress.py").read_text(encoding="utf-8")\n'''
          add2='''engine = (ROOT / "scripts" / "backtest_r10_stress.py").read_text(encoding="utf-8")\nfull_battery = (ROOT / "scripts" / "r10_full_battery.py").read_text(encoding="utf-8")\n'''
          if anchor2 not in s: raise SystemExit('contract source anchor not found')
          s=s.replace(anchor2,add2,1)
          anchor3='''contains("PORT_R05_FIRST", engine, 'R0.5 is evaluated before R7')\n'''
          add3='''contains("PORT_R05_FIRST", engine, 'R0.5 is evaluated before R7')\nok("CAUSAL_NO_IMPLICIT_COMPOUND_PROFILE", 'if Path(sys.argv[0]).name == "r10_five_year_compound.py"' not in full_battery)\n'''
          if anchor3 not in s: raise SystemExit('compound contract anchor not found')
          s=s.replace(anchor3,add3,1)
          p.write_text(s,encoding='utf-8')

          # 5) Source-of-truth documentation: execution + benchmark status.
          p=Path('docs/R10_LOCKED_RULES_SOURCE_OF_TRUTH.md')
          s=p.read_text(encoding='utf-8')
          old='''- Buy fill: if T+1 Open <= precommitted limit, fill at Open; else if T+1 Low <= limit, fill at limit; otherwise cancel/no chase.\n'''
          new='''- Buy fill: if T+1 Open <= precommitted limit, apply 0.5% adverse buy slippage to Open, round the estimate to cents, round UP to a legal Taiwan tick, and cap at the locked limit; else if T+1 Low <= limit, fill at the locked limit; otherwise cancel/no chase.\n'''
          if old not in s: raise SystemExit('doc buy execution clause not found')
          s=s.replace(old,new,1)
          old='''## 6. Locked five-year regression benchmark\n\n2021–2025 benchmark used for engine-equivalence testing:\n- End NAV: NT$9,888,538.413551485.\n- CAGR: 50.192706%.\n- Max DD: -12.258760%.\n- Completed trades: 241.\n\nAny reconstructed engine that materially differs from this benchmark is not to be presented as official-equivalent R10 until the first divergence is identified and resolved.\n'''
          new='''## 6. Five-year regression references\n\n### 6.1 Active causal benchmark\n\nThe active 2021–2025 regression gate is produced with the rules in this document and strict T-close -> T+1 execution:\n- End NAV: NT$4,020,109.243251493.\n- CAGR: 25.397140%.\n- Max DD: -18.138926%.\n- Completed trades: 217.\n- Future data used: false.\n\nA long historical stress/capital-path result is accepted only after this causal benchmark is reproduced.\n\n### 6.2 Quarantined legacy Golden reference — NOT a causal regression target\n\nThe former Golden reference is retained only for forensic comparison:\n- End NAV: NT$9,888,538.413551485.\n- CAGR: 50.192706%.\n- Max DD: -12.258760%.\n- Completed trades: 241.\n\nForensic comparison against the inherited R7/R0.5 ledger established look-ahead contamination in R0.5 exits. All 15 inherited `STOP` exits first touched the -10% stop during the exit day's intraday range while the prior trading-day low had not touched it; nevertheless the R10 Golden ledger repriced those exits at that same day's already-passed opening price. The two inherited trailing exits (TARGET_TRAIL and RUNNER_TRAIL) have the same timing defect. Therefore the legacy 9.888m result cannot be used as a zero-look-ahead engine-equivalence target.\n'''
          if old not in s: raise SystemExit('doc benchmark section not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Compile and contract gate
        run: |
          pip install -q numpy pandas requests
          python -m py_compile scripts/backtest_r10_stress.py scripts/r10_fast_validation.py scripts/r10_full_battery.py scripts/r10_locked_validation_v2.py scripts/r10_contract_test.py scripts/r10_five_year_compound.py
          python scripts/r10_contract_test.py
      - name: Commit causal benchmark repair
        run: |
          git config user.name "AlphaPilot CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/backtest_r10_stress.py scripts/r10_fast_validation.py scripts/r10_full_battery.py scripts/r10_contract_test.py docs/R10_LOCKED_RULES_SOURCE_OF_TRUTH.md
          git commit -m "fix: quarantine lookahead Golden and lock causal R10 benchmark"
          git push
