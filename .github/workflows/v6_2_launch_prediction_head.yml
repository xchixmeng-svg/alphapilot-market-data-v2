name: V6.2 Launch Prediction Head
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/train_v6_2_launch_head.py'
      - '.github/workflows/v6_2_launch_prediction_head.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      V1_ARTIFACT: '10570644207'
      FROZEN_0F_ARTIFACT: '10537510796'
      LAUNCH_ARTIFACT: '10579051288'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 scikit-learn==1.6.1
      - name: Download exact admitted inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/v1 inputs/0f inputs/launch
          get(){ gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" > /tmp/a.zip; unzip -oq /tmp/a.zip -d "$2"; }
          get "$V1_ARTIFACT" inputs/v1
          get "$FROZEN_0F_ARTIFACT" inputs/0f
          get "$LAUNCH_ARTIFACT" inputs/launch
          test -s inputs/v1/EVIDENCE_BUNDLE_V1.parquet
          test -s inputs/0f/0F_FINAL_ASSEMBLY/feature_registry.json
          test -s inputs/launch/V6_2_LAUNCH_LABEL_AUDIT_ROWS.parquet
      - name: Train calibrated launch heads
        run: python -u scripts/train_v6_2_launch_head.py
      - uses: actions/upload-artifact@v4
        with:
          name: v6-2-launch-prediction-head
          path: v6_2_launch_head/
          if-no-files-found: error
          retention-days: 90
