name: Daily lights (燈號)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Taiwan Market Data Only"]
    types: [completed]
  schedule:
    - cron: "37 13 * * 1-5"   # 21:37 台北：融資資料公布後再算一次（22:00 推完整版）
  push:
    branches: [main]
    paths: ['scripts/lights_daily.py', '.github/workflows/lights_daily.yml']

permissions:
  contents: write

concurrency:
  group: lights
  cancel-in-progress: false

jobs:
  lights:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5 pandas==2.2.3 pyarrow==18.1.0
      - name: Refresh macro (TAIEX/TWD/VIX)
        continue-on-error: true
        run: python scripts/fetch_macro.py
      - name: Refresh TWD 16:00 (CBC)
        continue-on-error: true
        run: python -u scripts/fetch_twd_tpe.py
      - name: Refresh TAIFEX (外資台指期未平倉、P/C 比)
        continue-on-error: true
        timeout-minutes: 5
        run: python -u scripts/backfill_taifex.py recent
      - name: Lights
        run: python scripts/lights_daily.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/extra/lights data/extra/macro data/history/credit data/history/taifex
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "data: daily lights $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
