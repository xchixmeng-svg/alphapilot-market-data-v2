name: V6.1 Formal Repair Validation OOS 2022-2024
on:
  push:
    branches: [research-ai-market-reasoning-v6-1-corp-safe-20260918]
    paths:
      - 'research/V6_1_PREREG_LOCK.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scipy==1.18.1 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Download exact frozen Stage0F
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10537510796/zip > /tmp/v6-0f.zip
          mkdir -p /tmp/v6-0f
          unzip -q /tmp/v6-0f.zip -d /tmp/v6-0f
          mkdir -p data/history/v6-layered
          cp -a /tmp/v6-0f/. data/history/v6-layered/
      - name: Verify V6.1 machine lock
        run: python scripts/verify_v6_1_prereg_lock.py
      - name: Run locked V6.1 year
        run: python -u scripts/backtest_ai_market_reasoning_v6_1_corp_safe.py --year ${{ matrix.year }}
      - name: Upload year evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-1-stage-a-${{ matrix.year }}
          path: |
            ai_market_reasoning_v6_1_corp_safe_results/V6_1_STAGE_A_${{ matrix.year }}_AUDIT.csv
            ai_market_reasoning_v6_1_corp_safe_results/V6_1_STAGE_A_${{ matrix.year }}_DATE_LOSS.csv
            ai_market_reasoning_v6_1_corp_safe_results/V6_1_STAGE_A_${{ matrix.year }}_META.json
          if-no-files-found: error
          retention-days: 90
  gate:
    needs: year
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scipy==1.18.1 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Verify V6.1 machine lock
        run: python scripts/verify_v6_1_prereg_lock.py
      - name: Download year evidence
        uses: actions/download-artifact@v4
        with:
          pattern: v6-1-stage-a-*
          path: /tmp/v6-1-stage-a
          merge-multiple: true
      - name: Aggregate locked repair-validation gate
        run: python -u scripts/backtest_ai_market_reasoning_v6_1_corp_safe.py --aggregate-dir /tmp/v6-1-stage-a
      - name: Upload gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-1-repair-validation-gate
          path: |
            ai_market_reasoning_v6_1_corp_safe_results/V6_1_REPAIR_VALIDATION_AUDIT.csv
            ai_market_reasoning_v6_1_corp_safe_results/V6_1_REPAIR_VALIDATION_HORIZON_GATE.csv
            ai_market_reasoning_v6_1_corp_safe_results/V6_1_REPAIR_VALIDATION_GATE.json
          if-no-files-found: error
          retention-days: 90
