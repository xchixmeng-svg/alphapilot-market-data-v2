name: Continuous-context playbook router research

on:
  workflow_dispatch:
  push:
    branches: [research-continuous-context-20260912]
    paths:
      - 'scripts/research_continuous_context_router.py'
      - '.github/workflows/research_continuous_context_router.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 tabulate==0.9.0
      - name: Verify frozen history inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Verify locked R10 data-builder fingerprints
        run: |
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          echo "8aaca46ae7c6d2f0b4e1479878352901ffe90a8acaed122d3d2640c70ea817cc  data/reference/official_corporate_actions_2020_2025.csv" | sha256sum --check -
      - name: Build frozen causal daily layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf formal_run && mkdir formal_run
          for f in "$GITHUB_WORKSPACE"/data/history/2020-2025/*.parquet; do ln -s "$f" "$GITHUB_WORKSPACE/formal_run/$(basename "$f")"; done
          ln -s "$GITHUB_WORKSPACE/data/reference/official_corporate_actions_2020_2025.csv" "$GITHUB_WORKSPACE/formal_run/official_corporate_actions_2020_2025.csv"
          cd formal_run
          python ../scripts/r10_max_formal.py | tee execution.log
      - name: Assert locked formal baseline unchanged
        run: |
          python - <<'PY'
          import json
          a=json.load(open('formal_run/contract_audit.json'))
          s=json.load(open('formal_run/r10max_formal_summary.json'))['strategy']
          assert a['all_pass'], a
          assert abs(s['end_nav']-2403427.0678222505)<1e-7, s
          assert s['completed_trades']==150 and s['wins']==71 and s['losses']==79, s
          print('LOCKED_BASELINE_PASS')
          PY
      - name: Run continuous-context research
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_continuous_context_router.py | tee continuous_context_execution.log
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f research_out_continuous_context/portfolio_summary.csv ]; then
            echo '## Continuous causal market-context router' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          print(pd.read_csv('research_out_continuous_context/portfolio_summary.csv').to_markdown(index=False))
          print('\n### Decision')
          print('```json')
          print(open('research_out_continuous_context/decision.json').read())
          print('```')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-context-router-research
          path: |
            continuous_context_execution.log
            research_out_continuous_context/
          if-no-files-found: warn
