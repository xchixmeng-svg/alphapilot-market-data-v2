name: Whale Radar History Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/whale_radar_backfill_sec43.py"
      - "scripts/whale_radar_history_score*.py"
      - ".github/workflows/whale_radar_research.yml"

permissions:
  contents: read

concurrency:
  group: whale-radar-history-research-${{ github.sha }}
  cancel-in-progress: true

jobs:
  history-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate code
        run: |
          python -m py_compile scripts/whale_radar_backfill_sec43.py scripts/whale_radar_history_score.py scripts/whale_radar_history_score_combined.py
          python scripts/whale_radar_backfill_sec43.py --self-test
      - name: Positive-control-gated historical 43-1 backfill
        run: |
          python scripts/whale_radar_backfill_sec43.py --start-year 113 --allow-partial --sleep 0.10
      - name: Build Person Alpha if repository prices are sufficient
        if: success()
        run: |
          python scripts/whale_radar_history_score_combined.py
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-radar-history-${{ github.run_id }}
          path: data/whale_radar/
          retention-days: 14
