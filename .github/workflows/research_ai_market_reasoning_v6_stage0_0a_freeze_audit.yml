name: V6 Stage0 0A Market Freeze Audit

on:
  push:
    branches: [research-ai-market-reasoning-v6-parallel-stage0-20260917]
    paths:
      - 'scripts/audit_v6_stage0_market_freeze.py'
      - '.github/workflows/research_ai_market_reasoning_v6_stage0_0a_freeze_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6-stage0-0a-market-freeze-audit
  cancel-in-progress: false

jobs:
  audit_0a_market:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 pyarrow==18.1.0 requests==2.32.5 numpy==2.1.3
      - name: Static compile
        run: |
          python -m py_compile scripts/build_v6_stage0_market_layer.py
          python -m py_compile scripts/audit_v6_stage0_market_freeze.py
      - name: Build 0A from immutable local archives
        run: python -u scripts/build_v6_stage0_market_layer.py
      - name: Run 0A freeze audit
        run: python -u scripts/audit_v6_stage0_market_freeze.py
      - name: Upload 0A freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphapilot-v6-stage0-0A-frozen-audit
          path: |
            data/history/v6-layered/0A_MARKET/
            data/history/v6-layered/manifests/0A_MARKET.json
            data/history/v6-layered/progress/0A_MARKET.json
            data/history/v6-layered/audits/0A_MARKET_FREEZE.json
          if-no-files-found: error
          retention-days: 14
