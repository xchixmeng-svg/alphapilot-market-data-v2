name: Test large candidates after stable pullback base

on:
  workflow_dispatch:
  push:
    branches: [three-layer-strategy-20260902]
    paths:
      - scripts/validate_large_pullback_base_v4.py
      - .github/workflows/validate_large_pullback_base_v4.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow lxml html5lib beautifulsoup4
      - name: Run stable-base and full-reanalysis comparison
        run: python -u scripts/validate_large_pullback_base_v4.py
      - name: Commit audited results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/large_pullback_stable_base artifacts/six_factor_validation/corporate_action_audit.csv artifacts/six_factor_validation/unresolved_price_discontinuities.csv
          git diff --cached --quiet || git commit -m "results: stable pullback base test"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-pullback-stable-base
          path: |
            artifacts/large_pullback_stable_base
            artifacts/six_factor_validation/corporate_action_audit.csv
            artifacts/six_factor_validation/unresolved_price_discontinuities.csv
