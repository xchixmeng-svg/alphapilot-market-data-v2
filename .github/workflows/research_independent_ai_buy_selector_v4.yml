name: Research Independent AI Buy Selector V4

on:
  push:
    branches: [research-independent-ai-buy-selector-v4-20260915]
    paths:
      - 'research/INDEPENDENT_AI_BUY_SELECTOR_V4_PREREGISTRATION.md'
      - 'scripts/backtest_independent_ai_buy_selector_v4.py'
      - '.github/workflows/research_independent_ai_buy_selector_v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 scipy==1.18.1 scikit-learn==1.5.2 requests==2.32.5

      - name: Verify immutable 2020-2025 inputs
        run: sha256sum --check SHA256SUMS

      - name: Verify immutable 2016-2019 archive
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          m=json.loads((root/'data/history/2007-2019/manifest.json').read_text())
          wanted={2016,2017,2018,2019}
          rows=[r for r in m['files'] if int(r['year']) in wanted]
          assert {int(r['year']) for r in rows}==wanted
          for r in rows:
              p=root/r['path']
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              assert h==r['sha256'], (p,h,r['sha256'])
              print(p,'OK',h)
          PY

      - name: Assert independence from legacy engines
        run: |
          ! grep -Ei 'r10_max|r10|r7_hard|r05_hard|r7_score|r05_score|backtest_full_market' scripts/backtest_independent_ai_buy_selector_v4.py

      - name: Rebuild current 2026 YTD official data
        run: python -u scripts/build_2026_ytd_package.py

      - name: Run Independent AI Buy Selector V4
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/backtest_independent_ai_buy_selector_v4.py | tee independent_ai_buy_selector_v4_execution.log

      - name: Show OOS gate and live decision
        run: |
          cat independent_ai_buy_selector_v4_results/INDEPENDENT_AI_BUY_SELECTOR_V4_YEARLY.csv
          cat independent_ai_buy_selector_v4_results/INDEPENDENT_AI_BUY_SELECTOR_V4_OVERALL.json
          cat independent_ai_buy_selector_v4_results/INDEPENDENT_AI_BUY_SELECTOR_V4_GATE.json
          cat independent_ai_buy_selector_v4_results/INDEPENDENT_AI_BUY_SELECTOR_V4_LIVE.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: alphapilot-independent-ai-buy-selector-v4-results
          path: |
            independent_ai_buy_selector_v4_execution.log
            research/INDEPENDENT_AI_BUY_SELECTOR_V4_PREREGISTRATION.md
            independent_ai_buy_selector_v4_results/
            data/history/2026-YTD/manifest.json
          retention-days: 30
