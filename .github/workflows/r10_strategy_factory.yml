name: AlphaPilot R10 Strategy Factory Strict T+1

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Optuna trials"
        required: false
        default: "80"
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_strategy_factory.yml"
      - "scripts/r10_strategy_factory.py"
      - "scripts/r10_fast_validation.py"
      - "scripts/r10_full_battery.py"
      - "scripts/backtest_r10_stress.py"
      - "scripts/build_r10_scan.py"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: r10-strategy-factory-strict-t1-main
  cancel-in-progress: true

jobs:
  search:
    name: Search best 2021-2025 strategy under 15pct DD
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore R10 historical data cache
        uses: actions/cache@v4
        with:
          path: .stress_cache
          key: r10-strategy-factory-${{ runner.os }}-v1
          restore-keys: |
            r10-true-causal-${{ runner.os }}-
            r10-fiveyear-fast-${{ runner.os }}-
            r10-fiveyear-validation-${{ runner.os }}-

      - name: Install optimizer
        run: pip install requests pandas numpy optuna

      - name: Syntax + Strict T+1 contract
        shell: bash
        run: |
          python -m py_compile scripts/r10_strategy_factory.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import r10_strategy_factory as f
          c=f.strict_slot_contract()
          assert c['pass'] is True
          assert c['new_slot_available'] is False
          assert f.INITIAL_CAPITAL == 1_000_000.0
          assert f.MAX_DD_FLOOR == -0.15
          src=open('scripts/r10_strategy_factory.py',encoding='utf-8').read()
          assert 'codes_after = {q.code for q in positions.values()}' in src
          assert 'exclude=sell_keys' not in src
          assert src.index('pending_sells.pop(di') < src.index('pending_buys.pop(di')
          print('STRICT T+1 CONTRACT: PASS', c)
          PY

      - name: Run Strategy Factory
        env:
          TRIALS: ${{ github.event.inputs.trials || '80' }}
        run: python scripts/r10_strategy_factory.py --trials "$TRIALS" --seed 20260828

      - name: Enforce hard acceptance gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('stress_results/latest/strategy_factory_strict_t1/summary.json')
          q=json.loads(p.read_text(encoding='utf-8'))
          assert q['status']=='PASS',q
          assert q['hard_rules']['warmup']=='2020',q
          assert q['hard_rules']['evaluation']=='2021-2025',q
          assert q['hard_rules']['initial_capital_twd']==1_000_000.0,q
          assert q['best']['max_dd'] >= -0.15 - 1e-12,q['best']
          assert q['strict_t1_contract']['new_slot_available'] is False,q
          print('BEST End NAV:', q['best']['end_nav'])
          print('BEST CAGR:', q['best']['cagr'])
          print('BEST Max DD:', q['best']['max_dd'])
          print('BEST Trades:', q['best']['completed_trades'])
          print('BEST Trial:', q['best_trial'])
          PY

      - name: Upload Strategy Factory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-strategy-factory-strict-t1
          path: stress_results/latest/strategy_factory_strict_t1
          if-no-files-found: warn
          retention-days: 90
