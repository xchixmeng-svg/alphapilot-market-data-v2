name: R10 MAX Full Exposure 2016-2020 direct research
on:
  workflow_dispatch:
  push:
    branches: [r10-full-exposure-research-20260908]
    paths:
      - scripts/run_r10_locked_2016_2020.py
      - .github/workflows/r10_2016_2020_sharded.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: r10-full-exposure-2016-2020-direct
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Stop obsolete data-refetch run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 34233461826 || true

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 requests==2.32.3

      - name: Reuse audited 100-percent institutional shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p institutional_shards
          gh run download 34228123650 -p 'institutional-*' -D institutional_shards
          test "$(find institutional_shards -name 'institutional_*.csv.gz' | wc -l)" -eq 5
          test "$(find institutional_shards -name 'manifest_*.json' | wc -l)" -eq 5

      - name: Stage locked historical inputs
        run: |
          git fetch origin main
          mkdir -p input/raw input/base2020
          git show origin/main:data/history/2007-2019/manifest.json > input/raw/manifest.json
          for y in 2015 2016 2017 2018 2019; do
            git show origin/main:data/history/2007-2019/raw/yearly_${y}.zip > input/raw/yearly_${y}.zip
          done
          cp data/history/2020-2025/ohlcv_2020.parquet input/base2020/
          cp data/history/2020-2025/institutional_2020_2025.parquet input/base2020/
          cp data/reference/official_corporate_actions_2020_2025.csv input/base2020/

      - name: Assemble audited causal inputs
        env:
          INSTITUTIONAL_SHARD_DIR: institutional_shards
        run: python scripts/build_2015_2020_validation_inputs.py | tee data_build.log

      - name: Execute R10 full-exposure research overlay
        run: |
          mkdir backward_run
          for f in validation_input/*; do
            ln -s "$GITHUB_WORKSPACE/$f" "backward_run/$(basename "$f")"
          done
          cd backward_run
          python ../scripts/run_r10_locked_2016_2020.py | tee execution.log

      - name: Final execution audit
        run: |
          python - <<'PY'
          import json
          audit=json.load(open("backward_run/contract_audit.json"))
          summary=json.load(open("backward_run/r10max_formal_summary.json"))
          manifest=json.load(open("validation_input/input_manifest.json"))
          experiment=json.load(open("backward_run/full_exposure_experiment.json"))
          assert audit["all_pass"],audit
          assert manifest["status"]=="PASS",manifest
          assert summary["strategy"]["initial"]==1300000.0,summary
          assert experiment["name"]=="R10 MAX Full Exposure Research",experiment
          print(json.dumps({
              "execution_contract":"PASS",
              "research_variant":experiment["name"],
              "strategy":summary["strategy"],
              "benchmark_0050":summary["benchmark_0050"],
          },ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: R10-MAX-full-exposure-2016-2020-results
          path: |
            data_build.log
            validation_input/input_manifest.json
            backward_run/execution.log
            backward_run/contract_audit.json
            backward_run/full_exposure_experiment.json
            backward_run/r10max_formal_summary.json
            backward_run/r10max_formal_nav.csv
            backward_run/r10max_formal_trades.csv
            backward_run/r10max_formal_orders.csv
            backward_run/r10max_formal_corporate_actions.csv
            backward_run/r10max_formal_annual.csv
            backward_run/r10max_formal_open_positions.csv
            backward_run/r10max_formal_slot_diag.csv
            backward_run/r10_max_full_exposure_2016_2020_generated.py
          retention-days: 90
          if-no-files-found: error
