name: R10 MAX Full Exposure 2016-2020 research
on:
  workflow_dispatch:
  push:
    branches: [r10-full-exposure-research-20260908]
    paths:
      - scripts/fetch_institutional_year.py
      - .github/workflows/r10_2016_2020_sharded.yml
permissions:
  contents: read
jobs:
  institutional:
    strategy:
      fail-fast: false
      matrix:
        year: [2015, 2016, 2017, 2018, 2019]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas==2.2.3 requests==2.32.3
      - name: Stage preserved OHLCV year
        run: |
          git fetch origin main
          mkdir -p shard_input shard_output
          git show origin/main:data/history/2007-2019/raw/yearly_${{ matrix.year }}.zip > shard_input/yearly_${{ matrix.year }}.zip
      - name: Fetch official annual institutional flows
        run: python scripts/fetch_institutional_year.py ${{ matrix.year }} shard_input/yearly_${{ matrix.year }}.zip shard_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institutional-${{ matrix.year }}
          path: shard_output/
          retention-days: 90
          if-no-files-found: error
  aggregate:
    needs: institutional
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 requests==2.32.3
      - uses: actions/download-artifact@v4
        with:
          pattern: institutional-*
          path: institutional_shards
      - name: Stage locked historical inputs
        run: |
          git fetch origin main
          mkdir -p input/raw input/base2020
          git show origin/main:data/history/2007-2019/manifest.json > input/raw/manifest.json
          for y in 2015 2016 2017 2018 2019; do
            git show origin/main:data/history/2007-2019/raw/yearly_${y}.zip > input/raw/yearly_${y}.zip
          done
          cp data/history/2020-2025/ohlcv_2020.parquet input/base2020/
          cp data/history/2020-2025/institutional_2020_2025.parquet input/base2020/
          cp data/reference/official_corporate_actions_2020_2025.csv input/base2020/
      - name: Build audited causal inputs from durable shards
        env:
          INSTITUTIONAL_SHARD_DIR: institutional_shards
        run: python scripts/build_2015_2020_validation_inputs.py | tee data_build.log
      - name: Execute locked R10 MAX
        run: |
          mkdir backward_run
          for f in validation_input/*; do ln -s "$GITHUB_WORKSPACE/$f" "backward_run/$(basename "$f")"; done
          cd backward_run
          python ../scripts/run_r10_locked_2016_2020.py | tee execution.log
      - name: Final contract audit
        run: |
          python - <<'PY'
          import json
          a=json.load(open("backward_run/contract_audit.json"))
          s=json.load(open("backward_run/r10max_formal_summary.json"))
          m=json.load(open("validation_input/input_manifest.json"))
          assert a["all_pass"],a
          assert m["status"]=="PASS",m
          assert s["strategy"]["initial"]==1300000.0,s
          print(json.dumps({"contract":"PASS","strategy":s["strategy"],"benchmark_0050":s["benchmark_0050"]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R10-MAX-full-exposure-2016-2020-results
          path: |
            data_build.log
            validation_input/input_manifest.json
            backward_run/execution.log
            backward_run/contract_audit.json
            backward_run/r10max_formal_summary.json
            backward_run/r10max_formal_nav.csv
            backward_run/r10max_formal_trades.csv
            backward_run/r10max_formal_orders.csv
            backward_run/r10max_formal_corporate_actions.csv
            backward_run/r10max_formal_annual.csv
            backward_run/r10max_formal_open_positions.csv
            backward_run/r10max_formal_slot_diag.csv
            backward_run/r10_max_full_exposure_2016_2020_generated.py\n            backward_run/full_exposure_experiment.json
          retention-days: 90
          if-no-files-found: error
