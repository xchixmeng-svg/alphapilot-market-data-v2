name: Dynamic Target 4772 Research

on:
  push:
    branches:
      - empirical-planv3-20261002
    paths:
      - research/dynamic_target_4772.py
      - .github/workflows/dynamic_target_4772.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: empirical-planv3-20261002
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow scikit-learn

      - name: Run 4772 dynamic-target prototype
        run: python research/dynamic_target_4772.py

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/dynamic_target_4772_out/
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "research: 4772 dynamic target prototype output"
            git push origin HEAD:empirical-planv3-20261002
          fi
