name: V6.2 AI Replay 64 Structured Canary
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'research/V6_2_AI_REPLAY64_TRIGGER.txt'
permissions:
  contents: read
  actions: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      V62_LOCAL_MODEL: qwen2.5:7b
      PREPARED_ARTIFACT: '10581735186'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile before model download
        run: python -m py_compile scripts/run_v6_2_ai_replay64_structured.py scripts/evaluate_v6_2_ai_replay64_structured.py
      - name: Install Ollama and exact prepared packets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 1; done
          ollama pull "$V62_LOCAL_MODEL"
          mkdir -p prepared_raw prepared
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREPARED_ARTIFACT}/zip" >/tmp/prepared.zip
          unzip -oq /tmp/prepared.zip -d prepared_raw
          find prepared_raw -maxdepth 2 -type f -exec cp {} prepared/ \;
          test "$(find prepared -name 'cases_shard_*.jsonl' | wc -l)" -eq 4
      - name: Four-case structured-output canary
        run: python -u scripts/run_v6_2_ai_replay64_structured.py --mode canary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-2-ai-replay64-structured-canary
          path: out/
          if-no-files-found: warn
          retention-days: 90

  reason:
    needs: canary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    env:
      GH_TOKEN: ${{ github.token }}
      V62_LOCAL_MODEL: qwen2.5:7b
      PREPARED_ARTIFACT: '10581735186'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Ollama and exact prepared packets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 1; done
          ollama pull "$V62_LOCAL_MODEL"
          mkdir -p prepared_raw prepared
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREPARED_ARTIFACT}/zip" >/tmp/prepared.zip
          unzip -oq /tmp/prepared.zip -d prepared_raw
          find prepared_raw -maxdepth 2 -type f -exec cp {} prepared/ \;
      - name: Sixteen independent AI decisions with per-case checkpoints
        run: python -u scripts/run_v6_2_ai_replay64_structured.py --mode shard --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-2-ai-replay64-structured-${{ matrix.shard }}
          path: out/
          if-no-files-found: warn
          retention-days: 90

  evaluate:
    needs: reason
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARED_ARTIFACT: '10581735186'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Fetch exact prepared outcomes and reason outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prepared_raw prepared all reason_inputs
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREPARED_ARTIFACT}/zip" >/tmp/prepared.zip
          unzip -oq /tmp/prepared.zip -d prepared_raw
          find prepared_raw -maxdepth 2 -type f -exec cp {} prepared/ \;
          gh run download "${GITHUB_RUN_ID}" -D all
          find all -type f -name 'shard_*_responses.jsonl' -exec cp {} reason_inputs/ \;
          test "$(find reason_inputs -name 'shard_*_responses.jsonl' | wc -l)" -eq 4
          test "$(cat reason_inputs/shard_*_responses.jsonl | wc -l)" -eq 64
      - run: python -u scripts/evaluate_v6_2_ai_replay64_structured.py
      - uses: actions/upload-artifact@v4
        with:
          name: v6-2-ai-replay64-structured-final
          path: final/
          if-no-files-found: error
          retention-days: 90
