name: V6 Stage0 0D Macro Parallel

on:
  push:
    branches: [research-ai-market-reasoning-v6-parallel-stage0-20260917]
    paths:
      - 'scripts/build_v6_stage0_macro_layer.py'
      - '.github/workflows/research_ai_market_reasoning_v6_stage0_0d_parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6-stage0-0d-macro
  cancel-in-progress: false

jobs:
  macro_0d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 requests==2.32.5
      - name: Build 0D macro layer
        run: python -u scripts/build_v6_stage0_macro_layer.py
      - name: Emit visible 0D progress
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          m=json.loads(Path('data/history/v6-layered/manifests/0D_MACRO.json').read_text())
          p=Path('data/history/v6-layered/progress'); p.mkdir(parents=True, exist_ok=True)
          out={
            'lane':'0D_MACRO',
            'status':'PROVISIONAL',
            'current_completed':1,
            'target_total':3,
            'completion_pct':33.33,
            'newly_completed_this_run':0,
            'remaining':2,
            'current_blocker':'fallback equivalence audit and publication/availability-lag audit are still required before freeze',
            'last_successful_unit':'FED/H15 DBnomics source build',
            'artifact_name':'alphapilot-v6-stage0-0D-macro',
            'updated_at_utc':datetime.now(timezone.utc).isoformat(),
            'rows':m['row_count'],
            'series_count':len(m['datasets'])
          }
          (p/'0D_MACRO.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload 0D evidence
        uses: actions/upload-artifact@v4
        with:
          name: alphapilot-v6-stage0-0D-macro
          path: |
            data/history/v6-layered/0D_MACRO/
            data/history/v6-layered/manifests/0D_MACRO.json
            data/history/v6-layered/progress/0D_MACRO.json
          retention-days: 7
