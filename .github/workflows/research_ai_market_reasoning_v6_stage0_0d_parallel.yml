name: V6 Stage0 0D Macro Parallel

on:
  push:
    branches: [research-ai-market-reasoning-v6-parallel-stage0-20260917]
    paths:
      - 'scripts/build_v6_stage0_macro_layer.py'
      - 'scripts/audit_v6_stage0_macro_equivalence.py'
      - '.github/workflows/research_ai_market_reasoning_v6_stage0_0d_parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6-stage0-0d-macro
  cancel-in-progress: false

jobs:
  macro_0d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 requests==2.32.5
      - name: Static compile
        run: |
          python -m py_compile scripts/build_v6_stage0_macro_layer.py
          python -m py_compile scripts/audit_v6_stage0_macro_equivalence.py
      - name: Build 0D macro source layer
        run: python -u scripts/build_v6_stage0_macro_layer.py
      - name: Audit fallback equivalence
        run: python -u scripts/audit_v6_stage0_macro_equivalence.py
      - name: Upload 0D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphapilot-v6-stage0-0D-macro-audit
          path: |
            data/history/v6-layered/0D_MACRO/
            data/history/v6-layered/manifests/0D_MACRO.json
            data/history/v6-layered/progress/0D_MACRO.json
          retention-days: 7
