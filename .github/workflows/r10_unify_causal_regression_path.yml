name: R10 Unify Causal Regression Path

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_unify_causal_regression_path.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Remove legacy validation profile and unify compound gate
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/r10_full_battery.py')
          s=p.read_text(encoding='utf-8')
          old='''    if name=="validation2021_2025":\n        apply_locked_baseline_execution_profile()\n    else:\n        restore_stress_execution_profile()\n        bt.VERSION="AlphaPilot-R10-MAX-0p5-Stress-v1.2-FULL"\n    result=bt.simulate(name,bt.SCENARIOS[name])\n    result["execution_profile"]="LOCKED_BASELINE" if name=="validation2021_2025" else "STRESS_DIAGNOSTIC"\n'''
          new='''    # All executable paths start from the documented causal controls. The old\n    # LOCKED_BASELINE helper disabled ADV/DD defenses and is forensic-only.\n    restore_stress_execution_profile()\n    bt.VERSION="AlphaPilot-R10-MAX-0p5-Stress-v1.3-CAUSAL" if name=="validation2021_2025" else "AlphaPilot-R10-MAX-0p5-Stress-v1.3-FULL"\n    result=bt.simulate(name,bt.SCENARIOS[name])\n    result["execution_profile"]="DOCUMENTED_CAUSAL" if name=="validation2021_2025" else "STRESS_DIAGNOSTIC"\n'''
          if old not in s: raise SystemExit('full battery validation profile block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('.github/workflows/r10_five_year_compound.yml')
          s=p.read_text(encoding='utf-8')
          # Make engine/rules changes retrigger the capital-path workflow.
          old='''      - ".github/workflows/r10_five_year_compound.yml"\n      - "scripts/r10_five_year_compound.py"\n      - "scripts/r10_five_year_aggregate.py"\n'''
          new='''      - ".github/workflows/r10_five_year_compound.yml"\n      - "scripts/r10_five_year_compound.py"\n      - "scripts/r10_five_year_aggregate.py"\n      - "scripts/backtest_r10_stress.py"\n      - "scripts/r10_full_battery.py"\n      - "scripts/r10_fast_validation.py"\n      - "scripts/r10_locked_validation_v2.py"\n      - "scripts/r10_contract_test.py"\n      - "docs/R10_LOCKED_RULES_SOURCE_OF_TRUTH.md"\n'''
          if old not in s: raise SystemExit('compound path trigger block not found')
          s=s.replace(old,new,1)
          old='''      - uses: actions/cache@v4\n        with:\n          path: .stress_cache\n          key: r10-fiveyear-regression-${{ runner.os }}-v1\n      - run: pip install requests pandas numpy\n      - name: Run locked regression\n        run: python scripts/r10_full_battery.py --scenario validation2021_2025\n      - name: Enforce regression PASS\n        shell: bash\n        run: |\n          python - <<'PY'\n          import json\n          p='stress_results/latest/validation2021_2025/summary.json'\n          q=json.load(open(p,encoding='utf-8'))\n          g=(q.get('regression_gate') or {}).get('grade')\n          print('Regression Gate:',g)\n          if g!='PASS': raise SystemExit(2)\n          PY\n'''
          new='''      - uses: actions/cache@v4\n        with:\n          path: .stress_cache\n          key: r10-fiveyear-regression-${{ runner.os }}-v2-causal\n          restore-keys: |\n            r10-fiveyear-fast-${{ runner.os }}-\n            r10-fiveyear-regression-${{ runner.os }}-\n      - run: pip install requests pandas numpy\n      - name: Contract gate\n        run: python scripts/r10_contract_test.py\n      - name: Run causal 2021-2025 regression\n        run: python scripts/r10_locked_validation_v2.py\n      - name: Enforce exact causal regression PASS\n        shell: bash\n        run: |\n          python - <<'PY'\n          import json\n          p='stress_results/latest/validation2021_2025/summary.json'\n          q=json.load(open(p,encoding='utf-8'))\n          d=q.get('validation_delta') or {}\n          c=q.get('causal_assertions') or {}\n          ok=(q.get('status')=='PASS' and q.get('legacy_benchmark_status')=='QUARANTINED_LOOKAHEAD_CONTAMINATION'\n              and c.get('future_data_used') is False and abs(d.get('end_nav_pct',999))<1e-10\n              and abs(d.get('cagr',999))<1e-10 and abs(d.get('max_dd',999))<1e-10 and d.get('trades')==0)\n          print('Causal Regression Gate:', 'PASS' if ok else 'FAIL')\n          print('Delta:', d)\n          if not ok: raise SystemExit(2)\n          PY\n'''
          if old not in s: raise SystemExit('compound regression block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Add source-level guard against accidentally calling the legacy helper.
          p=Path('scripts/r10_contract_test.py')
          s=p.read_text(encoding='utf-8')
          old='''ok("CAUSAL_NO_IMPLICIT_COMPOUND_PROFILE", 'if Path(sys.argv[0]).name == "r10_five_year_compound.py"' not in full_battery)\n'''
          new='''ok("CAUSAL_NO_IMPLICIT_COMPOUND_PROFILE", 'if Path(sys.argv[0]).name == "r10_five_year_compound.py"' not in full_battery)\nok("CAUSAL_FULL_BATTERY_VALIDATION_PROFILE", 'if name=="validation2021_2025":\\n        apply_locked_baseline_execution_profile()' not in full_battery)\n'''
          if old not in s: raise SystemExit('contract causal profile guard anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Compile and contract gate
        run: |
          pip install -q numpy pandas requests
          python -m py_compile scripts/r10_full_battery.py scripts/r10_five_year_compound.py scripts/r10_locked_validation_v2.py scripts/r10_contract_test.py
          python scripts/r10_contract_test.py
      - name: Commit repair
        run: |
          git config user.name "AlphaPilot CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/r10_full_battery.py scripts/r10_contract_test.py .github/workflows/r10_five_year_compound.yml
          git commit -m "fix: unify long-run regression on documented causal R10"
          git push
