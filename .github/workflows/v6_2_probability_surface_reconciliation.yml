name: V6.2 Probability Surface Reconciliation
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/reconcile_v6_2_probability_surface.py'
      - '.github/workflows/v6_2_probability_surface_reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '35425042469'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Download successful full-market source scores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_inputs
          gh run download "${SOURCE_RUN_ID}" -D source_inputs
          echo "profit=$(find source_inputs -type f -name '*_FULL_2024_SCORES.parquet' | grep -v 'LAUNCH_CONDITIONAL' | wc -l)"
          echo "launch=$(find source_inputs -type f -name 'V6_2_LAUNCH_CONDITIONAL_FULL_2024_SCORES.parquet' | wc -l)"
      - name: Compile reconciliation script
        run: python -m py_compile scripts/reconcile_v6_2_probability_surface.py
      - name: Reconcile and validate probability surface
        run: python -u scripts/reconcile_v6_2_probability_surface.py
      - uses: actions/upload-artifact@v4
        with:
          name: v6-2-probability-surface-reconciled
          path: v6_2_probability_surface_reconciliation/
          if-no-files-found: error
          retention-days: 90
