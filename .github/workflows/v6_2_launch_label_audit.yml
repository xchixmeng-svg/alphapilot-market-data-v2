name: V6.2 Launch Label Audit
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/audit_v6_2_launch_label.py'
      - '.github/workflows/v6_2_launch_label_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      V1_ARTIFACT: '10570644207'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Download admitted V1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/v1
          gh api -H 'Accept: application/vnd.github+json'             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V1_ARTIFACT}/zip" > /tmp/v1.zip
          unzip -oq /tmp/v1.zip -d inputs/v1
          test -s inputs/v1/EVIDENCE_BUNDLE_V1.parquet
      - name: Audit launch label definition
        run: python -u scripts/audit_v6_2_launch_label.py
      - uses: actions/upload-artifact@v4
        with:
          name: v6-2-launch-label-audit
          path: out/
          if-no-files-found: error
          retention-days: 90
