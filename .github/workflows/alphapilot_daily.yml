name: AlphaPilot Daily Taiwan Market Data V3.7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/alphapilot_daily.yml"
      - ".github/alphapilot_fetch_trigger"
  pull_request:
    paths:
      - ".github/workflows/alphapilot_daily.yml"
      - "scripts/fetch_today.py"
  schedule:
    # 17:40 Asia/Taipei
    - cron: "40 9 * * 1-5"
    # 18:40 Asia/Taipei backup
    - cron: "40 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: alphapilot-daily-market-data-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Syntax check
        run: python -m py_compile scripts/fetch_today.py

      - name: Fetch normalize validate Taiwan market data
        run: python scripts/fetch_today.py

      - name: Commit daily data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          TRADE_DATE="$(cat .alphapilot_trade_date)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "data: AlphaPilot V3.7 ${TRADE_DATE}"
          git push
