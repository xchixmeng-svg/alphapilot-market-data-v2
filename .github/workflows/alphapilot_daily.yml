name: AlphaPilot Daily Taiwan Market Data V3

on:
  workflow_dispatch:
  schedule:
    - cron: "40 9 * * 1-5"
    - cron: "40 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: alphapilot-daily-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch normalize validate Taiwan market data
        shell: bash
        run: |
          cat > fetch_today.py <<'PY'
          import csv
          import json
          import re
          import time
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests


          TZ = ZoneInfo("Asia/Taipei")
          now = datetime.now(TZ)

          trade_date = now.strftime("%Y-%m-%d")
          ymd = now.strftime("%Y%m%d")

          base = Path("data") / trade_date
          raw_dir = base / "raw"
          norm_dir = base / "normalized"

          raw_dir.mkdir(parents=True, exist_ok=True)
          norm_dir.mkdir(parents=True, exist_ok=True)

          session = requests.Session()

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/plain,*/*",
          }


          SOURCES = {
              "twse_ohlcv": (
                  "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
                  {},
              ),

              "tpex_ohlcv": (
                  "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes",
                  {},
              ),

              "twse_institutional": (
                  "https://www.twse.com.tw/rwd/zh/fund/T86",
                  {
                      "date": ymd,
                      "selectType": "ALLBUT0999",
                      "response": "json",
                  },
              ),

              "tpex_institutional": (
                  "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading",
                  {},
              ),
          }


          def get_json(name, url, params):
              last_error = None

              for attempt in range(6):
                  try:
                      r = session.get(
                          url,
                          params=params,
                          headers=headers,
                          timeout=(15, 60),
                      )

                      r.raise_for_status()

                      text = r.text.strip()

                      if not text:
                          raise RuntimeError("empty response")

                      return r.json()

                  except Exception as exc:
                      last_error = exc

                      if attempt < 5:
                          wait = min(30, 2 ** attempt)

                          print(
                              f"[retry] {name} "
                              f"attempt={attempt + 1} "
                              f"error={exc} "
                              f"sleep={wait}s",
                              flush=True,
                          )

                          time.sleep(wait)

              raise RuntimeError(
                  f"{name} failed after retries: {last_error}"
              )


          payloads = {}

          for name, (url, params) in SOURCES.items():

              print(f"[fetch] {name}", flush=True)

              payload = get_json(
                  name,
                  url,
                  params,
              )

              payloads[name] = payload

              (
                  raw_dir /
                  f"{name}.json"
              ).write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )


          def norm_key(value):
              return re.sub(
                  r"[\s_\-()/（）]+",
                  "",
                  str(value or ""),
              ).lower()


          def num(value):
              if value is None:
                  return None

              s = (
                  str(value)
                  .strip()
                  .replace(",", "")
                  .replace("+", "")
              )

              if s in {
                  "",
                  "--",
                  "---",
                  "----",
                  "null",
                  "None",
              }:
                  return None

              try:
                  return float(s)

              except Exception:
                  return None


          def integer(value):
              x = num(value)

              if x is None:
                  return None

              return int(round(x))


          def pick_exact(d, *keys):
              if not isinstance(d, dict):
                  return None

              normalized = {
                  norm_key(k): v
                  for k, v in d.items()
              }

              for key in keys:
                  nk = norm_key(key)

                  if nk in normalized:
                      return normalized[nk]

              return None


          def pick_contains(
              d,
              include_groups,
              exclude_terms=(),
          ):
              if not isinstance(d, dict):
                  return None

              for key, value in d.items():

                  nk = norm_key(key)

                  if any(
                      norm_key(x) in nk
                      for x in exclude_terms
                  ):
                      continue

                  matched = True

                  for group in include_groups:

                      if isinstance(group, str):
                          group = [group]

                      if not any(
                          norm_key(term) in nk
                          for term in group
                      ):
                          matched = False
                          break

                  if matched:
                      return value

              return None


          def write_csv(path, rows):
              if not rows:
                  raise RuntimeError(
                      f"refusing to write empty CSV: {path}"
                  )

              fields = list(
                  rows[0].keys()
              )

              with path.open(
                  "w",
                  newline="",
                  encoding="utf-8-sig",
              ) as f:

                  writer = csv.DictWriter(
                      f,
                      fieldnames=fields,
                  )

                  writer.writeheader()
                  writer.writerows(rows)


          # =========================================================
          # TWSE OHLCV
          # =========================================================

          def normalize_twse_ohlcv(payload):

              if not isinstance(
                  payload,
                  list,
              ):
                  raise RuntimeError(
                      "TWSE STOCK_DAY_ALL payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick_exact(
                          r,
                          "Code",
                          "證券代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TWSE",

                      "stock_id":
                          code,

                      "name":
                          pick_exact(
                              r,
                              "Name",
                              "證券名稱",
                          ),

                      "open":
                          num(
                              pick_exact(
                                  r,
                                  "OpeningPrice",
                                  "Open",
                                  "開盤價",
                              )
                          ),

                      "high":
                          num(
                              pick_exact(
                                  r,
                                  "HighestPrice",
                                  "High",
                                  "最高價",
                              )
                          ),

                      "low":
                          num(
                              pick_exact(
                                  r,
                                  "LowestPrice",
                                  "Low",
                                  "最低價",
                              )
                          ),

                      "close":
                          num(
                              pick_exact(
                                  r,
                                  "ClosingPrice",
                                  "Close",
                                  "收盤價",
                              )
                          ),

                      "volume":
                          integer(
                              pick_exact(
                                  r,
                                  "TradeVolume",
                                  "TradingShares",
                                  "成交股數",
                              )
                          ),

                      "trading_value":
                          integer(
                              pick_exact(
                                  r,
                                  "TradeValue",
                                  "TransactionAmount",
                                  "成交金額",
                              )
                          ),
                  })

              return out


          # =========================================================
          # TPEx OHLCV
          # =========================================================

          def normalize_tpex_ohlcv(payload):

              if not isinstance(
                  payload,
                  list,
              ):
                  raise RuntimeError(
                      "TPEx OHLCV payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick_exact(
                          r,
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TPEX",

                      "stock_id":
                          code,

                      "name":
                          pick_exact(
                              r,
                              "CompanyName",
                              "Name",
                              "證券名稱",
                              "名稱",
                          ),

                      "open":
                          num(
                              pick_exact(
                                  r,
                                  "Open",
                                  "開盤價",
                              )
                          ),

                      "high":
                          num(
                              pick_exact(
                                  r,
                                  "High",
                                  "最高價",
                              )
                          ),

                      "low":
                          num(
                              pick_exact(
                                  r,
                                  "Low",
                                  "最低價",
                              )
                          ),

                      "close":
                          num(
                              pick_exact(
                                  r,
                                  "Close",
                                  "收盤價",
                              )
                          ),

                      "volume":
                          integer(
                              pick_exact(
                                  r,
                                  "TradingShares",
                                  "TradeVolume",
                                  "成交股數",
                                  "成交量",
                              )
                          ),

                      "trading_value":
                          integer(
                              pick_exact(
                                  r,
                                  "TransactionAmount",
                                  "TradeValue",
                                  "成交金額",
                              )
                          ),
                  })

              return out


          # =========================================================
          # TWSE T86
          # =========================================================

          def find_twse_t86_table(payload):

              if not isinstance(
                  payload,
                  dict,
              ):
                  raise RuntimeError(
                      "TWSE T86 payload is not dict"
                  )

              candidates = []

              for key, value in payload.items():

                  if (
                      str(key).startswith("fields")
                      and
                      isinstance(value, list)
                  ):

                      suffix = str(key)[6:]

                      data = payload.get(
                          "data" + suffix
                      )

                      if not isinstance(
                          data,
                          list,
                      ):
                          continue

                      joined = "|".join(
                          map(str, value)
                      )

                      if (
                          "證券代號" in joined
                          and
                          "投信" in joined
                      ):
                          candidates.append(
                              (
                                  value,
                                  data,
                              )
                          )

              if not candidates:
                  raise RuntimeError(
                      "TWSE T86 table not found"
                  )

              return max(
                  candidates,
                  key=lambda x: len(x[1]),
              )


          def normalize_twse_inst(payload):

              fields, rows = (
                  find_twse_t86_table(
                      payload
                  )
              )

              out = []

              for row in rows:

                  d = {
                      fields[idx]:
                          (
                              row[idx]
                              if idx < len(row)
                              else None
                          )

                      for idx
                      in range(len(fields))
                  }

                  code = str(
                      pick_contains(
                          d,
                          [
                              [
                                  "證券代號",
                              ],
                          ],
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue

                  name = pick_contains(
                      d,
                      [
                          [
                              "證券名稱",
                          ],
                      ],
                  )

                  foreign_buy = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "外陸資",
                                  "外資及陸資",
                              ],
                              [
                                  "買進",
                              ],
                          ],
                          exclude_terms=[
                              "自營商",
                          ],
                      )
                  )

                  foreign_sell = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "外陸資",
                                  "外資及陸資",
                              ],
                              [
                                  "賣出",
                              ],
                          ],
                          exclude_terms=[
                              "自營商",
                          ],
                      )
                  )

                  foreign_net = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "外陸資",
                                  "外資及陸資",
                              ],
                              [
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                          exclude_terms=[
                              "自營商",
                          ],
                      )
                  )

                  trust_buy = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "投信",
                              ],
                              [
                                  "買進",
                              ],
                          ],
                      )
                  )

                  trust_sell = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "投信",
                              ],
                              [
                                  "賣出",
                              ],
                          ],
                      )
                  )

                  trust_net = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "投信",
                              ],
                              [
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                      )
                  )

                  dealer_buy = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "自營商",
                              ],
                              [
                                  "買進",
                              ],
                          ],
                      )
                  )

                  dealer_sell = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "自營商",
                              ],
                              [
                                  "賣出",
                              ],
                          ],
                      )
                  )

                  dealer_net = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "自營商",
                              ],
                              [
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                      )
                  )

                  total_inst_net = integer(
                      pick_contains(
                          d,
                          [
                              [
                                  "三大法人",
                                  "合計",
                              ],
                              [
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                      )
                  )

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TWSE",

                      "stock_id":
                          code,

                      "name":
                          name,

                      "foreign_buy":
                          foreign_buy,

                      "foreign_sell":
                          foreign_sell,

                      "foreign_net":
                          foreign_net,

                      "trust_buy":
                          trust_buy,

                      "trust_sell":
                          trust_sell,

                      "trust_net":
                          trust_net,

                      "dealer_buy":
                          dealer_buy,

                      "dealer_sell":
                          dealer_sell,

                      "dealer_net":
                          dealer_net,

                      "total_inst_net":
                          total_inst_net,

                      "raw_json":
                          json.dumps(
                              d,
                              ensure_ascii=False,
                              separators=(
                                  ",",
                                  ":",
                              ),
                          ),
                  })

              return out


          # =========================================================
          # TPEx Institutional
          # =========================================================

          def normalize_tpex_inst(payload):

              if not isinstance(
                  payload,
                  list,
              ):
                  raise RuntimeError(
                      "TPEx institutional payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick_exact(
                          r,
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue

                  name = pick_exact(
                      r,
                      "CompanyName",
                      "Name",
                      "證券名稱",
                      "名稱",
                  )

                  foreign_buy = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "foreign",
                                  "外資",
                                  "外陸資",
                              ],
                              [
                                  "buy",
                                  "買進",
                              ],
                          ],
                      )
                  )

                  foreign_sell = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "foreign",
                                  "外資",
                                  "外陸資",
                              ],
                              [
                                  "sell",
                                  "賣出",
                              ],
                          ],
                      )
                  )

                  foreign_net = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "foreign",
                                  "外資",
                                  "外陸資",
                              ],
                              [
                                  "difference",
                                  "net",
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                      )
                  )

                  trust_buy = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "investmenttrust",
                                  "trust",
                                  "投信",
                              ],
                              [
                                  "buy",
                                  "買進",
                              ],
                          ],
                      )
                  )

                  trust_sell = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "investmenttrust",
                                  "trust",
                                  "投信",
                              ],
                              [
                                  "sell",
                                  "賣出",
                              ],
                          ],
                      )
                  )

                  trust_net = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "investmenttrust",
                                  "trust",
                                  "投信",
                              ],
                              [
                                  "difference",
                                  "net",
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                      )
                  )

                  dealer_buy = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "dealer",
                                  "自營商",
                              ],
                              [
                                  "buy",
                                  "買進",
                              ],
                          ],
                      )
                  )

                  dealer_sell = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "dealer",
                                  "自營商",
                              ],
                              [
                                  "sell",
                                  "賣出",
                              ],
                          ],
                      )
                  )

                  dealer_net = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "dealer",
                                  "自營商",
                              ],
                              [
                                  "difference",
                                  "net",
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                      )
                  )

                  total_inst_net = integer(
                      pick_contains(
                          r,
                          [
                              [
                                  "total",
                                  "three",
                                  "三大法人",
                                  "合計",
                              ],
                              [
                                  "difference",
                                  "net",
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                      )
                  )

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TPEX",

                      "stock_id":
                          code,

                      "name":
                          name,

                      "foreign_buy":
                          foreign_buy,

                      "foreign_sell":
                          foreign_sell,

                      "foreign_net":
                          foreign_net,

                      "trust_buy":
                          trust_buy,

                      "trust_sell":
                          trust_sell,

                      "trust_net":
                          trust_net,

                      "dealer_buy":
                          dealer_buy,

                      "dealer_sell":
                          dealer_sell,

                      "dealer_net":
                          dealer_net,

                      "total_inst_net":
                          total_inst_net,

                      "raw_json":
                          json.dumps(
                              r,
                              ensure_ascii=False,
                              separators=(
                                  ",",
                                  ":",
                              ),
                          ),
                  })

              return out


          # =========================================================
          # Normalize
          # =========================================================

          normalized = {
              "twse_ohlcv":
                  normalize_twse_ohlcv(
                      payloads[
                          "twse_ohlcv"
                      ]
                  ),

              "tpex_ohlcv":
                  normalize_tpex_ohlcv(
                      payloads[
                          "tpex_ohlcv"
                      ]
                  ),

              "twse_institutional":
                  normalize_twse_inst(
                      payloads[
                          "twse_institutional"
                      ]
                  ),

              "tpex_institutional":
                  normalize_tpex_inst(
                      payloads[
                          "tpex_institutional"
                      ]
                  ),
          }


          # =========================================================
          # Write normalized CSV
          # =========================================================

          for name, rows in normalized.items():

              write_csv(
                  norm_dir /
                  f"{name}.csv",
                  rows,
              )


          # =========================================================
          # Validation
          # =========================================================

          row_counts = {
              name: len(rows)
              for name, rows
              in normalized.items()
          }


          minimum_rows = {
              "twse_ohlcv": 800,
              "tpex_ohlcv": 500,
              "twse_institutional": 700,
              "tpex_institutional": 400,
          }


          errors = []
          warnings = []


          for name, minimum in minimum_rows.items():

              count = row_counts.get(
                  name,
                  0,
              )

              if count < minimum:

                  errors.append(
                      f"{name}: row count "
                      f"{count} < minimum "
                      f"{minimum}"
                  )


          # =========================================================
          # Date validation
          # =========================================================

          for name, rows in normalized.items():

              bad_dates = sum(
                  1
                  for r in rows
                  if r.get(
                      "trade_date"
                  ) != trade_date
              )

              if bad_dates:

                  errors.append(
                      f"{name}: bad trade_date "
                      f"rows={bad_dates}"
                  )


          # =========================================================
          # Duplicate stock validation
          # =========================================================

          for name, rows in normalized.items():

              codes = [
                  r.get("stock_id")
                  for r in rows
              ]

              duplicates = (
                  len(codes)
                  -
                  len(set(codes))
              )

              if duplicates > 0:

                  errors.append(
                      f"{name}: duplicate "
                      f"stock rows={duplicates}"
                  )


          # =========================================================
          # OHLC validation
          # =========================================================

          for name in (
              "twse_ohlcv",
              "tpex_ohlcv",
          ):

              rows = normalized[name]

              null_close = 0
              bad_ohlc = 0

              for r in rows:

                  o = r.get("open")
                  h = r.get("high")
                  l = r.get("low")
                  c = r.get("close")

                  if c is None:
                      null_close += 1
                      continue

                  if (
                      h is not None
                      and
                      l is not None
                      and
                      h < l
                  ):
                      bad_ohlc += 1

                  if (
                      h is not None
                      and
                      o is not None
                      and
                      h < o
                  ):
                      bad_ohlc += 1

                  if (
                      h is not None
                      and
                      c is not None
                      and
                      h < c
                  ):
                      bad_ohlc += 1

                  if (
                      l is not None
                      and
                      o is not None
                      and
                      l > o
                  ):
                      bad_ohlc += 1

                  if (
                      l is not None
                      and
                      c is not None
                      and
                      l > c
                  ):
                      bad_ohlc += 1

              if bad_ohlc > 0:

                  errors.append(
                      f"{name}: OHLC sanity "
                      f"errors={bad_ohlc}"
                  )

              null_ratio = (
                  null_close /
                  max(
                      1,
                      len(rows),
                  )
              )

              if null_ratio > 0.05:

                  errors.append(
                      f"{name}: null close "
                      f"ratio={null_ratio:.1%}"
                  )


          # =========================================================
          # Institutional coverage
          # =========================================================

          for market in (
              "twse",
              "tpex",
          ):

              price_codes = {
                  r["stock_id"]
                  for r in normalized[
                      f"{market}_ohlcv"
                  ]
              }

              inst_codes = {
                  r["stock_id"]
                  for r in normalized[
                      f"{market}_institutional"
                  ]
              }

              overlap = len(
                  price_codes
                  &
                  inst_codes
              )

              coverage = (
                  overlap /
                  max(
                      1,
                      len(price_codes),
                  )
              )

              if coverage < 0.65:

                  errors.append(
                      f"{market.upper()} "
                      f"institutional coverage "
                      f"too low: "
                      f"{coverage:.1%}"
                  )

              elif coverage < 0.80:

                  warnings.append(
                      f"{market.upper()} "
                      f"institutional coverage "
                      f"warning: "
                      f"{coverage:.1%}"
                  )


          # =========================================================
          # Institutional flattened-field validation
          # =========================================================

          for name in (
              "twse_institutional",
              "tpex_institutional",
          ):

              rows = normalized[name]

              foreign_non_null = sum(
                  1
                  for r in rows
                  if r.get(
                      "foreign_net"
                  ) is not None
              )

              trust_non_null = sum(
                  1
                  for r in rows
                  if r.get(
                      "trust_net"
                  ) is not None
              )

              dealer_non_null = sum(
                  1
                  for r in rows
                  if r.get(
                      "dealer_net"
                  ) is not None
              )

              if foreign_non_null < 100:

                  warnings.append(
                      f"{name}: foreign_net "
                      f"non-null only "
                      f"{foreign_non_null}"
                  )

              if trust_non_null < 100:

                  warnings.append(
                      f"{name}: trust_net "
                      f"non-null only "
                      f"{trust_non_null}"
                  )

              if dealer_non_null < 100:

                  warnings.append(
                      f"{name}: dealer_net "
                      f"non-null only "
                      f"{dealer_non_null}"
                  )


          # =========================================================
          # Manifest
          # =========================================================

          manifest = {
              "trade_date":
                  trade_date,

              "generated_at":
                  datetime.now(
                      TZ
                  ).isoformat(),

              "status":
                  "PASS"
                  if not errors
                  else "FAIL",

              "row_counts":
                  row_counts,

              "errors":
                  errors,

              "warnings":
                  warnings,

              "sources": {
                  "twse_ohlcv":
                      "TWSE STOCK_DAY_ALL",

                  "tpex_ohlcv":
                      "TPEx tpex_mainboard_daily_close_quotes",

                  "twse_institutional":
                      "TWSE T86",

                  "tpex_institutional":
                      "TPEx tpex_3insti_daily_trading",
              },

              "version":
                  "AlphaPilot-Data-V3",
          }


          (
              base /
              "manifest.json"
          ).write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )


          print(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              )
          )


          if errors:
              raise SystemExit(2)

          PY

          python fetch_today.py


