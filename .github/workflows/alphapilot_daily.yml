name: AlphaPilot Daily Taiwan Market Data

on:
  workflow_dispatch:
  schedule:
    # 17:40 Asia/Taipei = 09:40 UTC
    - cron: "40 9 * * 1-5"
    # 18:40 Asia/Taipei = 10:40 UTC
    - cron: "40 10 * * 1-5"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Taiwan market data
        shell: bash
        run: |
          cat > fetch_today.py <<'PY'
          import json
          import time
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests

          TZ = ZoneInfo("Asia/Taipei")
          now = datetime.now(TZ)
          date_iso = now.strftime("%Y-%m-%d")
          ymd = now.strftime("%Y%m%d")
          slash = now.strftime("%Y/%m/%d")

          out = Path("data") / date_iso
          out.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/plain,*/*",
          }

          sources = {
              "twse_ohlcv": (
                  "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX",
                  {
                      "date": ymd,
                      "type": "ALLBUT0999",
                      "response": "json",
                  },
              ),
              "tpex_ohlcv": (
                  "https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes",
                  {
                      "date": slash,
                      "response": "json",
                  },
              ),
              "twse_institutional": (
                  "https://www.twse.com.tw/rwd/zh/fund/T86",
                  {
                      "date": ymd,
                      "selectType": "ALLBUT0999",
                      "response": "json",
                  },
              ),
              "tpex_institutional": (
                  "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading",
                  {},
              ),
          }

          def get_json(name, url, params):
              last_error = None

              for attempt in range(6):
                  try:
                      response = session.get(
                          url,
                          params=params,
                          headers=headers,
                          timeout=45,
                      )
                      response.raise_for_status()
                      return response.json()

                  except Exception as exc:
                      last_error = exc

                      if attempt < 5:
                          wait = min(30, 2 ** attempt)
                          print(
                              f"{name} attempt {attempt + 1} failed: {exc}; "
                              f"retry in {wait}s"
                          )
                          time.sleep(wait)

              raise RuntimeError(
                  f"{name} failed after retries: {last_error}"
              )

          payloads = {}

          for name, (url, params) in sources.items():
              print(f"Fetching {name} ...")
              payload = get_json(name, url, params)
              payloads[name] = payload

              path = out / f"{name}.json"
              path.write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

          def estimate_rows(payload):
              if isinstance(payload, list):
                  return len(payload)

              if isinstance(payload, dict):
                  counts = []

                  for key, value in payload.items():
                      if (
                          str(key).startswith("data")
                          and isinstance(value, list)
                      ):
                          counts.append(len(value))

                  if counts:
                      return max(counts)

              return 0

          row_counts = {
              name: estimate_rows(payload)
              for name, payload in payloads.items()
          }

          minimum_rows = {
              "twse_ohlcv": 800,
              "tpex_ohlcv": 500,
              "twse_institutional": 700,
              "tpex_institutional": 400,
          }

          errors = []

          for name, minimum in minimum_rows.items():
              count = row_counts.get(name, 0)

              if count < minimum:
                  errors.append(
                      f"{name}: row count {count} < minimum {minimum}"
                  )

          manifest = {
              "trade_date": date_iso,
              "generated_at": datetime.now(TZ).isoformat(),
              "status": "PASS" if not errors else "FAIL",
              "row_counts": row_counts,
              "errors": errors,
              "sources": {
                  "twse_ohlcv": "TWSE MI_INDEX",
                  "tpex_ohlcv": "TPEx dailyQuotes",
                  "twse_institutional": "TWSE T86",
                  "tpex_institutional":
                      "TPEx tpex_3insti_daily_trading",
              },
          }

          (out / "manifest.json").write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              )
          )

          if errors:
              raise SystemExit(2)

          PY

          python fetch_today.py

      - name: Commit daily data
        shell: bash
        run: |
          git config user.name "AlphaPilot Data Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: Taiwan market $(TZ=Asia/Taipei date +%F)"
          git push
