name: AlphaPilot Daily Taiwan Market Data V3.6

on:
  workflow_dispatch:
  schedule:
    # 17:40 Asia/Taipei
    - cron: "40 9 * * 1-5"
    # 18:40 Asia/Taipei backup
    - cron: "40 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: alphapilot-daily-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch normalize validate Taiwan market data
        shell: bash
        run: |
          cat > fetch_today.py <<'PY'
          import csv
          import json
          import re
          import time
          from collections import Counter
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests


          # ============================================================
          # BASIC
          # ============================================================

          VERSION = "AlphaPilot-Data-V3.6"

          TZ = ZoneInfo("Asia/Taipei")
          now = datetime.now(TZ)

          session = requests.Session()

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/plain,*/*",
          }


          # ============================================================
          # HTTP
          # ============================================================

          def get_json(name, url, params=None):
              params = params or {}
              last_error = None

              for attempt in range(6):
                  try:
                      r = session.get(
                          url,
                          params=params,
                          headers=HEADERS,
                          timeout=(15, 60),
                      )

                      r.raise_for_status()

                      text = r.text.strip()

                      if not text:
                          raise RuntimeError("empty response")

                      return r.json()

                  except Exception as exc:
                      last_error = exc

                      if attempt < 5:
                          wait = min(30, 2 ** attempt)

                          print(
                              f"[retry] {name} "
                              f"attempt={attempt + 1} "
                              f"error={exc} "
                              f"sleep={wait}s",
                              flush=True,
                          )

                          time.sleep(wait)

              raise RuntimeError(
                  f"{name} failed after retries: {last_error}"
              )


          # ============================================================
          # HELPERS
          # ============================================================

          def norm_key(value):
              return re.sub(
                  r"[\s_\-()/（）]+",
                  "",
                  str(value or ""),
              ).lower()


          def num(value):
              if value is None:
                  return None

              s = (
                  str(value)
                  .strip()
                  .replace(",", "")
                  .replace("+", "")
              )

              if s in {
                  "",
                  "--",
                  "---",
                  "----",
                  "null",
                  "None",
              }:
                  return None

              try:
                  return float(s)

              except Exception:
                  return None


          def integer(value):
              x = num(value)

              if x is None:
                  return None

              return int(round(x))


          def pick(d, *keys):
              if not isinstance(d, dict):
                  return None

              mapping = {
                  norm_key(k): v
                  for k, v in d.items()
              }

              for key in keys:
                  nk = norm_key(key)

                  if nk in mapping:
                      return mapping[nk]

              return None


          def write_csv(path, rows):
              if not rows:
                  raise RuntimeError(
                      f"refusing to write empty CSV: {path}"
                  )

              fields = list(rows[0].keys())

              with path.open(
                  "w",
                  newline="",
                  encoding="utf-8-sig",
              ) as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=fields,
                  )

                  writer.writeheader()
                  writer.writerows(rows)


          # ============================================================
          # DATE PARSER
          # ============================================================

          def parse_date(value):
              if value is None:
                  return None

              s = str(value).strip()

              digits = re.sub(
                  r"[^\d]",
                  "",
                  s,
              )

              # Gregorian YYYYMMDD
              if len(digits) == 8:
                  try:
                      return datetime.strptime(
                          digits,
                          "%Y%m%d",
                      ).date()

                  except Exception:
                      pass

              # ROC YYYMMDD
              if len(digits) == 7:
                  try:
                      roc_year = int(
                          digits[:3]
                      )

                      gregorian_year = (
                          roc_year + 1911
                      )

                      return datetime.strptime(
                          f"{gregorian_year}"
                          f"{digits[3:]}",
                          "%Y%m%d",
                      ).date()

                  except Exception:
                      pass

              return None


          DATE_KEYS = {
              "date",
              "tradedate",
              "tradingdate",
              "日期",
              "交易日期",
              "成交日期",
          }


          def collect_dates(payload):
              dates = []

              if isinstance(payload, list):

                  rows = payload[:500]

                  for row in rows:

                      if not isinstance(
                          row,
                          dict,
                      ):
                          continue

                      for key, value in (
                          row.items()
                      ):

                          nk = norm_key(key)

                          if nk not in DATE_KEYS:
                              continue

                          d = parse_date(value)

                          if d:
                              dates.append(d)

              elif isinstance(payload, dict):

                  # Some APIs put date at top level
                  for key, value in (
                      payload.items()
                  ):

                      nk = norm_key(key)

                      if nk in DATE_KEYS:

                          d = parse_date(
                              value
                          )

                          if d:
                              dates.append(d)

                  # Search table-like arrays too
                  for key, value in (
                      payload.items()
                  ):

                      if not isinstance(
                          value,
                          list,
                      ):
                          continue

                      for row in value[:500]:

                          if not isinstance(
                              row,
                              dict,
                          ):
                              continue

                          for rk, rv in (
                              row.items()
                          ):

                              nk = norm_key(
                                  rk
                              )

                              if (
                                  nk
                                  not in
                                  DATE_KEYS
                              ):
                                  continue

                              d = parse_date(
                                  rv
                              )

                              if d:
                                  dates.append(
                                      d
                                  )

              return dates


          def payload_date(
              name,
              payload,
          ):
              dates = collect_dates(
                  payload
              )

              if not dates:

                  raise RuntimeError(
                      f"{name}: cannot determine "
                      f"official payload date"
                  )

              counter = Counter(
                  dates
              )

              best_date, count = (
                  counter.most_common(1)[0]
              )

              ratio = (
                  count
                  /
                  len(dates)
              )

              print(
                  f"[date] {name}: "
                  f"{best_date} "
                  f"votes={count}/"
                  f"{len(dates)} "
                  f"ratio={ratio:.1%}",
                  flush=True,
              )

              if ratio < 0.80:

                  raise RuntimeError(
                      f"{name}: date consensus "
                      f"too weak "
                      f"({ratio:.1%})"
                  )

              return best_date


          # ============================================================
          # FETCH SNAPSHOT SOURCES FIRST
          # ============================================================

          print(
              "[fetch] twse_ohlcv",
              flush=True,
          )

          twse_ohlcv_payload = get_json(
              "twse_ohlcv",
              "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
          )


          print(
              "[fetch] tpex_ohlcv",
              flush=True,
          )

          tpex_ohlcv_payload = get_json(
              "tpex_ohlcv",
              "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes",
          )


          print(
              "[fetch] tpex_institutional",
              flush=True,
          )

          tpex_inst_payload = get_json(
              "tpex_institutional",
              "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading",
          )


          # ============================================================
          # DETECT REAL SNAPSHOT DATES
          # ============================================================

          twse_ohlcv_date = payload_date(
              "twse_ohlcv",
              twse_ohlcv_payload,
          )

          tpex_ohlcv_date = payload_date(
              "tpex_ohlcv",
              tpex_ohlcv_payload,
          )

          tpex_inst_date = payload_date(
              "tpex_institutional",
              tpex_inst_payload,
          )


          snapshot_dates = {
              "twse_ohlcv":
                  twse_ohlcv_date,

              "tpex_ohlcv":
                  tpex_ohlcv_date,

              "tpex_institutional":
                  tpex_inst_date,
          }


          unique_snapshot_dates = set(
              snapshot_dates.values()
          )


          if len(
              unique_snapshot_dates
          ) != 1:

              diagnostic = {
                  "version":
                      VERSION,

                  "execution_time":
                      now.isoformat(),

                  "status":
                      "FAIL",

                  "reason":
                      "SNAPSHOT_DATE_MISMATCH",

                  "source_dates": {
                      k: str(v)
                      for k, v
                      in snapshot_dates.items()
                  },

                  "errors": [
                      "TWSE OHLCV, TPEx OHLCV "
                      "and TPEx institutional "
                      "are not on the same "
                      "official trading date"
                  ],
              }

              print(
                  json.dumps(
                      diagnostic,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  flush=True,
              )

              raise SystemExit(2)


          trade_day = next(
              iter(
                  unique_snapshot_dates
              )
          )

          trade_date = (
              trade_day.strftime(
                  "%Y-%m-%d"
              )
          )

          ymd = trade_day.strftime(
              "%Y%m%d"
          )


          print(
              f"[selected] common "
              f"snapshot trade_date="
              f"{trade_date}",
              flush=True,
          )


          # ============================================================
          # FETCH TWSE T86 USING EXACT SAME DATE
          # ============================================================

          print(
              "[fetch] twse_institutional "
              f"date={ymd}",
              flush=True,
          )

          twse_inst_payload = get_json(
              "twse_institutional",
              "https://www.twse.com.tw/rwd/zh/fund/T86",
              {
                  "date": ymd,
                  "selectType":
                      "ALLBUT0999",
                  "response":
                      "json",
              },
          )


          # ============================================================
          # FIND T86 TABLE
          # ============================================================

          def find_t86_table(payload):

              if not isinstance(
                  payload,
                  dict,
              ):
                  raise RuntimeError(
                      "TWSE T86 payload "
                      "is not dict"
                  )

              candidates = []

              for key, fields in (
                  payload.items()
              ):

                  if not (
                      str(key).startswith(
                          "fields"
                      )
                      and isinstance(
                          fields,
                          list,
                      )
                  ):
                      continue

                  suffix = str(key)[6:]

                  rows = payload.get(
                      "data" + suffix
                  )

                  if not isinstance(
                      rows,
                      list,
                  ):
                      continue

                  if not rows:
                      continue

                  joined = "|".join(
                      str(x)
                      for x in fields
                  )

                  score = len(rows)

                  if (
                      "證券代號"
                      in joined
                  ):
                      score += 100000

                  if (
                      "證券名稱"
                      in joined
                  ):
                      score += 50000

                  if (
                      "外資"
                      in joined
                      or
                      "外陸資"
                      in joined
                  ):
                      score += 10000

                  if (
                      "投信"
                      in joined
                  ):
                      score += 10000

                  if (
                      "自營商"
                      in joined
                  ):
                      score += 10000

                  valid_codes = 0

                  for row in rows[:100]:

                      if not isinstance(
                          row,
                          list,
                      ):
                          continue

                      for value in row[:4]:

                          if re.fullmatch(
                              r"\d{4}",
                              str(value).strip(),
                          ):
                              valid_codes += 1
                              break

                  score += (
                      valid_codes
                      * 1000
                  )

                  candidates.append({
                      "score":
                          score,

                      "fields":
                          fields,

                      "rows":
                          rows,

                      "valid_codes":
                          valid_codes,
                  })


              if not candidates:

                  raise RuntimeError(
                      "TWSE T86 table "
                      "not found"
                  )


              candidates.sort(
                  key=lambda x:
                      x["score"],
                  reverse=True,
              )

              best = candidates[0]


              if (
                  best[
                      "valid_codes"
                  ]
                  == 0
              ):

                  raise RuntimeError(
                      "TWSE T86 selected "
                      "table contains no "
                      "valid stock codes"
                  )


              return (
                  best["fields"],
                  best["rows"],
              )


          twse_inst_table = (
              find_t86_table(
                  twse_inst_payload
              )
          )


          # ============================================================
          # OUTPUT DIR - ONLY AFTER DATE ALIGNMENT PASSES
          # ============================================================

          base = (
              Path("data")
              / trade_date
          )

          raw_dir = (
              base / "raw"
          )

          norm_dir = (
              base / "normalized"
          )

          raw_dir.mkdir(
              parents=True,
              exist_ok=True,
          )

          norm_dir.mkdir(
              parents=True,
              exist_ok=True,
          )


          payloads = {
              "twse_ohlcv":
                  twse_ohlcv_payload,

              "tpex_ohlcv":
                  tpex_ohlcv_payload,

              "twse_institutional":
                  twse_inst_payload,

              "tpex_institutional":
                  tpex_inst_payload,
          }


          for name, payload in (
              payloads.items()
          ):

              (
                  raw_dir
                  / f"{name}.json"
              ).write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )


          # ============================================================
          # NORMALIZE TWSE OHLCV
          # ============================================================

          def normalize_twse_ohlcv(
              payload
          ):

              if not isinstance(
                  payload,
                  list,
              ):

                  raise RuntimeError(
                      "TWSE STOCK_DAY_ALL "
                      "payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick(
                          r,
                          "Code",
                          "證券代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue


                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TWSE",

                      "stock_id":
                          code,

                      "name":
                          pick(
                              r,
                              "Name",
                              "證券名稱",
                          ),

                      "open":
                          num(
                              pick(
                                  r,
                                  "OpeningPrice",
                                  "Open",
                                  "開盤價",
                              )
                          ),

                      "high":
                          num(
                              pick(
                                  r,
                                  "HighestPrice",
                                  "High",
                                  "最高價",
                              )
                          ),

                      "low":
                          num(
                              pick(
                                  r,
                                  "LowestPrice",
                                  "Low",
                                  "最低價",
                              )
                          ),

                      "close":
                          num(
                              pick(
                                  r,
                                  "ClosingPrice",
                                  "Close",
                                  "收盤價",
                              )
                          ),

                      "volume":
                          integer(
                              pick(
                                  r,
                                  "TradeVolume",
                                  "TradingShares",
                                  "成交股數",
                              )
                          ),

                      "trading_value":
                          integer(
                              pick(
                                  r,
                                  "TradeValue",
                                  "TransactionAmount",
                                  "成交金額",
                              )
                          ),
                  })

              return out


          # ============================================================
          # NORMALIZE TPEX OHLCV
          # ============================================================

          def normalize_tpex_ohlcv(
              payload
          ):

              if not isinstance(
                  payload,
                  list,
              ):

                  raise RuntimeError(
                      "TPEx OHLCV "
                      "payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick(
                          r,
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue


                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TPEX",

                      "stock_id":
                          code,

                      "name":
                          pick(
                              r,
                              "CompanyName",
                              "Name",
                              "證券名稱",
                              "名稱",
                          ),

                      "open":
                          num(
                              pick(
                                  r,
                                  "Open",
                                  "開盤價",
                              )
                          ),

                      "high":
                          num(
                              pick(
                                  r,
                                  "High",
                                  "最高價",
                              )
                          ),

                      "low":
                          num(
                              pick(
                                  r,
                                  "Low",
                                  "最低價",
                              )
                          ),

                      "close":
                          num(
                              pick(
                                  r,
                                  "Close",
                                  "收盤價",
                              )
                          ),

                      "volume":
                          integer(
                              pick(
                                  r,
                                  "TradingShares",
                                  "TradeVolume",
                                  "成交股數",
                                  "成交量",
                              )
                          ),

                      "trading_value":
                          integer(
                              pick(
                                  r,
                                  "TransactionAmount",
                                  "TradeValue",
                                  "成交金額",
                              )
                          ),
                  })

              return out


          # ============================================================
          # INSTITUTION FIELD HELPERS
          # ============================================================

          def matching_value(
              d,
              institutions,
              actions,
              reject_prefixes=(),
          ):

              candidates = []

              for key, value in (
                  d.items()
              ):

                  nk = norm_key(key)


                  if any(
                      nk.startswith(
                          norm_key(x)
                      )
                      for x
                      in reject_prefixes
                  ):

                      continue


                  if not any(
                      norm_key(x)
                      in nk

                      for x
                      in institutions
                  ):

                      continue


                  if not any(
                      norm_key(x)
                      in nk

                      for x
                      in actions
                  ):

                      continue


                  candidates.append(
                      (
                          -len(nk),
                          value,
                      )
                  )


              if not candidates:
                  return None


              candidates.sort(
                  reverse=True
              )


              return (
                  candidates[0][1]
              )


          def foreign_value(
              d,
              actions,
          ):

              value = matching_value(
                  d,
                  [
                      "外陸資",
                      "外資及陸資",
                  ],
                  actions,
              )

              if value is not None:
                  return value


              return matching_value(
                  d,
                  [
                      "外資",
                  ],
                  actions,
                  reject_prefixes=[
                      "外資自營商",
                  ],
              )


          def trust_value(
              d,
              actions,
          ):

              return matching_value(
                  d,
                  [
                      "投信",
                  ],
                  actions,
              )


          def dealer_value(
              d,
              actions,
          ):

              candidates = []

              for key, value in (
                  d.items()
              ):

                  nk = norm_key(key)


                  if nk.startswith(
                      norm_key(
                          "外資自營商"
                      )
                  ):
                      continue


                  if not nk.startswith(
                      norm_key(
                          "自營商"
                      )
                  ):
                      continue


                  if not any(
                      norm_key(x)
                      in nk

                      for x
                      in actions
                  ):
                      continue


                  score = -len(nk)


                  if (
                      "自行買賣"
                      not in nk
                      and
                      "避險"
                      not in nk
                  ):
                      score += 10000


                  candidates.append(
                      (
                          score,
                          value,
                      )
                  )


              if not candidates:
                  return None


              candidates.sort(
                  reverse=True
              )


              return (
                  candidates[0][1]
              )


          # ============================================================
          # NORMALIZE TWSE T86
          # ============================================================

          def normalize_twse_inst(
              fields,
              rows,
          ):

              out = []

              for row in rows:

                  if not isinstance(
                      row,
                      list,
                  ):
                      continue


                  d = {
                      fields[i]:
                          (
                              row[i]
                              if i < len(row)
                              else None
                          )

                      for i
                      in range(
                          len(fields)
                      )
                  }


                  code = ""


                  for key, value in (
                      d.items()
                  ):

                      if (
                          "證券代號"
                          not in str(key)
                          and
                          "代號"
                          not in str(key)
                      ):
                          continue


                      candidate = str(
                          value
                      ).strip()


                      if re.fullmatch(
                          r"\d{4}",
                          candidate,
                      ):

                          code = candidate
                          break


                  if not code:

                      for value in (
                          row[:4]
                      ):

                          candidate = str(
                              value
                          ).strip()

                          if re.fullmatch(
                              r"\d{4}",
                              candidate,
                          ):

                              code = candidate
                              break


                  if not code:
                      continue


                  name = None


                  for key, value in (
                      d.items()
                  ):

                      if (
                          "證券名稱"
                          in str(key)
                      ):

                          name = value
                          break


                  if (
                      name is None
                      and
                      len(row) > 1
                  ):
                      name = row[1]


                  foreign_buy = integer(
                      foreign_value(
                          d,
                          ["買進"],
                      )
                  )


                  foreign_sell = integer(
                      foreign_value(
                          d,
                          ["賣出"],
                      )
                  )


                  foreign_net = integer(
                      foreign_value(
                          d,
                          [
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  trust_buy = integer(
                      trust_value(
                          d,
                          ["買進"],
                      )
                  )


                  trust_sell = integer(
                      trust_value(
                          d,
                          ["賣出"],
                      )
                  )


                  trust_net = integer(
                      trust_value(
                          d,
                          [
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  dealer_buy = integer(
                      dealer_value(
                          d,
                          ["買進"],
                      )
                  )


                  dealer_sell = integer(
                      dealer_value(
                          d,
                          ["賣出"],
                      )
                  )


                  dealer_net = integer(
                      dealer_value(
                          d,
                          [
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TWSE",

                      "stock_id":
                          code,

                      "name":
                          name,

                      "foreign_buy":
                          foreign_buy,

                      "foreign_sell":
                          foreign_sell,

                      "foreign_net":
                          foreign_net,

                      "trust_buy":
                          trust_buy,

                      "trust_sell":
                          trust_sell,

                      "trust_net":
                          trust_net,

                      "dealer_buy":
                          dealer_buy,

                      "dealer_sell":
                          dealer_sell,

                      "dealer_net":
                          dealer_net,

                      "raw_json":
                          json.dumps(
                              d,
                              ensure_ascii=False,
                              separators=(
                                  ",",
                                  ":",
                              ),
                          ),
                  })


              return out


          # ============================================================
          # NORMALIZE TPEX INSTITUTIONAL
          # ============================================================

          def generic_inst_value(
              row,
              institutions,
              actions,
          ):

              return matching_value(
                  row,
                  institutions,
                  actions,
              )


          def normalize_tpex_inst(
              payload
          ):

              if not isinstance(
                  payload,
                  list,
              ):

                  raise RuntimeError(
                      "TPEx institutional "
                      "payload is not list"
                  )


              out = []


              for r in payload:

                  code = str(
                      pick(
                          r,
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號",
                      )
                      or ""
                  ).strip()


                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue


                  foreign_buy = integer(
                      generic_inst_value(
                          r,
                          [
                              "Foreign",
                              "外資",
                              "外陸資",
                          ],
                          [
                              "Buy",
                              "買進",
                          ],
                      )
                  )


                  foreign_sell = integer(
                      generic_inst_value(
                          r,
                          [
                              "Foreign",
                              "外資",
                              "外陸資",
                          ],
                          [
                              "Sell",
                              "賣出",
                          ],
                      )
                  )


                  foreign_net = integer(
                      generic_inst_value(
                          r,
                          [
                              "Foreign",
                              "外資",
                              "外陸資",
                          ],
                          [
                              "Net",
                              "Difference",
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  trust_buy = integer(
                      generic_inst_value(
                          r,
                          [
                              "InvestmentTrust",
                              "Trust",
                              "投信",
                          ],
                          [
                              "Buy",
                              "買進",
                          ],
                      )
                  )


                  trust_sell = integer(
                      generic_inst_value(
                          r,
                          [
                              "InvestmentTrust",
                              "Trust",
                              "投信",
                          ],
                          [
                              "Sell",
                              "賣出",
                          ],
                      )
                  )


                  trust_net = integer(
                      generic_inst_value(
                          r,
                          [
                              "InvestmentTrust",
                              "Trust",
                              "投信",
                          ],
                          [
                              "Net",
                              "Difference",
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  dealer_buy = integer(
                      generic_inst_value(
                          r,
                          [
                              "Dealer",
                              "自營商",
                          ],
                          [
                              "Buy",
                              "買進",
                          ],
                      )
                  )


                  dealer_sell = integer(
                      generic_inst_value(
                          r,
                          [
                              "Dealer",
                              "自營商",
                          ],
                          [
                              "Sell",
                              "賣出",
                          ],
                      )
                  )


                  dealer_net = integer(
                      generic_inst_value(
                          r,
                          [
                              "Dealer",
                              "自營商",
                          ],
                          [
                              "Net",
                              "Difference",
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TPEX",

                      "stock_id":
                          code,

                      "name":
                          pick(
                              r,
                              "CompanyName",
                              "Name",
                              "證券名稱",
                              "名稱",
                          ),

                      "foreign_buy":
                          foreign_buy,

                      "foreign_sell":
                          foreign_sell,

                      "foreign_net":
                          foreign_net,

                      "trust_buy":
                          trust_buy,

                      "trust_sell":
                          trust_sell,

                      "trust_net":
                          trust_net,

                      "dealer_buy":
                          dealer_buy,

                      "dealer_sell":
                          dealer_sell,

                      "dealer_net":
                          dealer_net,

                      "raw_json":
                          json.dumps(
                              r,
                              ensure_ascii=False,
                              separators=(
                                  ",",
                                  ":",
                              ),
                          ),
                  })


              return out


          # ============================================================
          # NORMALIZE ALL
          # ============================================================

          normalized = {
              "twse_ohlcv":
                  normalize_twse_ohlcv(
                      twse_ohlcv_payload
                  ),

              "tpex_ohlcv":
                  normalize_tpex_ohlcv(
                      tpex_ohlcv_payload
                  ),

              "twse_institutional":
                  normalize_twse_inst(
                      twse_inst_table[0],
                      twse_inst_table[1],
                  ),

              "tpex_institutional":
                  normalize_tpex_inst(
                      tpex_inst_payload
                  ),
          }


          for name, rows in (
              normalized.items()
          ):

              write_csv(
                  norm_dir
                  / f"{name}.csv",
                  rows,
              )


          # ============================================================
          # VALIDATION
          # ============================================================

          errors = []
          warnings = []


          row_counts = {
              name:
                  len(rows)

              for name, rows
              in normalized.items()
          }


          minimum_rows = {
              "twse_ohlcv":
                  800,

              "tpex_ohlcv":
                  500,

              "twse_institutional":
                  700,

              "tpex_institutional":
                  400,
          }


          for name, minimum in (
              minimum_rows.items()
          ):

              count = row_counts.get(
                  name,
                  0,
              )

              if count < minimum:

                  errors.append(
                      f"{name}: "
                      f"row count "
                      f"{count} "
                      f"< minimum "
                      f"{minimum}"
                  )


          # ============================================================
          # DUPLICATES
          # ============================================================

          for name, rows in (
              normalized.items()
          ):

              codes = [
                  r["stock_id"]
                  for r in rows
              ]


              duplicate_count = (
                  len(codes)
                  -
                  len(set(codes))
              )


              if duplicate_count:

                  errors.append(
                      f"{name}: "
                      f"duplicate rows="
                      f"{duplicate_count}"
                  )


          # ============================================================
          # OHLC SANITY
          # ============================================================

          for name in (
              "twse_ohlcv",
              "tpex_ohlcv",
          ):

              rows = normalized[name]

              bad_ohlc = 0
              null_close = 0


              for r in rows:

                  o = r["open"]
                  h = r["high"]
                  l = r["low"]
                  c = r["close"]


                  if c is None:

                      null_close += 1
                      continue


                  if (
                      h is not None
                      and
                      l is not None
                      and
                      h < l
                  ):
                      bad_ohlc += 1


                  if (
                      h is not None
                      and
                      o is not None
                      and
                      h < o
                  ):
                      bad_ohlc += 1


                  if (
                      h is not None
                      and
                      c is not None
                      and
                      h < c
                  ):
                      bad_ohlc += 1


                  if (
                      l is not None
                      and
                      o is not None
                      and
                      l > o
                  ):
                      bad_ohlc += 1


                  if (
                      l is not None
                      and
                      c is not None
                      and
                      l > c
                  ):
                      bad_ohlc += 1


              if bad_ohlc:

                  errors.append(
                      f"{name}: "
                      f"OHLC errors="
                      f"{bad_ohlc}"
                  )


              null_ratio = (
                  null_close
                  /
                  max(
                      1,
                      len(rows),
                  )
              )


              if null_ratio > 0.05:

                  errors.append(
                      f"{name}: "
                      f"null close="
                      f"{null_ratio:.1%}"
                  )


          # ============================================================
          # COVERAGE
          # ============================================================

          coverage = {}


          for market in (
              "twse",
              "tpex",
          ):

              price_codes = {
                  r["stock_id"]

                  for r
                  in normalized[
                      f"{market}_ohlcv"
                  ]
              }


              inst_codes = {
                  r["stock_id"]

                  for r
                  in normalized[
                      f"{market}_institutional"
                  ]
              }


              overlap = len(
                  price_codes
                  &
                  inst_codes
              )


              ratio = (
                  overlap
                  /
                  max(
                      1,
                      len(price_codes),
                  )
              )


              coverage[
                  market
              ] = {
                  "price_codes":
                      len(price_codes),

                  "institutional_codes":
                      len(inst_codes),

                  "overlap":
                      overlap,

                  "coverage":
                      ratio,
              }


              if ratio < 0.65:

                  errors.append(
                      f"{market.upper()} "
                      f"institutional "
                      f"coverage="
                      f"{ratio:.1%}"
                  )


          # ============================================================
          # FLATTEN CHECK
          # ============================================================

          flattened_fields = {}


          for name in (
              "twse_institutional",
              "tpex_institutional",
          ):

              rows = normalized[name]

              stats = {}


              for col in (
                  "foreign_net",
                  "trust_net",
                  "dealer_net",
              ):

                  count = sum(
                      1
                      for r in rows
                      if r.get(col)
                      is not None
                  )


                  stats[col] = count


                  if count < 100:

                      errors.append(
                          f"{name}: "
                          f"{col} "
                          f"non-null only "
                          f"{count}"
                      )


              flattened_fields[
                  name
              ] = stats


          # ============================================================
          # FINAL DATE PROOF
          # ============================================================

          source_dates = {
              "twse_ohlcv":
                  str(
                      twse_ohlcv_date
                  ),

              "tpex_ohlcv":
                  str(
                      tpex_ohlcv_date
                  ),

              "twse_institutional":
                  trade_date,

              "tpex_institutional":
                  str(
                      tpex_inst_date
                  ),
          }


          if len(
              set(
                  source_dates.values()
              )
          ) != 1:

              errors.append(
                  "final source date "
                  "alignment failed"
              )


          # ============================================================
          # MANIFEST
          # ============================================================

          manifest = {
              "version":
                  VERSION,

              "execution_time":
                  now.isoformat(),

              "trade_date":
                  trade_date,

              "status":
                  (
                      "PASS"
                      if not errors
                      else "FAIL"
                  ),

              "source_dates":
                  source_dates,

              "row_counts":
                  row_counts,

              "coverage":
                  coverage,

              "flattened_fields":
                  flattened_fields,

              "warnings":
                  warnings,

              "errors":
                  errors,

              "sources": {
                  "twse_ohlcv":
                      "TWSE STOCK_DAY_ALL",

                  "tpex_ohlcv":
                      "TPEx "
                      "tpex_mainboard_"
                      "daily_close_quotes",

                  "twse_institutional":
                      "TWSE T86",

                  "tpex_institutional":
                      "TPEx "
                      "tpex_3insti_"
                      "daily_trading",
              },
          }


          (
              base
              / "manifest.json"
          ).write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )


          print(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              flush=True,
          )


          if errors:
              raise SystemExit(2)


          # Commit step reads this.
          Path(
              ".alphapilot_trade_date"
          ).write_text(
              trade_date,
              encoding="utf-8",
          )

          PY

          python fetch_today.py


      - name: Commit daily data
        shell: bash
        run: |
          TRADE_DATE=$(cat .alphapilot_trade_date)

          echo "Validated trade date: ${TRADE_DATE}"

          git config user.name "AlphaPilot Data Bot"
          git config user.email "actions@users.noreply.github.com"

          git add "data/${TRADE_DATE}/"

          if git diff --cached --quiet; then
            echo "No validated data changes to commit."
            exit 0
          fi

          git commit -m "data: AlphaPilot V3.6 ${TRADE_DATE}"
          git push
