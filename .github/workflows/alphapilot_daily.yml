name: AlphaPilot Daily Taiwan Market Data V3.2

on:
  workflow_dispatch:
  schedule:
    # Asia/Taipei 17:40
    - cron: "40 9 * * 1-5"
    # Asia/Taipei 18:40 backup
    - cron: "40 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: alphapilot-daily-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch normalize validate Taiwan market data
        shell: bash
        run: |
          cat > fetch_today.py <<'PY'
          import csv
          import json
          import re
          import time
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests


          # ============================================================
          # BASIC
          # ============================================================

          TZ = ZoneInfo("Asia/Taipei")
          now = datetime.now(TZ)

          session = requests.Session()

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/plain,*/*",
          }


          def get_json(name, url, params=None):
              params = params or {}
              last_error = None

              for attempt in range(6):
                  try:
                      r = session.get(
                          url,
                          params=params,
                          headers=HEADERS,
                          timeout=(15, 60),
                      )

                      r.raise_for_status()

                      if not r.text.strip():
                          raise RuntimeError(
                              "empty response"
                          )

                      return r.json()

                  except Exception as exc:
                      last_error = exc

                      if attempt < 5:
                          wait = min(
                              30,
                              2 ** attempt,
                          )

                          print(
                              f"[retry] {name} "
                              f"attempt={attempt + 1} "
                              f"error={exc} "
                              f"sleep={wait}s",
                              flush=True,
                          )

                          time.sleep(wait)

              raise RuntimeError(
                  f"{name} failed after retries: "
                  f"{last_error}"
              )


          # ============================================================
          # DATE HELPERS
          # ============================================================

          def parse_api_date(value):
              if value is None:
                  return None

              s = str(value).strip()

              s = re.sub(
                  r"[^\d]",
                  "",
                  s,
              )

              # Gregorian YYYYMMDD
              if len(s) == 8:
                  try:
                      return datetime.strptime(
                          s,
                          "%Y%m%d",
                      ).date()
                  except Exception:
                      pass

              # ROC YYYMMDD
              if len(s) == 7:
                  try:
                      roc_year = int(
                          s[:3]
                      )

                      year = (
                          roc_year + 1911
                      )

                      return datetime.strptime(
                          f"{year}{s[3:]}",
                          "%Y%m%d",
                      ).date()
                  except Exception:
                      pass

              return None


          def infer_payload_date(payload):
              rows = []

              if isinstance(
                  payload,
                  list,
              ):
                  rows = payload[:30]

              elif isinstance(
                  payload,
                  dict,
              ):
                  for key, value in (
                      payload.items()
                  ):
                      if (
                          str(key).startswith(
                              "data"
                          )
                          and isinstance(
                              value,
                              list,
                          )
                      ):
                          rows.extend(
                              value[:30]
                          )

              for row in rows:

                  if isinstance(
                      row,
                      dict,
                  ):
                      for key, value in (
                          row.items()
                      ):
                          nk = (
                              str(key)
                              .strip()
                              .lower()
                          )

                          if nk in {
                              "date",
                              "日期",
                              "trade_date",
                              "tradedate",
                          }:
                              d = (
                                  parse_api_date(
                                      value
                                  )
                              )

                              if d:
                                  return d

              return None


          # ============================================================
          # FIND MOST RECENT VALID T86 TRADING DAY
          # ============================================================

          def find_t86_table(payload):
              if not isinstance(
                  payload,
                  dict,
              ):
                  return None

              candidates = []

              for key, fields in (
                  payload.items()
              ):

                  if not (
                      str(key).startswith(
                          "fields"
                      )
                      and isinstance(
                          fields,
                          list,
                      )
                  ):
                      continue

                  suffix = str(key)[6:]

                  rows = payload.get(
                      "data" + suffix
                  )

                  if not isinstance(
                      rows,
                      list,
                  ):
                      continue

                  if not rows:
                      continue

                  joined = "|".join(
                      str(x)
                      for x in fields
                  )

                  score = len(rows)

                  if "證券代號" in joined:
                      score += 100000

                  if "證券名稱" in joined:
                      score += 50000

                  if "投信" in joined:
                      score += 10000

                  if "自營商" in joined:
                      score += 10000

                  if (
                      "外資" in joined
                      or "外陸資" in joined
                  ):
                      score += 10000

                  code_rows = 0

                  for row in rows[:100]:

                      if not isinstance(
                          row,
                          list,
                      ):
                          continue

                      for value in row[:4]:

                          if re.fullmatch(
                              r"\d{4}",
                              str(value).strip(),
                          ):
                              code_rows += 1
                              break

                  score += (
                      code_rows * 1000
                  )

                  candidates.append({
                      "score": score,
                      "fields": fields,
                      "rows": rows,
                      "code_rows":
                          code_rows,
                  })

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda x:
                      x["score"],
                  reverse=True,
              )

              best = candidates[0]

              if (
                  best["code_rows"] == 0
              ):
                  return None

              return (
                  best["fields"],
                  best["rows"],
              )


          def fetch_t86_for_date(
              target_date
          ):
              ymd = target_date.strftime(
                  "%Y%m%d"
              )

              payload = get_json(
                  "twse_institutional",
                  "https://www.twse.com.tw/rwd/zh/fund/T86",
                  {
                      "date": ymd,
                      "selectType":
                          "ALLBUT0999",
                      "response":
                          "json",
                  },
              )

              table = find_t86_table(
                  payload
              )

              return payload, table


          def find_latest_trading_day():
              start = now.date()

              for days_back in range(
                  0,
                  11,
              ):
                  candidate = (
                      start
                      - timedelta(
                          days=days_back
                      )
                  )

                  # Skip weekend quickly
                  if (
                      candidate.weekday()
                      >= 5
                  ):
                      continue

                  print(
                      "[trade-date] "
                      f"trying {candidate}",
                      flush=True,
                  )

                  try:
                      payload, table = (
                          fetch_t86_for_date(
                              candidate
                          )
                      )

                      if table:
                          print(
                              "[trade-date] "
                              f"selected "
                              f"{candidate}",
                              flush=True,
                          )

                          return (
                              candidate,
                              payload,
                              table,
                          )

                  except Exception as exc:
                      print(
                          "[trade-date] "
                          f"{candidate} failed: "
                          f"{exc}",
                          flush=True,
                      )

              raise RuntimeError(
                  "Unable to find a valid "
                  "TWSE trading day within "
                  "the last 10 calendar days"
              )


          (
              trade_day,
              twse_inst_payload,
              twse_inst_table,
          ) = find_latest_trading_day()

          trade_date = (
              trade_day.strftime(
                  "%Y-%m-%d"
              )
          )

          print(
              f"[selected] trade_date="
              f"{trade_date}",
              flush=True,
          )


          # ============================================================
          # OUTPUT DIRECTORIES
          # ============================================================

          base = (
              Path("data")
              / trade_date
          )

          raw_dir = (
              base / "raw"
          )

          norm_dir = (
              base / "normalized"
          )

          raw_dir.mkdir(
              parents=True,
              exist_ok=True,
          )

          norm_dir.mkdir(
              parents=True,
              exist_ok=True,
          )


          # ============================================================
          # FETCH LATEST SNAPSHOT SOURCES
          # ============================================================

          twse_ohlcv_payload = get_json(
              "twse_ohlcv",
              "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
          )

          tpex_ohlcv_payload = get_json(
              "tpex_ohlcv",
              "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes",
          )

          tpex_inst_payload = get_json(
              "tpex_institutional",
              "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading",
          )


          payloads = {
              "twse_ohlcv":
                  twse_ohlcv_payload,

              "tpex_ohlcv":
                  tpex_ohlcv_payload,

              "twse_institutional":
                  twse_inst_payload,

              "tpex_institutional":
                  tpex_inst_payload,
          }


          for name, payload in (
              payloads.items()
          ):
              (
                  raw_dir
                  / f"{name}.json"
              ).write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )


          # ============================================================
          # HELPERS
          # ============================================================

          def norm_key(value):
              return re.sub(
                  r"[\s_\-()/（）]+",
                  "",
                  str(value or ""),
              ).lower()


          def pick(d, *keys):
              if not isinstance(
                  d,
                  dict,
              ):
                  return None

              mapping = {
                  norm_key(k): v
                  for k, v in d.items()
              }

              for key in keys:
                  nk = norm_key(key)

                  if nk in mapping:
                      return mapping[nk]

              return None


          def num(value):
              if value is None:
                  return None

              s = (
                  str(value)
                  .strip()
                  .replace(",", "")
                  .replace("+", "")
              )

              if s in {
                  "",
                  "--",
                  "---",
                  "----",
              }:
                  return None

              try:
                  return float(s)
              except Exception:
                  return None


          def integer(value):
              x = num(value)

              if x is None:
                  return None

              return int(
                  round(x)
              )


          def write_csv(
              path,
              rows,
          ):
              if not rows:
                  raise RuntimeError(
                      f"empty normalized "
                      f"dataset: {path}"
                  )

              fields = list(
                  rows[0].keys()
              )

              with path.open(
                  "w",
                  newline="",
                  encoding="utf-8-sig",
              ) as f:

                  writer = (
                      csv.DictWriter(
                          f,
                          fieldnames=fields,
                      )
                  )

                  writer.writeheader()
                  writer.writerows(
                      rows
                  )


          def fuzzy_value(
              d,
              required_groups,
              excluded=(),
          ):
              if not isinstance(
                  d,
                  dict,
              ):
                  return None

              for key, value in (
                  d.items()
              ):
                  nk = norm_key(key)

                  if any(
                      norm_key(x) in nk
                      for x in excluded
                  ):
                      continue

                  ok = True

                  for group in (
                      required_groups
                  ):
                      if isinstance(
                          group,
                          str,
                      ):
                          group = [group]

                      if not any(
                          norm_key(x) in nk
                          for x in group
                      ):
                          ok = False
                          break

                  if ok:
                      return value

              return None


          # ============================================================
          # NORMALIZE TWSE OHLCV
          # ============================================================

          def normalize_twse_ohlcv(
              payload
          ):
              if not isinstance(
                  payload,
                  list,
              ):
                  raise RuntimeError(
                      "TWSE OHLCV "
                      "payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick(
                          r,
                          "Code",
                          "證券代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TWSE",

                      "stock_id":
                          code,

                      "name":
                          pick(
                              r,
                              "Name",
                              "證券名稱",
                          ),

                      "open":
                          num(
                              pick(
                                  r,
                                  "OpeningPrice",
                                  "Open",
                                  "開盤價",
                              )
                          ),

                      "high":
                          num(
                              pick(
                                  r,
                                  "HighestPrice",
                                  "High",
                                  "最高價",
                              )
                          ),

                      "low":
                          num(
                              pick(
                                  r,
                                  "LowestPrice",
                                  "Low",
                                  "最低價",
                              )
                          ),

                      "close":
                          num(
                              pick(
                                  r,
                                  "ClosingPrice",
                                  "Close",
                                  "收盤價",
                              )
                          ),

                      "volume":
                          integer(
                              pick(
                                  r,
                                  "TradeVolume",
                                  "TradingShares",
                                  "成交股數",
                              )
                          ),

                      "trading_value":
                          integer(
                              pick(
                                  r,
                                  "TradeValue",
                                  "TransactionAmount",
                                  "成交金額",
                              )
                          ),
                  })

              return out


          # ============================================================
          # NORMALIZE TPEX OHLCV
          # ============================================================

          def normalize_tpex_ohlcv(
              payload
          ):
              if not isinstance(
                  payload,
                  list,
              ):
                  raise RuntimeError(
                      "TPEx OHLCV "
                      "payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick(
                          r,
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TPEX",

                      "stock_id":
                          code,

                      "name":
                          pick(
                              r,
                              "CompanyName",
                              "Name",
                              "證券名稱",
                              "名稱",
                          ),

                      "open":
                          num(
                              pick(
                                  r,
                                  "Open",
                                  "開盤價",
                              )
                          ),

                      "high":
                          num(
                              pick(
                                  r,
                                  "High",
                                  "最高價",
                              )
                          ),

                      "low":
                          num(
                              pick(
                                  r,
                                  "Low",
                                  "最低價",
                              )
                          ),

                      "close":
                          num(
                              pick(
                                  r,
                                  "Close",
                                  "收盤價",
                              )
                          ),

                      "volume":
                          integer(
                              pick(
                                  r,
                                  "TradingShares",
                                  "TradeVolume",
                                  "成交股數",
                                  "成交量",
                              )
                          ),

                      "trading_value":
                          integer(
                              pick(
                                  r,
                                  "TransactionAmount",
                                  "TradeValue",
                                  "成交金額",
                              )
                          ),
                  })

              return out


          # ============================================================
          # NORMALIZE TWSE T86
          # ============================================================

          def normalize_twse_inst(
              fields,
              rows,
          ):
              out = []

              for row in rows:

                  if not isinstance(
                      row,
                      list,
                  ):
                      continue

                  d = {
                      fields[i]:
                          (
                              row[i]
                              if i < len(row)
                              else None
                          )
                      for i
                      in range(
                          len(fields)
                      )
                  }

                  code = ""

                  for k, v in (
                      d.items()
                  ):
                      if (
                          "證券代號"
                          in str(k)
                          or "代號"
                          in str(k)
                      ):
                          candidate = (
                              str(v)
                              .strip()
                          )

                          if re.fullmatch(
                              r"\d{4}",
                              candidate,
                          ):
                              code = (
                                  candidate
                              )
                              break

                  if not code:
                      for value in (
                          row[:4]
                      ):
                          candidate = (
                              str(value)
                              .strip()
                          )

                          if re.fullmatch(
                              r"\d{4}",
                              candidate,
                          ):
                              code = (
                                  candidate
                              )
                              break

                  if not code:
                      continue

                  name = None

                  for k, v in (
                      d.items()
                  ):
                      if (
                          "證券名稱"
                          in str(k)
                          or "名稱"
                          == str(k).strip()
                      ):
                          name = v
                          break

                  if (
                      name is None
                      and len(row) > 1
                  ):
                      name = row[1]


                  foreign_buy = integer(
                      fuzzy_value(
                          d,
                          [
                              [
                                  "外陸資",
                                  "外資及陸資",
                                  "外資",
                              ],
                              [
                                  "買進",
                              ],
                          ],
                          excluded=[
                              "自營商",
                          ],
                      )
                  )

                  foreign_sell = integer(
                      fuzzy_value(
                          d,
                          [
                              [
                                  "外陸資",
                                  "外資及陸資",
                                  "外資",
                              ],
                              [
                                  "賣出",
                              ],
                          ],
                          excluded=[
                              "自營商",
                          ],
                      )
                  )

                  foreign_net = integer(
                      fuzzy_value(
                          d,
                          [
                              [
                                  "外陸資",
                                  "外資及陸資",
                                  "外資",
                              ],
                              [
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                          excluded=[
                              "自營商",
                          ],
                      )
                  )

                  trust_buy = integer(
                      fuzzy_value(
                          d,
                          [
                              ["投信"],
                              ["買進"],
                          ],
                      )
                  )

                  trust_sell = integer(
                      fuzzy_value(
                          d,
                          [
                              ["投信"],
                              ["賣出"],
                          ],
                      )
                  )

                  trust_net = integer(
                      fuzzy_value(
                          d,
                          [
                              ["投信"],
                              [
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                      )
                  )

                  dealer_buy = integer(
                      fuzzy_value(
                          d,
                          [
                              ["自營商"],
                              ["買進"],
                          ],
                      )
                  )

                  dealer_sell = integer(
                      fuzzy_value(
                          d,
                          [
                              ["自營商"],
                              ["賣出"],
                          ],
                      )
                  )

                  dealer_net = integer(
                      fuzzy_value(
                          d,
                          [
                              ["自營商"],
                              [
                                  "買賣超",
                                  "差額",
                              ],
                          ],
                      )
                  )

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TWSE",

                      "stock_id":
                          code,

                      "name":
                          name,

                      "foreign_buy":
                          foreign_buy,

                      "foreign_sell":
                          foreign_sell,

                      "foreign_net":
                          foreign_net,

                      "trust_buy":
                          trust_buy,

                      "trust_sell":
                          trust_sell,

                      "trust_net":
                          trust_net,

                      "dealer_buy":
                          dealer_buy,

                      "dealer_sell":
                          dealer_sell,

                      "dealer_net":
                          dealer_net,

                      "raw_json":
                          json.dumps(
                              d,
                              ensure_ascii=False,
                              separators=(
                                  ",",
                                  ":",
                              ),
                          ),
                  })

              return out


          # ============================================================
          # NORMALIZE TPEX INSTITUTIONAL
          # ============================================================

          def normalize_tpex_inst(
              payload
          ):
              if not isinstance(
                  payload,
                  list,
              ):
                  raise RuntimeError(
                      "TPEx institutional "
                      "payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick(
                          r,
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TPEX",

                      "stock_id":
                          code,

                      "name":
                          pick(
                              r,
                              "CompanyName",
                              "Name",
                              "證券名稱",
                              "名稱",
                          ),

                      "foreign_buy":
                          integer(
                              fuzzy_value(
                                  r,
                                  [
                                      [
                                          "foreign",
                                          "外資",
                                      ],
                                      [
                                          "buy",
                                          "買進",
                                      ],
                                  ],
                              )
                          ),

                      "foreign_sell":
                          integer(
                              fuzzy_value(
                                  r,
                                  [
                                      [
                                          "foreign",
                                          "外資",
                                      ],
                                      [
                                          "sell",
                                          "賣出",
                                      ],
                                  ],
                              )
                          ),

                      "foreign_net":
                          integer(
                              fuzzy_value(
                                  r,
                                  [
                                      [
                                          "foreign",
                                          "外資",
                                      ],
                                      [
                                          "net",
                                          "difference",
                                          "買賣超",
                                          "差額",
                                      ],
                                  ],
                              )
                          ),

                      "trust_buy":
                          integer(
                              fuzzy_value(
                                  r,
                                  [
                                      [
                                          "trust",
                                          "investmenttrust",
                                          "投信",
                                      ],
                                      [
                                          "buy",
                                          "買進",
                                      ],
                                  ],
                              )
                          ),

                      "trust_sell":
                          integer(
                              fuzzy_value(
                                  r,
                                  [
                                      [
                                          "trust",
                                          "investmenttrust",
                                          "投信",
                                      ],
                                      [
                                          "sell",
                                          "賣出",
                                      ],
                                  ],
                              )
                          ),

                      "trust_net":
                          integer(
                              fuzzy_value(
                                  r,
                                  [
                                      [
                                          "trust",
                                          "investmenttrust",
                                          "投信",
                                      ],
                                      [
                                          "net",
                                          "difference",
                                          "買賣超",
                                          "差額",
                                      ],
                                  ],
                              )
                          ),

                      "dealer_buy":
                          integer(
                              fuzzy_value(
                                  r,
                                  [
                                      [
                                          "dealer",
                                          "自營商",
                                      ],
                                      [
                                          "buy",
                                          "買進",
                                      ],
                                  ],
                              )
                          ),

                      "dealer_sell":
                          integer(
                              fuzzy_value(
                                  r,
                                  [
                                      [
                                          "dealer",
                                          "自營商",
                                      ],
                                      [
                                          "sell",
                                          "賣出",
                                      ],
                                  ],
                              )
                          ),

                      "dealer_net":
                          integer(
                              fuzzy_value(
                                  r,
                                  [
                                      [
                                          "dealer",
                                          "自營商",
                                      ],
                                      [
                                          "net",
                                          "difference",
                                          "買賣超",
                                          "差額",
                                      ],
                                  ],
                              )
                          ),

                      "raw_json":
                          json.dumps(
                              r,
                              ensure_ascii=False,
                              separators=(
                                  ",",
                                  ":",
                              ),
                          ),
                  })

              return out


          # ============================================================
          # NORMALIZE ALL
          # ============================================================

          normalized = {
              "twse_ohlcv":
                  normalize_twse_ohlcv(
                      twse_ohlcv_payload
                  ),

              "tpex_ohlcv":
                  normalize_tpex_ohlcv(
                      tpex_ohlcv_payload
                  ),

              "twse_institutional":
                  normalize_twse_inst(
                      twse_inst_table[0],
                      twse_inst_table[1],
                  ),

              "tpex_institutional":
                  normalize_tpex_inst(
                      tpex_inst_payload
                  ),
          }


          for name, rows in (
              normalized.items()
          ):
              write_csv(
                  norm_dir
                  / f"{name}.csv",
                  rows,
              )


          # ============================================================
          # VALIDATION
          # ============================================================

          errors = []
          warnings = []

          row_counts = {
              name: len(rows)
              for name, rows
              in normalized.items()
          }


          minimum_rows = {
              "twse_ohlcv":
                  800,

              "tpex_ohlcv":
                  500,

              "twse_institutional":
                  700,

              "tpex_institutional":
                  400,
          }


          for name, minimum in (
              minimum_rows.items()
          ):
              count = row_counts.get(
                  name,
                  0,
              )

              if count < minimum:
                  errors.append(
                      f"{name}: "
                      f"{count} < "
                      f"{minimum}"
                  )


          # ============================================================
          # SNAPSHOT DATE VALIDATION
          # ============================================================

          source_dates = {}

          for name, payload in {
              "twse_ohlcv":
                  twse_ohlcv_payload,

              "tpex_ohlcv":
                  tpex_ohlcv_payload,

              "tpex_institutional":
                  tpex_inst_payload,
          }.items():

              inferred = (
                  infer_payload_date(
                      payload
                  )
              )

              if inferred:
                  source_dates[
                      name
                  ] = str(
                      inferred
                  )

                  if (
                      inferred
                      != trade_day
                  ):
                      errors.append(
                          f"{name}: "
                          f"source date "
                          f"{inferred} "
                          f"!= selected "
                          f"{trade_day}"
                      )


          # ============================================================
          # DUPLICATE VALIDATION
          # ============================================================

          for name, rows in (
              normalized.items()
          ):
              codes = [
                  r["stock_id"]
                  for r in rows
              ]

              duplicate_count = (
                  len(codes)
                  - len(set(codes))
              )

              if (
                  duplicate_count > 0
              ):
                  errors.append(
                      f"{name}: "
                      f"duplicate rows="
                      f"{duplicate_count}"
                  )


          # ============================================================
          # OHLC SANITY
          # ============================================================

          for name in (
              "twse_ohlcv",
              "tpex_ohlcv",
          ):
              bad_ohlc = 0
              close_null = 0

              rows = normalized[
                  name
              ]

              for r in rows:

                  o = r["open"]
                  h = r["high"]
                  l = r["low"]
                  c = r["close"]

                  if c is None:
                      close_null += 1
                      continue

                  if (
                      h is not None
                      and l is not None
                      and h < l
                  ):
                      bad_ohlc += 1

                  if (
                      h is not None
                      and o is not None
                      and h < o
                  ):
                      bad_ohlc += 1

                  if (
                      h is not None
                      and c is not None
                      and h < c
                  ):
                      bad_ohlc += 1

                  if (
                      l is not None
                      and o is not None
                      and l > o
                  ):
                      bad_ohlc += 1

                  if (
                      l is not None
                      and c is not None
                      and l > c
                  ):
                      bad_ohlc += 1

              if bad_ohlc > 0:
                  errors.append(
                      f"{name}: "
                      f"bad OHLC="
                      f"{bad_ohlc}"
                  )

              null_ratio = (
                  close_null
                  / max(
                      1,
                      len(rows),
                  )
              )

              if (
                  null_ratio > 0.05
              ):
                  errors.append(
                      f"{name}: "
                      f"null close="
                      f"{null_ratio:.1%}"
                  )


          # ============================================================
          # INSTITUTIONAL COVERAGE
          # ============================================================

          coverage = {}

          for market in (
              "twse",
              "tpex",
          ):

              price_codes = {
                  r["stock_id"]
                  for r in normalized[
                      f"{market}_ohlcv"
                  ]
              }

              inst_codes = {
                  r["stock_id"]
                  for r in normalized[
                      f"{market}_institutional"
                  ]
              }

              overlap = len(
                  price_codes
                  & inst_codes
              )

              ratio = (
                  overlap
                  / max(
                      1,
                      len(price_codes),
                  )
              )

              coverage[
                  market
              ] = {
                  "price_codes":
                      len(
                          price_codes
                      ),

                  "institutional_codes":
                      len(
                          inst_codes
                      ),

                  "overlap":
                      overlap,

                  "coverage":
                      ratio,
              }

              if ratio < 0.65:
                  errors.append(
                      f"{market.upper()} "
                      f"institutional "
                      f"coverage="
                      f"{ratio:.1%}"
                  )


          # ============================================================
          # FLATTENED FIELD CHECK
          # ============================================================

          flattened = {}

          for name in (
              "twse_institutional",
              "tpex_institutional",
          ):

              rows = normalized[
                  name
              ]

              stats = {}

              for col in (
                  "foreign_net",
                  "trust_net",
                  "dealer_net",
              ):

                  n = sum(
                      1
                      for r in rows
                      if r.get(col)
                      is not None
                  )

                  stats[col] = n

                  if n < 100:
                      warnings.append(
                          f"{name}: "
                          f"{col} "
                          f"non-null={n}"
                      )

              flattened[
                  name
              ] = stats


          # ============================================================
          # MANIFEST
          # ============================================================

          manifest = {
              "version":
                  "AlphaPilot-Data-V3.2",

              "execution_time":
                  now.isoformat(),

              "trade_date":
                  trade_date,

              "status":
                  (
                      "PASS"
                      if not errors
                      else "FAIL"
                  ),

              "row_counts":
                  row_counts,

              "source_dates":
                  source_dates,

              "coverage":
                  coverage,

              "flattened_fields":
                  flattened,

              "warnings":
                  warnings,

              "errors":
                  errors,

              "sources": {
                  "twse_ohlcv":
                      "TWSE STOCK_DAY_ALL",

                  "tpex_ohlcv":
                      "TPEx "
                      "tpex_mainboard_"
                      "daily_close_quotes",

                  "twse_institutional":
                      "TWSE T86",

                  "tpex_institutional":
                      "TPEx "
                      "tpex_3insti_"
                      "daily_trading",
              },
          }


          (
              base
              / "manifest.json"
          ).write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )


          print(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              flush=True,
          )


          if errors:
              raise SystemExit(2)

          PY

          python fetch_today.py


      - name: Commit daily data
        shell: bash
        run: |
          git config user.name "AlphaPilot Data Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          TRADE_DATE=$(find data -mindepth 1 -maxdepth 1 -type d | sort | tail -1 | xargs basename)

          git commit -m "data: Taiwan market ${TRADE_DATE}"
          git push
