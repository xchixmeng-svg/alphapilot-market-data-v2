name: AlphaPilot Daily Taiwan Market Data V3.4

on:
  workflow_dispatch:
  schedule:
    - cron: "40 9 * * 1-5"
    - cron: "40 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: alphapilot-daily-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch normalize validate Taiwan market data
        shell: bash
        run: |
          cat > fetch_today.py <<'PY'
          import csv
          import json
          import re
          import time
          from collections import Counter
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests


          # ============================================================
          # BASIC
          # ============================================================

          TZ = ZoneInfo("Asia/Taipei")
          now = datetime.now(TZ)

          session = requests.Session()

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/plain,*/*",
          }


          # ============================================================
          # HTTP
          # ============================================================

          def get_json(name, url, params=None):
              params = params or {}
              last_error = None

              for attempt in range(6):
                  try:
                      r = session.get(
                          url,
                          params=params,
                          headers=HEADERS,
                          timeout=(15, 60),
                      )

                      r.raise_for_status()

                      if not r.text.strip():
                          raise RuntimeError("empty response")

                      return r.json()

                  except Exception as exc:
                      last_error = exc

                      if attempt < 5:
                          wait = min(30, 2 ** attempt)

                          print(
                              f"[retry] {name} "
                              f"attempt={attempt + 1} "
                              f"error={exc} "
                              f"sleep={wait}s",
                              flush=True,
                          )

                          time.sleep(wait)

              raise RuntimeError(
                  f"{name} failed after retries: {last_error}"
              )


          # ============================================================
          # VALUE HELPERS
          # ============================================================

          def norm_key(value):
              return re.sub(
                  r"[\s_\-()/（）]+",
                  "",
                  str(value or ""),
              ).lower()


          def num(value):
              if value is None:
                  return None

              s = (
                  str(value)
                  .strip()
                  .replace(",", "")
                  .replace("+", "")
              )

              if s in {
                  "",
                  "--",
                  "---",
                  "----",
                  "null",
                  "None",
              }:
                  return None

              try:
                  return float(s)

              except Exception:
                  return None


          def integer(value):
              x = num(value)

              if x is None:
                  return None

              return int(round(x))


          def pick(d, *keys):
              if not isinstance(d, dict):
                  return None

              mapping = {
                  norm_key(k): v
                  for k, v in d.items()
              }

              for key in keys:
                  nk = norm_key(key)

                  if nk in mapping:
                      return mapping[nk]

              return None


          def write_csv(path, rows):
              if not rows:
                  raise RuntimeError(
                      f"empty dataset: {path}"
                  )

              fields = list(rows[0].keys())

              with path.open(
                  "w",
                  newline="",
                  encoding="utf-8-sig",
              ) as f:

                  writer = csv.DictWriter(
                      f,
                      fieldnames=fields,
                  )

                  writer.writeheader()
                  writer.writerows(rows)


          # ============================================================
          # DATE PARSER
          # ============================================================

          def parse_date(value):
              if value is None:
                  return None

              s = re.sub(
                  r"[^\d]",
                  "",
                  str(value),
              )

              # YYYYMMDD
              if len(s) == 8:
                  try:
                      return datetime.strptime(
                          s,
                          "%Y%m%d",
                      ).date()

                  except Exception:
                      return None

              # ROC YYYMMDD
              if len(s) == 7:
                  try:
                      roc = int(s[:3])

                      return datetime.strptime(
                          f"{roc + 1911}{s[3:]}",
                          "%Y%m%d",
                      ).date()

                  except Exception:
                      return None

              return None


          def consensus_payload_date(payload):
              """
              Only accept a date when multiple rows agree.
              This avoids V3.2's single-field false date detection.
              """

              dates = []

              if not isinstance(payload, list):
                  return None

              for row in payload[:300]:

                  if not isinstance(row, dict):
                      continue

                  for key, value in row.items():

                      nk = norm_key(key)

                      if nk not in {
                          "date",
                          "日期",
                          "tradedate",
                          "交易日期",
                      }:
                          continue

                      d = parse_date(value)

                      if d:
                          dates.append(d)

              if len(dates) < 5:
                  return None

              counter = Counter(dates)

              best_date, count = (
                  counter.most_common(1)[0]
              )

              ratio = count / len(dates)

              if ratio < 0.80:
                  return None

              return best_date


          # ============================================================
          # TWSE T86 TABLE
          # ============================================================

          def find_t86_table(payload):

              if not isinstance(payload, dict):
                  return None

              candidates = []

              for key, fields in payload.items():

                  if not (
                      str(key).startswith("fields")
                      and isinstance(fields, list)
                  ):
                      continue

                  suffix = str(key)[6:]

                  rows = payload.get(
                      "data" + suffix
                  )

                  if not isinstance(rows, list):
                      continue

                  if not rows:
                      continue

                  joined = "|".join(
                      str(x)
                      for x in fields
                  )

                  score = len(rows)

                  if "證券代號" in joined:
                      score += 100000

                  if "證券名稱" in joined:
                      score += 50000

                  if "投信" in joined:
                      score += 10000

                  if "自營商" in joined:
                      score += 10000

                  if (
                      "外資" in joined
                      or "外陸資" in joined
                  ):
                      score += 10000

                  valid_codes = 0

                  for row in rows[:100]:

                      if not isinstance(row, list):
                          continue

                      for value in row[:4]:

                          if re.fullmatch(
                              r"\d{4}",
                              str(value).strip(),
                          ):
                              valid_codes += 1
                              break

                  score += valid_codes * 1000

                  candidates.append({
                      "score": score,
                      "fields": fields,
                      "rows": rows,
                      "valid_codes": valid_codes,
                  })

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda x: x["score"],
                  reverse=True,
              )

              best = candidates[0]

              if best["valid_codes"] == 0:
                  return None

              return (
                  best["fields"],
                  best["rows"],
              )


          # ============================================================
          # FIND RECENT VALID TRADING DATE
          # ============================================================

          def fetch_t86_date(day):

              ymd = day.strftime("%Y%m%d")

              payload = get_json(
                  "twse_t86_probe",
                  "https://www.twse.com.tw/rwd/zh/fund/T86",
                  {
                      "date": ymd,
                      "selectType": "ALLBUT0999",
                      "response": "json",
                  },
              )

              table = find_t86_table(payload)

              return payload, table


          def find_latest_trading_day():

              today = now.date()

              for days_back in range(11):

                  candidate = (
                      today
                      - timedelta(days=days_back)
                  )

                  if candidate.weekday() >= 5:
                      continue

                  print(
                      f"[trade-date] trying {candidate}",
                      flush=True,
                  )

                  try:
                      payload, table = (
                          fetch_t86_date(candidate)
                      )

                      if table:

                          print(
                              f"[trade-date] selected {candidate}",
                              flush=True,
                          )

                          return (
                              candidate,
                              payload,
                              table,
                          )

                  except Exception as exc:

                      print(
                          f"[trade-date] "
                          f"{candidate} "
                          f"failed={exc}",
                          flush=True,
                      )

              raise RuntimeError(
                  "no valid trading date found "
                  "within last 10 days"
              )


          (
              trade_day,
              twse_inst_payload,
              twse_inst_table,
          ) = find_latest_trading_day()


          trade_date = trade_day.strftime(
              "%Y-%m-%d"
          )


          print(
              f"[selected] trade_date={trade_date}",
              flush=True,
          )


          # ============================================================
          # OUTPUT
          # ============================================================

          base = Path("data") / trade_date
          raw_dir = base / "raw"
          norm_dir = base / "normalized"

          raw_dir.mkdir(
              parents=True,
              exist_ok=True,
          )

          norm_dir.mkdir(
              parents=True,
              exist_ok=True,
          )


          # ============================================================
          # OFFICIAL SOURCES
          # ============================================================

          # These two OHLCV sources are the pair that already
          # successfully produced real CSVs in V2.

          twse_ohlcv_payload = get_json(
              "twse_ohlcv",
              "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
          )


          tpex_ohlcv_payload = get_json(
              "tpex_ohlcv",
              "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes",
          )


          tpex_inst_payload = get_json(
              "tpex_institutional",
              "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading",
          )


          payloads = {
              "twse_ohlcv":
                  twse_ohlcv_payload,

              "tpex_ohlcv":
                  tpex_ohlcv_payload,

              "twse_institutional":
                  twse_inst_payload,

              "tpex_institutional":
                  tpex_inst_payload,
          }


          for name, payload in payloads.items():

              (
                  raw_dir
                  / f"{name}.json"
              ).write_text(
                  json.dumps(
                      payload,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )


          # ============================================================
          # TWSE OHLCV
          # ============================================================

          def normalize_twse_ohlcv(payload):

              if not isinstance(payload, list):
                  raise RuntimeError(
                      "TWSE STOCK_DAY_ALL "
                      "payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick(
                          r,
                          "Code",
                          "證券代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TWSE",

                      "stock_id":
                          code,

                      "name":
                          pick(
                              r,
                              "Name",
                              "證券名稱",
                          ),

                      "open":
                          num(
                              pick(
                                  r,
                                  "OpeningPrice",
                                  "Open",
                                  "開盤價",
                              )
                          ),

                      "high":
                          num(
                              pick(
                                  r,
                                  "HighestPrice",
                                  "High",
                                  "最高價",
                              )
                          ),

                      "low":
                          num(
                              pick(
                                  r,
                                  "LowestPrice",
                                  "Low",
                                  "最低價",
                              )
                          ),

                      "close":
                          num(
                              pick(
                                  r,
                                  "ClosingPrice",
                                  "Close",
                                  "收盤價",
                              )
                          ),

                      "volume":
                          integer(
                              pick(
                                  r,
                                  "TradeVolume",
                                  "TradingShares",
                                  "成交股數",
                              )
                          ),

                      "trading_value":
                          integer(
                              pick(
                                  r,
                                  "TradeValue",
                                  "TransactionAmount",
                                  "成交金額",
                              )
                          ),
                  })

              return out


          # ============================================================
          # TPEX OHLCV
          # ============================================================

          def normalize_tpex_ohlcv(payload):

              if not isinstance(payload, list):
                  raise RuntimeError(
                      "TPEx OHLCV payload "
                      "is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick(
                          r,
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue

                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TPEX",

                      "stock_id":
                          code,

                      "name":
                          pick(
                              r,
                              "CompanyName",
                              "Name",
                              "證券名稱",
                              "名稱",
                          ),

                      "open":
                          num(
                              pick(
                                  r,
                                  "Open",
                                  "開盤價",
                              )
                          ),

                      "high":
                          num(
                              pick(
                                  r,
                                  "High",
                                  "最高價",
                              )
                          ),

                      "low":
                          num(
                              pick(
                                  r,
                                  "Low",
                                  "最低價",
                              )
                          ),

                      "close":
                          num(
                              pick(
                                  r,
                                  "Close",
                                  "收盤價",
                              )
                          ),

                      "volume":
                          integer(
                              pick(
                                  r,
                                  "TradingShares",
                                  "TradeVolume",
                                  "成交股數",
                                  "成交量",
                              )
                          ),

                      "trading_value":
                          integer(
                              pick(
                                  r,
                                  "TransactionAmount",
                                  "TradeValue",
                                  "成交金額",
                              )
                          ),
                  })

              return out


          # ============================================================
          # FIELD SELECTION HELPERS
          # ============================================================

          def find_field(
              d,
              include_all=(),
              include_any=(),
              reject_prefixes=(),
              prefer=(),
          ):
              candidates = []

              for key, value in d.items():

                  nk = norm_key(key)

                  if any(
                      nk.startswith(
                          norm_key(x)
                      )
                      for x in reject_prefixes
                  ):
                      continue

                  if any(
                      norm_key(x) not in nk
                      for x in include_all
                  ):
                      continue

                  if include_any:

                      if not any(
                          norm_key(x) in nk
                          for x in include_any
                      ):
                          continue

                  score = 0

                  for term in prefer:

                      if norm_key(term) in nk:
                          score += 1000

                  # Prefer simpler direct total fields.
                  score -= len(nk)

                  candidates.append(
                      (
                          score,
                          value,
                          key,
                      )
                  )

              if not candidates:
                  return None

              candidates.sort(
                  key=lambda x: x[0],
                  reverse=True,
              )

              return candidates[0][1]


          def foreign_value(d, action_terms):

              # First choice: official 外陸資 / 外資及陸資
              value = find_field(
                  d,
                  include_any=[
                      "外陸資",
                      "外資及陸資",
                  ],
                  prefer=action_terms,
              )

              # Need the action as well.
              candidates = []

              for key, v in d.items():

                  nk = norm_key(key)

                  if not any(
                      norm_key(x) in nk
                      for x in (
                          "外陸資",
                          "外資及陸資",
                      )
                  ):
                      continue

                  if not any(
                      norm_key(x) in nk
                      for x in action_terms
                  ):
                      continue

                  candidates.append(
                      (
                          -len(nk),
                          v,
                      )
                  )

              if candidates:
                  candidates.sort(
                      reverse=True
                  )

                  return candidates[0][1]

              # Fallback: 外資, but reject a field whose
              # name actually begins with 外資自營商.
              candidates = []

              for key, v in d.items():

                  nk = norm_key(key)

                  if "外資" not in nk:
                      continue

                  if nk.startswith(
                      norm_key("外資自營商")
                  ):
                      continue

                  if not any(
                      norm_key(x) in nk
                      for x in action_terms
                  ):
                      continue

                  candidates.append(
                      (
                          -len(nk),
                          v,
                      )
                  )

              if not candidates:
                  return None

              candidates.sort(
                  reverse=True
              )

              return candidates[0][1]


          def dealer_value(d, action_terms):

              candidates = []

              for key, value in d.items():

                  nk = norm_key(key)

                  if nk.startswith(
                      norm_key(
                          "外資自營商"
                      )
                  ):
                      continue

                  if not nk.startswith(
                      norm_key(
                          "自營商"
                      )
                  ):
                      continue

                  if not any(
                      norm_key(x) in nk
                      for x in action_terms
                  ):
                      continue

                  score = -len(nk)

                  # Prefer direct total over
                  # 自行買賣 / 避險 subcomponents.
                  if (
                      "自行買賣" not in nk
                      and "避險" not in nk
                  ):
                      score += 10000

                  candidates.append(
                      (
                          score,
                          value,
                      )
                  )

              if not candidates:
                  return None

              candidates.sort(
                  reverse=True
              )

              return candidates[0][1]


          def trust_value(d, action_terms):

              candidates = []

              for key, value in d.items():

                  nk = norm_key(key)

                  if "投信" not in nk:
                      continue

                  if not any(
                      norm_key(x) in nk
                      for x in action_terms
                  ):
                      continue

                  candidates.append(
                      (
                          -len(nk),
                          value,
                      )
                  )

              if not candidates:
                  return None

              candidates.sort(
                  reverse=True
              )

              return candidates[0][1]


          # ============================================================
          # TWSE INSTITUTIONAL
          # ============================================================

          def normalize_twse_inst(fields, rows):

              out = []

              for row in rows:

                  if not isinstance(row, list):
                      continue

                  d = {
                      fields[i]:
                          (
                              row[i]
                              if i < len(row)
                              else None
                          )
                      for i
                      in range(len(fields))
                  }

                  code = ""

                  for key, value in d.items():

                      if (
                          "證券代號"
                          not in str(key)
                          and "代號"
                          not in str(key)
                      ):
                          continue

                      candidate = str(
                          value
                      ).strip()

                      if re.fullmatch(
                          r"\d{4}",
                          candidate,
                      ):
                          code = candidate
                          break

                  if not code:

                      for value in row[:4]:

                          candidate = str(
                              value
                          ).strip()

                          if re.fullmatch(
                              r"\d{4}",
                              candidate,
                          ):
                              code = candidate
                              break

                  if not code:
                      continue


                  name = None

                  for key, value in d.items():

                      if (
                          "證券名稱"
                          in str(key)
                      ):
                          name = value
                          break

                  if (
                      name is None
                      and len(row) > 1
                  ):
                      name = row[1]


                  foreign_buy = integer(
                      foreign_value(
                          d,
                          ["買進"],
                      )
                  )

                  foreign_sell = integer(
                      foreign_value(
                          d,
                          ["賣出"],
                      )
                  )

                  foreign_net = integer(
                      foreign_value(
                          d,
                          [
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  trust_buy = integer(
                      trust_value(
                          d,
                          ["買進"],
                      )
                  )

                  trust_sell = integer(
                      trust_value(
                          d,
                          ["賣出"],
                      )
                  )

                  trust_net = integer(
                      trust_value(
                          d,
                          [
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  dealer_buy = integer(
                      dealer_value(
                          d,
                          ["買進"],
                      )
                  )

                  dealer_sell = integer(
                      dealer_value(
                          d,
                          ["賣出"],
                      )
                  )

                  dealer_net = integer(
                      dealer_value(
                          d,
                          [
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TWSE",

                      "stock_id":
                          code,

                      "name":
                          name,

                      "foreign_buy":
                          foreign_buy,

                      "foreign_sell":
                          foreign_sell,

                      "foreign_net":
                          foreign_net,

                      "trust_buy":
                          trust_buy,

                      "trust_sell":
                          trust_sell,

                      "trust_net":
                          trust_net,

                      "dealer_buy":
                          dealer_buy,

                      "dealer_sell":
                          dealer_sell,

                      "dealer_net":
                          dealer_net,

                      "raw_json":
                          json.dumps(
                              d,
                              ensure_ascii=False,
                              separators=(
                                  ",",
                                  ":",
                              ),
                          ),
                  })

              return out


          # ============================================================
          # TPEX INSTITUTIONAL
          # ============================================================

          def generic_institution_value(
              row,
              institution_terms,
              action_terms,
          ):

              candidates = []

              for key, value in row.items():

                  nk = norm_key(key)

                  if not any(
                      norm_key(x) in nk
                      for x in institution_terms
                  ):
                      continue

                  if not any(
                      norm_key(x) in nk
                      for x in action_terms
                  ):
                      continue

                  candidates.append(
                      (
                          -len(nk),
                          value,
                      )
                  )

              if not candidates:
                  return None

              candidates.sort(
                  reverse=True
              )

              return candidates[0][1]


          def normalize_tpex_inst(payload):

              if not isinstance(payload, list):
                  raise RuntimeError(
                      "TPEx institutional "
                      "payload is not list"
                  )

              out = []

              for r in payload:

                  code = str(
                      pick(
                          r,
                          "SecuritiesCompanyCode",
                          "Code",
                          "證券代號",
                          "代號",
                      )
                      or ""
                  ).strip()

                  if not re.fullmatch(
                      r"\d{4}",
                      code,
                  ):
                      continue


                  foreign_buy = integer(
                      generic_institution_value(
                          r,
                          [
                              "Foreign",
                              "外資",
                              "外陸資",
                          ],
                          [
                              "Buy",
                              "買進",
                          ],
                      )
                  )

                  foreign_sell = integer(
                      generic_institution_value(
                          r,
                          [
                              "Foreign",
                              "外資",
                              "外陸資",
                          ],
                          [
                              "Sell",
                              "賣出",
                          ],
                      )
                  )

                  foreign_net = integer(
                      generic_institution_value(
                          r,
                          [
                              "Foreign",
                              "外資",
                              "外陸資",
                          ],
                          [
                              "Net",
                              "Difference",
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  trust_buy = integer(
                      generic_institution_value(
                          r,
                          [
                              "InvestmentTrust",
                              "Trust",
                              "投信",
                          ],
                          [
                              "Buy",
                              "買進",
                          ],
                      )
                  )

                  trust_sell = integer(
                      generic_institution_value(
                          r,
                          [
                              "InvestmentTrust",
                              "Trust",
                              "投信",
                          ],
                          [
                              "Sell",
                              "賣出",
                          ],
                      )
                  )

                  trust_net = integer(
                      generic_institution_value(
                          r,
                          [
                              "InvestmentTrust",
                              "Trust",
                              "投信",
                          ],
                          [
                              "Net",
                              "Difference",
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  dealer_buy = integer(
                      generic_institution_value(
                          r,
                          [
                              "Dealer",
                              "自營商",
                          ],
                          [
                              "Buy",
                              "買進",
                          ],
                      )
                  )

                  dealer_sell = integer(
                      generic_institution_value(
                          r,
                          [
                              "Dealer",
                              "自營商",
                          ],
                          [
                              "Sell",
                              "賣出",
                          ],
                      )
                  )

                  dealer_net = integer(
                      generic_institution_value(
                          r,
                          [
                              "Dealer",
                              "自營商",
                          ],
                          [
                              "Net",
                              "Difference",
                              "買賣超",
                              "差額",
                          ],
                      )
                  )


                  out.append({
                      "trade_date":
                          trade_date,

                      "market":
                          "TPEX",

                      "stock_id":
                          code,

                      "name":
                          pick(
                              r,
                              "CompanyName",
                              "Name",
                              "證券名稱",
                              "名稱",
                          ),

                      "foreign_buy":
                          foreign_buy,

                      "foreign_sell":
                          foreign_sell,

                      "foreign_net":
                          foreign_net,

                      "trust_buy":
                          trust_buy,

                      "trust_sell":
                          trust_sell,

                      "trust_net":
                          trust_net,

                      "dealer_buy":
                          dealer_buy,

                      "dealer_sell":
                          dealer_sell,

                      "dealer_net":
                          dealer_net,

                      "raw_json":
                          json.dumps(
                              r,
                              ensure_ascii=False,
                              separators=(
                                  ",",
                                  ":",
                              ),
                          ),
                  })

              return out


          # ============================================================
          # NORMALIZE
          # ============================================================

          normalized = {
              "twse_ohlcv":
                  normalize_twse_ohlcv(
                      twse_ohlcv_payload
                  ),

              "tpex_ohlcv":
                  normalize_tpex_ohlcv(
                      tpex_ohlcv_payload
                  ),

              "twse_institutional":
                  normalize_twse_inst(
                      twse_inst_table[0],
                      twse_inst_table[1],
                  ),

              "tpex_institutional":
                  normalize_tpex_inst(
                      tpex_inst_payload
                  ),
          }


          for name, rows in normalized.items():

              write_csv(
                  norm_dir
                  / f"{name}.csv",
                  rows,
              )


          # ============================================================
          # VALIDATION
          # ============================================================

          errors = []
          warnings = []

          row_counts = {
              name: len(rows)
              for name, rows
              in normalized.items()
          }


          minimum_rows = {
              "twse_ohlcv": 800,
              "tpex_ohlcv": 500,
              "twse_institutional": 700,
              "tpex_institutional": 400,
          }


          for name, minimum in minimum_rows.items():

              count = row_counts.get(
                  name,
                  0,
              )

              if count < minimum:

                  errors.append(
                      f"{name}: "
                      f"row count "
                      f"{count} "
                      f"< minimum "
                      f"{minimum}"
                  )


          # ============================================================
          # SAFE SNAPSHOT FRESHNESS
          # ============================================================

          source_dates = {}


          for name, payload in {
              "twse_ohlcv":
                  twse_ohlcv_payload,

              "tpex_ohlcv":
                  tpex_ohlcv_payload,

              "tpex_institutional":
                  tpex_inst_payload,
          }.items():

              d = consensus_payload_date(
                  payload
              )

              if d is None:

                  source_dates[name] = None

                  warnings.append(
                      f"{name}: no reliable "
                      f"consensus date field; "
                      f"accepted by latest-"
                      f"snapshot gate"
                  )

                  continue


              source_dates[name] = str(d)

              if d != trade_day:

    if name == "twse_ohlcv":
        warnings.append(
            f"{name}: payload date "
            f"{d} != selected "
            f"{trade_day}; "
            f"STOCK_DAY_ALL snapshot date "
            f"is informational only"
        )
    else:
        errors.append(
            f"{name}: "
            f"consensus date "
            f"{d} != "
            f"selected "
            f"{trade_day}"
        )


          # ============================================================
          # DUPLICATES
          # ============================================================

          for name, rows in normalized.items():

              codes = [
                  r["stock_id"]
                  for r in rows
              ]

              duplicate_count = (
                  len(codes)
                  -
                  len(set(codes))
              )

              if duplicate_count:

                  errors.append(
                      f"{name}: "
                      f"duplicates="
                      f"{duplicate_count}"
                  )


          # ============================================================
          # OHLC SANITY
          # ============================================================

          for name in (
              "twse_ohlcv",
              "tpex_ohlcv",
          ):

              rows = normalized[name]

              bad = 0
              null_close = 0

              for r in rows:

                  o = r["open"]
                  h = r["high"]
                  l = r["low"]
                  c = r["close"]

                  if c is None:
                      null_close += 1
                      continue

                  if (
                      h is not None
                      and l is not None
                      and h < l
                  ):
                      bad += 1

                  if (
                      h is not None
                      and o is not None
                      and h < o
                  ):
                      bad += 1

                  if (
                      h is not None
                      and c is not None
                      and h < c
                  ):
                      bad += 1

                  if (
                      l is not None
                      and o is not None
                      and l > o
                  ):
                      bad += 1

                  if (
                      l is not None
                      and c is not None
                      and l > c
                  ):
                      bad += 1


              if bad:

                  errors.append(
                      f"{name}: "
                      f"OHLC errors="
                      f"{bad}"
                  )


              null_ratio = (
                  null_close
                  /
                  max(
                      1,
                      len(rows),
                  )
              )


              if null_ratio > 0.05:

                  errors.append(
                      f"{name}: "
                      f"null close="
                      f"{null_ratio:.1%}"
                  )


          # ============================================================
          # COVERAGE
          # ============================================================

          coverage = {}


          for market in (
              "twse",
              "tpex",
          ):

              price_codes = {
                  r["stock_id"]
                  for r in normalized[
                      f"{market}_ohlcv"
                  ]
              }

              inst_codes = {
                  r["stock_id"]
                  for r in normalized[
                      f"{market}_institutional"
                  ]
              }

              overlap = len(
                  price_codes
                  & inst_codes
              )

              ratio = (
                  overlap
                  /
                  max(
                      1,
                      len(price_codes),
                  )
              )


              coverage[market] = {
                  "price_codes":
                      len(price_codes),

                  "institutional_codes":
                      len(inst_codes),

                  "overlap":
                      overlap,

                  "coverage":
                      ratio,
              }


              if ratio < 0.65:

                  errors.append(
                      f"{market.upper()} "
                      f"coverage="
                      f"{ratio:.1%}"
                  )


          # ============================================================
          # INSTITUTIONAL FLATTEN CHECK
          # ============================================================

          flattened_fields = {}


          for name in (
              "twse_institutional",
              "tpex_institutional",
          ):

              rows = normalized[name]

              stats = {}


              for col in (
                  "foreign_net",
                  "trust_net",
                  "dealer_net",
              ):

                  count = sum(
                      1
                      for r in rows
                      if r.get(col)
                      is not None
                  )

                  stats[col] = count


                  if count < 100:

                      warnings.append(
                          f"{name}: "
                          f"{col} "
                          f"non-null="
                          f"{count}"
                      )


              flattened_fields[name] = stats


          # ============================================================
          # MANIFEST
          # ============================================================

          manifest = {
              "version":
                  "AlphaPilot-Data-V3.4",

              "execution_time":
                  now.isoformat(),

              "trade_date":
                  trade_date,

              "status":
                  (
                      "PASS"
                      if not errors
                      else "FAIL"
                  ),

              "row_counts":
                  row_counts,

              "source_dates":
                  source_dates,

              "coverage":
                  coverage,

              "flattened_fields":
                  flattened_fields,

              "warnings":
                  warnings,

              "errors":
                  errors,

              "sources": {
                  "twse_ohlcv":
                      "TWSE STOCK_DAY_ALL",

                  "tpex_ohlcv":
                      "TPEx "
                      "tpex_mainboard_"
                      "daily_close_quotes",

                  "twse_institutional":
                      "TWSE T86",

                  "tpex_institutional":
                      "TPEx "
                      "tpex_3insti_"
                      "daily_trading",
              },
          }


          (
              base
              / "manifest.json"
          ).write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )


          print(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              flush=True,
          )


          if errors:
              raise SystemExit(2)

          PY

          python fetch_today.py


