name: validate-bigmovers-v2

on:
  push:
    branches:
      - validation/bigmovers-20261013
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow tabulate
      - name: Restore and verify exact uploaded verifier
        shell: bash
        run: |
          cat validation_payload/bigmovers_*.b64 | base64 -d | gzip -d > validation_verify_bigmovers.py
          echo '9240ca640b0c41abb582955666c00d32a75fc83c7131bb33facdc48c179863ca  validation_verify_bigmovers.py' | sha256sum -c -
          python -m py_compile validation_verify_bigmovers.py
      - name: Run big-movers validation
        run: python validation_verify_bigmovers.py --hist data/history/2020-2025 --out bigmovers_out
      - name: Print report
        if: always()
        run: |
          if [ -f bigmovers_out/report.md ]; then cat bigmovers_out/report.md; fi
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigmovers-validation-v2
          path: bigmovers_out/
          if-no-files-found: warn
