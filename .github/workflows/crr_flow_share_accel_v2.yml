name: CRR Flow-Share Acceleration v2 Validation

on:
  pull_request:
    paths:
      - 'research/crr_flow_share_accel_v2.py'
      - 'research/prereg_crr_flow_share_accel_v2.json'
      - '.github/workflows/crr_flow_share_accel_v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests beautifulsoup4 lxml
      - name: Run preregistered CRR flow-share acceleration study
        run: python research/crr_flow_share_accel_v2.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crr-flow-share-accel-v2-results
          path: research/out/crr-flow-share-accel-v2
          if-no-files-found: warn
          retention-days: 14
