name: V6 PreLock Industry Boundary Audit

on:
  push:
    branches: [research-ai-market-reasoning-v6-parallel-stage0-20260917]
    paths:
      - 'scripts/audit_v6_prelock_industry_boundary.py'
      - '.github/workflows/research_ai_market_reasoning_v6_prelock_industry_boundary.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  boundary_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: python -m pip install pandas==2.2.3 requests lxml
      - name: Download exact frozen 0B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10526620525/zip > /tmp/v6-0b.zip
          mkdir -p /tmp/v6-0b
          unzip -q /tmp/v6-0b.zip -d /tmp/v6-0b
      - name: Download exact frozen 0F artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10537510796/zip > /tmp/v6-0f.zip
          mkdir -p /tmp/v6-0f
          unzip -q /tmp/v6-0f.zip -d /tmp/v6-0f
      - name: Run boundary equivalence and total-return missingness audit
        run: |
          python -u scripts/audit_v6_prelock_industry_boundary.py             --frozen-0b-manifest /tmp/v6-0b/manifests/0B_INDUSTRY.json             --frozen-feature-registry /tmp/v6-0f/0F_FINAL_ASSEMBLY/feature_registry.json
      - name: Upload immutable pre-lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-prelock-industry-boundary-audit
          path: prelock_v6_industry_boundary_audit/
          if-no-files-found: error
          retention-days: 90
