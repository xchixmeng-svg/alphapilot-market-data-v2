name: Adaptive Router Stage8 Robust Factor Discovery

on:
  push:
    branches: [r10-stage8-factor-discovery-20260909]
    paths:
      - 'scripts/adaptive_router_stage8_factor_discovery.py'
      - '.github/workflows/adaptive_router_stage8.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  factor-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow
      - name: Restore cached 2015-2020 reference bundle
        uses: actions/download-artifact@v4
        with:
          name: R10-2016-2020-reference-data-complete
          path: reference_bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: xchixmeng-svg/alphapilot-market-data-v2
          run-id: 34313660140
      - name: Assert cached-only and holdout contract
        run: |
          test -f reference_bundle/ohlcv_raw/yearly_2015.zip
          test -f reference_bundle/ohlcv_raw/yearly_2019.zip
          test -f reference_bundle/formal_2020/ohlcv_2020.parquet
          test -f reference_bundle/institutional_2015_2019/institutional_2018.csv.gz
          grep -q "market_refetch':False" scripts/adaptive_router_stage8_factor_discovery.py
          grep -q "uses_2021_2025':False" scripts/adaptive_router_stage8_factor_discovery.py
          grep -q "oos2_2020_used_for_tuning':False" scripts/adaptive_router_stage8_factor_discovery.py
      - name: Run Stage8 factor discovery
        run: python scripts/adaptive_router_stage8_factor_discovery.py
      - name: Guard anti-overfit contract
        run: |
          python - <<'PY'
          import json
          m=json.load(open('adaptive_router_stage8/stage8_manifest.json'))
          assert m['market_refetch'] is False
          assert m['formal_r10_modified'] is False
          assert m['uses_2021_2025'] is False
          assert m['oos2_2020_used_for_tuning'] is False
          assert m['discovery_uses_future_labels_only_within_2016_2018'] is True
          assert m['scale_invariant_liquidity_rank'] is True
          print('ROUTER_STAGE8_GATES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-router-stage8
          path: adaptive_router_stage8/
          if-no-files-found: error
