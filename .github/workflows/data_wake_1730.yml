name: Wake data fetch at 17:32 Taipei (no token needed)

# GitHub 排程常延遲幾小時，所以在下午先排幾個「鬧鐘」：哪一個先開始跑，就在機器上等到 17:32，
# 然後用 GitHub 內建的 GITHUB_TOKEN 叫「Taiwan Market Data Only」立刻開始（workflow_dispatch 允許內建金鑰觸發）。
# 就算三個鬧鐘都晚到 17:32 以後才開始，也是一開始就叫，不會比原本差。今天資料已經在 repo 就不叫。
# 公開 repo 的 Actions 免費，等待時間不花錢。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/data_wake_1730.yml']   # 修改這個檔時當天也會啟動一次（測試用）
  schedule:
    - cron: "7 6 * * 1-5"    # 14:07 Taipei
    - cron: "37 7 * * 1-5"   # 15:37 Taipei
    - cron: "7 9 * * 1-5"    # 17:07 Taipei

permissions:
  contents: read
  actions: write

concurrency:
  group: data-wake-1730
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Wait until 17:32 Taipei, then start the data fetch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          now=$(TZ=Asia/Taipei date +%s)
          target=$(TZ=Asia/Taipei date -d "$(TZ=Asia/Taipei date +%F) 17:32" +%s)
          today=$(TZ=Asia/Taipei date +%F)
          wait=$((target - now))
          echo "台北時間 $(TZ=Asia/Taipei date '+%F %T')，距 17:32 還有 ${wait} 秒"
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          if curl -sf "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data/${today}/manifest.json" >/dev/null; then
            echo "今天（${today}）的資料已經在 repo，不用再叫"; exit 0
          fi
          if [ "$(TZ=Asia/Taipei date +%H)" -ge 22 ]; then echo "已經很晚，交給 23:17／隔天 09:17 的排程"; exit 0; fi
          gh workflow run data_only.yml --ref main -R "$GITHUB_REPOSITORY"
          echo "已叫 Taiwan Market Data Only 開始抓 ${today}"
