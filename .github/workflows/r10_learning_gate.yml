name: AlphaPilot R10 Full Strategy Learning Gate

on:
  workflow_dispatch:
  push:
    branches: [clean-research-20260828]
    paths:
      - 'strategy_contracts/r10_locked_contract.json'
      - 'scripts/r10_learning_gate.py'
      - '.github/workflows/r10_learning_gate.yml'

jobs:
  learn-r10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas pyarrow numpy
      - name: Run learning regression gate
        run: PYTHONPATH=scripts python scripts/r10_learning_gate.py
      - name: Upload learning diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-full-strategy-learning-gate
          path: |
            clean_results/r10_learning_gate_summary.json
            clean_results/r10_learning_missing_teacher_orders.csv
            clean_results/r10_learning_extra_engine_orders.csv
