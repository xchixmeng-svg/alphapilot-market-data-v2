name: Build 2026 YTD Data Package
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_2026_ytd_package.py'
      - '.github/workflows/build_2026_ytd_package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build 2026 YTD package
        run: python scripts/build_2026_ytd_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaPilot_2026_YTD_Data_Package
          path: AlphaPilot_2026_YTD_Data_Package.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: AlphaPilot_2026_YTD_Audit
          path: data/history/2026-YTD
          retention-days: 7
