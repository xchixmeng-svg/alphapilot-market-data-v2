name: V32 12 sponsor-state structural hypotheses

on:
  workflow_dispatch:
  push:
    branches: [research-stock-repricing-v32-20260915]
    paths:
      - '.github/workflows/research_v32_sponsor_state_structures.yml'
      - 'scripts/research_v32_sponsor_state_structures.py'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Verify frozen history inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Verify immutable formal fingerprints
        run: |
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          echo "8aaca46ae7c6d2f0b4e1479878352901ffe90a8acaed122d3d2640c70ea817cc  data/reference/official_corporate_actions_2020_2025.csv" | sha256sum --check -
      - name: Reproduce locked R10 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf formal_run && mkdir formal_run
          for f in "$GITHUB_WORKSPACE"/data/history/2020-2025/*.parquet; do ln -s "$f" "$GITHUB_WORKSPACE/formal_run/$(basename "$f")"; done
          ln -s "$GITHUB_WORKSPACE/data/reference/official_corporate_actions_2020_2025.csv" "$GITHUB_WORKSPACE/formal_run/official_corporate_actions_2020_2025.csv"
          cd formal_run
          python ../scripts/r10_max_formal.py > execution.log
          cd ..
          python - <<'PY'
          import json
          a=json.load(open('formal_run/contract_audit.json')); s=json.load(open('formal_run/r10max_formal_summary.json'))['strategy']
          assert a['all_pass'],a
          assert abs(s['end_nav']-2403427.0678222505)<1e-7,s
          assert s['completed_trades']==150 and s['wins']==71 and s['losses']==79,s
          print('Formal R10 baseline unchanged')
          PY

  research:
    needs: guard
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        hypothesis:
          - pullback_acceptance_flow_floor
          - quiet_sponsorship_breakout
          - short_long_flow_agreement
          - residual_acceleration_uncrowded
          - sponsor_reversal_from_weakness
          - liquidity_shock_absorption
          - leader_reclaim_after_shakeout
          - multi_horizon_strength_not_extended
          - dispersion_opportunity_leader
          - broad_flow_independent_strength
          - calm_context_early_repricing
          - liquid_sponsor_compounder
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Verify frozen inputs and formal fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cd data/history/2020-2025 && sha256sum --check SHA256SUMS && cd ../../..
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          echo "8aaca46ae7c6d2f0b4e1479878352901ffe90a8acaed122d3d2640c70ea817cc  data/reference/official_corporate_actions_2020_2025.csv" | sha256sum --check -
      - name: Materialize causal formal inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf formal_run && mkdir formal_run
          for f in "$GITHUB_WORKSPACE"/data/history/2020-2025/*.parquet; do ln -s "$f" "$GITHUB_WORKSPACE/formal_run/$(basename "$f")"; done
          ln -s "$GITHUB_WORKSPACE/data/reference/official_corporate_actions_2020_2025.csv" "$GITHUB_WORKSPACE/formal_run/official_corporate_actions_2020_2025.csv"
          cd formal_run
          python ../scripts/r10_max_formal.py > execution.log
          test -s ohlcv_causal_2020_2025.csv.gz
          test -s institutional_2020_2025.parquet
          cd ..
      - name: Run structural hypothesis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_v32_sponsor_state_structures.py --hypothesis "${{ matrix.hypothesis }}" | tee "v32_${{ matrix.hypothesis }}.log"
      - name: Show audit
        if: always()
        run: test -f "v32_sponsor_state_out/${{ matrix.hypothesis }}/audit.json" && cat "v32_sponsor_state_out/${{ matrix.hypothesis }}/audit.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v32-${{ matrix.hypothesis }}
          path: |
            v32_${{ matrix.hypothesis }}.log
            v32_sponsor_state_out/${{ matrix.hypothesis }}/
          if-no-files-found: warn
          retention-days: 30
