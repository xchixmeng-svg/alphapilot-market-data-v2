name: Validate BSG V5 complete product

# Behaviour tests for every layer (start test, core lessons, training ground, blind exam, daily scenarios,
# final exam, retest, open-all review build) — tools/ci_v5_product.cjs drives the real page, not source greps.
on:
  push:
    branches: [bsg-learning-system-20261019]
    paths:
      - 'apps/become-stock-god-v2/**'
      - '.github/workflows/bsg-v5-product-ci.yml'

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/become-stock-god-v2/package.json
      - name: Install
        working-directory: apps/become-stock-god-v2
        run: npm install
      - name: Build complete product
        working-directory: apps/become-stock-god-v2
        run: npm run build:web
      - name: Syntax, learning audit, PWA files
        working-directory: apps/become-stock-god-v2
        run: |
          for f in engine content chart app; do node --check src/$f.js; done
          npm run audit:learning
          node - <<'NODE'
          const fs=require('fs')
          for(const f of ['dist/index.html','dist/manifest.webmanifest','dist/icon-192.png','dist/icon-512.png','dist/apple-touch-icon.png','dist/sw.js','dist/bgm.mp3'])if(!fs.existsSync(f)||fs.statSync(f).size<100)throw new Error('PWA file missing '+f)
          const m=JSON.parse(fs.readFileSync('dist/manifest.webmanifest','utf8'));if(m.display!=='standalone'||!m.icons||m.icons.length<2)throw new Error('manifest incomplete')
          const sc=JSON.parse(fs.readFileSync('build/scenarios.json','utf8'));if(sc.scenarios.length<72||sc.blockers.length)throw new Error('daily scenarios incomplete '+JSON.stringify(sc.blockers))
          const cs=JSON.parse(fs.readFileSync('build/cases.json','utf8'));if(cs.mixed.length!==100||cs.pre.length!==10||cs.post.length!==10||cs.finalPool.length<3)throw new Error('graded cases incomplete')
          const html=fs.readFileSync('dist/index.html','utf8');if(/window\.BSG_OPEN_ALL\s*=/.test(html))throw new Error('production build must not open everything')
          console.log('V5_STATIC_OK',{scenarios:sc.scenarios.length,mixed:cs.mixed.length,notes:cs.notes})
          NODE
      - name: Browser behaviour tests (phone landscape + Android portrait)
        working-directory: apps/become-stock-god-v2
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4175 -d dist >/tmp/bsg-v5-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BSG_URL=http://127.0.0.1:4175/ node tools/ci_v5_product.cjs
