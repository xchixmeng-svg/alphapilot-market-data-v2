name: 12 stock repricing research v13

on:
  workflow_dispatch:
  push:
    branches: [research-12-stock-repricing-v13-20260913]
    paths:
      - '.github/workflows/research_12_stock_repricing_v13.yml'

# Structural batch seeded from v12 Pareto evidence; no fixed bull/bear gate.
# 2025 remains untouched evidence. Daily/context layer only; no minute optimization.
jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        hypothesis:
          - dispersion_flow_leader
          - dispersion_lowvol_leader
          - dispersion_consensus_leader
          - dispersion_liquidity_burst_leader
          - dispersion_pullback_reentry
          - breadth_recovery_repricing
          - flow_breadth_recovery_leader
          - liquidity_contraction_leader
          - dispersion_flow_concentration
          - multi_horizon_leader_persistence
          - moderate_momentum_sponsored
          - participation_escape_leader
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 tabulate==0.9.0
      - name: Verify frozen history inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Verify locked formal fingerprints
        run: |
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          echo "8aaca46ae7c6d2f0b4e1479878352901ffe90a8acaed122d3d2640c70ea817cc  data/reference/official_corporate_actions_2020_2025.csv" | sha256sum --check -
      - name: Build frozen causal daily layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf formal_run && mkdir formal_run
          for f in "$GITHUB_WORKSPACE"/data/history/2020-2025/*.parquet; do ln -s "$f" "$GITHUB_WORKSPACE/formal_run/$(basename "$f")"; done
          ln -s "$GITHUB_WORKSPACE/data/reference/official_corporate_actions_2020_2025.csv" "$GITHUB_WORKSPACE/formal_run/official_corporate_actions_2020_2025.csv"
          cd formal_run
          python ../scripts/r10_max_formal.py > execution.log
      - name: Assert Formal R10-MAX unchanged
        run: |
          python - <<'PY'
          import json
          a=json.load(open('formal_run/contract_audit.json'))
          s=json.load(open('formal_run/r10max_formal_summary.json'))['strategy']
          assert a['all_pass'], a
          assert abs(s['end_nav']-2403427.0678222505)<1e-7, s
          assert s['completed_trades']==150 and s['wins']==71 and s['losses']==79, s
          PY
      - name: Build v13 causal repricing runtime
        run: python scripts/build_repricing_v13_runtime.py
      - name: Run hypothesis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_12_stock_repricing_v13_runtime.py --hypothesis "${{ matrix.hypothesis }}" | tee research_${{ matrix.hypothesis }}.log
          test -s research_out_12_stock_setups_v13/${{ matrix.hypothesis }}/portfolio_summary.csv
          test -s research_out_12_stock_setups_v13/${{ matrix.hypothesis }}/yearly_summary.csv
          test -s research_out_12_stock_setups_v13/${{ matrix.hypothesis }}/decision.json
      - name: Publish result
        if: always()
        run: |
          test -f research_out_12_stock_setups_v13/${{ matrix.hypothesis }}/portfolio_summary.csv && cat research_out_12_stock_setups_v13/${{ matrix.hypothesis }}/portfolio_summary.csv || true
          test -f research_out_12_stock_setups_v13/${{ matrix.hypothesis }}/yearly_summary.csv && cat research_out_12_stock_setups_v13/${{ matrix.hypothesis }}/yearly_summary.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-repricing-v13-${{ matrix.hypothesis }}
          path: |
            research_${{ matrix.hypothesis }}.log
            formal_run/contract_audit.json
            formal_run/r10max_formal_summary.json
            research_out_12_stock_setups_v13/${{ matrix.hypothesis }}/
          if-no-files-found: warn
