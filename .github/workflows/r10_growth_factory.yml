name: AlphaPilot R10 Growth Factory Strict T+1

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Optuna trials"
        required: false
        default: "180"
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_growth_factory.yml"
      - "scripts/r10_growth_factory.py"
      - "scripts/r10_strategy_factory.py"
      - "scripts/r10_fast_validation.py"
      - "scripts/r10_full_battery.py"
      - "scripts/backtest_r10_stress.py"
      - "scripts/build_r10_scan.py"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: r10-growth-factory-main
  cancel-in-progress: true

jobs:
  search:
    name: Search CAGR 50pct with every year positive
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore R10 historical data cache
        uses: actions/cache@v4
        with:
          path: .stress_cache
          key: r10-growth-factory-${{ runner.os }}-v2
          restore-keys: |
            r10-strategy-factory-${{ runner.os }}-
            r10-true-causal-${{ runner.os }}-
            r10-fiveyear-fast-${{ runner.os }}-
      - name: Install optimizer
        run: pip install requests pandas numpy optuna
      - name: Syntax and immutable Strict T+1 contract
        shell: bash
        run: |
          python -m py_compile scripts/r10_growth_factory.py scripts/r10_strategy_factory.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import r10_growth_factory as g
          c=g.base.strict_slot_contract()
          assert c['pass'] is True
          assert c['new_slot_available'] is False
          assert g.INITIAL_CAPITAL == 1_000_000.0
          assert g.TARGET_CAGR == 0.50
          assert g.RESEARCH_DD_FLOOR == -0.30
          src=open('scripts/r10_strategy_factory.py',encoding='utf-8').read()
          assert 'codes_after = {q.code for q in positions.values()}' in src
          assert 'exclude=sell_keys' not in src
          assert src.index('pending_sells.pop(di') < src.index('pending_buys.pop(di')
          print('GROWTH FACTORY STRICT T+1 CONTRACT: PASS', c)
          PY
      - name: Run Growth Factory
        env:
          TRIALS: ${{ github.event.inputs.trials || '180' }}
        run: python scripts/r10_growth_factory.py --trials "$TRIALS" --seed 20260828
      - name: Verify research output semantics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('stress_results/latest/growth_factory_strict_t1/summary.json')
          q=json.loads(p.read_text(encoding='utf-8'))
          assert q['hard_rules']['warmup']=='2020',q
          assert q['hard_rules']['evaluation']=='2021-2025',q
          assert q['hard_rules']['initial_capital_twd']==1_000_000.0,q
          assert q['hard_rules']['leverage'] is False,q
          assert q['hard_rules']['max_total_exposure']==1.0,q
          assert q['strict_t1_contract']['new_slot_available'] is False,q
          assert q['goal']['cagr_target']==0.50,q
          assert q['goal']['every_year_positive'] is True,q
          print('STATUS:',q['status'])
          print('TARGET HITS:',q['target_hit_count'])
          print('ALL-POSITIVE:',q['all_positive_count'])
          print('BEST End NAV:',q['best']['end_nav'])
          print('BEST CAGR:',q['best']['cagr'])
          print('BEST Max DD:',q['best']['max_dd'])
          print('BEST Annual:',q['best']['annual_returns'])
          print('BEST Trial:',q['best_trial'])
          PY
      - name: Upload Growth Factory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-growth-factory-strict-t1
          path: stress_results/latest/growth_factory_strict_t1
          if-no-files-found: warn
          retention-days: 90
