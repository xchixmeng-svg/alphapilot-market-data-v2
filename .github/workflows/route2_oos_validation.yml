name: Route2 OOS Validation

on:
  push:
    branches:
      - route2-oos-validation-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn pyarrow

      - name: Verify historical data
        run: |
          ls -lh data/history/2020-2025
          python - <<'PY'
          from pathlib import Path
          p=Path("data/history/2020-2025/history_audit.json")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Run original Route2 OOS validation
        shell: bash
        run: |
          set -o pipefail
          python research/route2_validate.py             --root "$GITHUB_WORKSPACE"             --top 1 3 5             --seeds 20 2>&1 | tee route2_run.log

      - name: Show outputs
        if: always()
        run: |
          find research/route2_out -maxdepth 3 -type f -print 2>/dev/null || true
          tail -n 200 route2_run.log 2>/dev/null || true

      - name: Upload Route2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route2-oos-validation-results
          path: |
            research/route2_out/**
            route2_run.log
          if-no-files-found: warn
