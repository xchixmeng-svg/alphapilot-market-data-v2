name: AlphaPilot R10 Contract Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/r10_contract_test.py"
      - "scripts/backtest_r10_stress.py"
      - "scripts/build_r10_scan.py"
      - "docs/R10_LOCKED_RULES_SOURCE_OF_TRUTH.md"
      - ".github/workflows/r10_contract_test.yml"

permissions:
  contents: read

jobs:
  contract:
    name: R10 locked rules seconds-level gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal runtime
        run: pip install -q numpy pandas requests
      - name: Syntax check
        run: python -m py_compile scripts/r10_contract_test.py scripts/backtest_r10_stress.py scripts/build_r10_scan.py
      - name: Run R10 contract test
        run: python scripts/r10_contract_test.py
      - name: Upload contract audit
        uses: actions/upload-artifact@v4
        with:
          name: r10-contract-audit
          path: contract_results/r10_contract_summary.json
          retention-days: 90
