name: Calm Phase2 Cross Section Forensics
on:
  workflow_dispatch:
  push:
    branches: [r10-calm-regime-research-20260909]
    paths:
      - scripts/calm_phase2_cross_section_forensics.py
      - .github/workflows/calm_phase2_forensics.yml
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Verify formal 2020-2025 immutable inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Run cross-sectional forensic analysis
        run: python scripts/calm_phase2_cross_section_forensics.py
      - uses: actions/upload-artifact@v4
        with:
          name: calm-phase2-cross-section-forensics
          path: calm_phase2_output/
          if-no-files-found: error
          retention-days: 90
