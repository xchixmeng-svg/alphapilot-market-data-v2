name: V6.2 Eight-Case Unconditional Profit Audit
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/v6_2_eight_case_unconditional_profit_audit.py'
      - '.github/workflows/v6_2_eight_case_unconditional_profit_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      V1_ARTIFACT: '10570644207'
      REASON_ARTIFACT: '10576322171'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Download exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/v1 inputs/reason
          get(){ gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" > /tmp/a.zip; unzip -oq /tmp/a.zip -d "$2"; }
          get "$V1_ARTIFACT" inputs/v1
          get "$REASON_ARTIFACT" inputs/reason
          test -s inputs/v1/EVIDENCE_BUNDLE_V1.parquet
          test -s inputs/reason/REAL_EVIDENCE_REASONING_RESULTS.csv
      - name: Audit eventual profit outcomes
        run: python -u scripts/v6_2_eight_case_unconditional_profit_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: v6-2-eight-case-unconditional-profit-audit
          path: out/
          if-no-files-found: error
          retention-days: 60
