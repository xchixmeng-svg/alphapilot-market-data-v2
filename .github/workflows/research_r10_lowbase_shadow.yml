name: R10 Low-base Shadow Persistence Research

on:
  push:
    branches:
      - research-r10-lowbase-persistence-20260914
    paths:
      - scripts/backtest_r10_lowbase_shadow_persistence.py
      - .github/workflows/research_r10_lowbase_shadow.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 tabulate==0.9.0
      - name: Verify immutable market inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Verify locked R10 engine fingerprint
        run: |
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          test "$(git rev-parse refs/remotes/origin/r10-no-trail-formal-fix-20260907)" = "3728a0045ab77d65b1bd9c73fcbe942f6c0bc0d9"
      - name: Run corrected shadow persistence comparison
        run: python scripts/backtest_r10_lowbase_shadow_persistence.py | tee lowbase_shadow_execution.log
      - name: Show comparison
        run: cat lowbase_shadow_results/LOWBASE_SHADOW_COMPARISON.csv
      - name: Upload compact results
        uses: actions/upload-artifact@v4
        with:
          name: r10-lowbase-shadow-results
          path: |
            lowbase_shadow_execution.log
            lowbase_shadow_results/LOWBASE_SHADOW_COMPARISON.csv
            lowbase_shadow_results/LOWBASE_SHADOW_COMPARISON.json
            lowbase_shadow_results/*/r10max_formal_summary.json
            lowbase_shadow_results/*/contract_audit.json
            lowbase_shadow_results/*/r10max_formal_trades.csv
            lowbase_shadow_results/*/r10max_formal_orders.csv
            lowbase_shadow_results/*/shadow_recommendations.csv
          if-no-files-found: error
          retention-days: 30
