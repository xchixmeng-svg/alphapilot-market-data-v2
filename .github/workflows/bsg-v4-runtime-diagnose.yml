name: Diagnose BSG V4 runtime

on:
  push:
    branches: [bsg-learning-system-20261019]
    paths:
      - '.github/workflows/bsg-v4-runtime-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        working-directory: apps/become-stock-god-v2
        run: |
          npm install
          npm run build:web
      - name: Runtime diagnostics
        working-directory: apps/become-stock-god-v2
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 -d dist >/tmp/bsg-v4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const errs=[];
            page.on('pageerror',e=>{const s='PAGEERROR '+String(e);errs.push(s);console.error(s)});
            page.on('console',m=>{if(m.type()==='error'){const s='CONSOLE '+m.text();errs.push(s);console.error(s)}});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'load',timeout:30000});
            await page.waitForTimeout(500);
            const state=await page.evaluate(()=>({
              hasBSG:!!window.BSG,
              hasContent:!!window.BSG_CONTENT,
              hasChart:!!window.BSGChart,
              hasApp:!!window.BSGV3,
              hasV3:!!window.BSG_V3_VISUALS,
              hasV4:!!window.BSG_V4_FOUNDATION,
              v3:window.BSG_V3_VISUALS&&window.BSG_V3_VISUALS.version,
              v4:window.BSG_V4_FOUNDATION&&window.BSG_V4_FOUNDATION.version,
              appText:(document.getElementById('app')||{}).innerText&&document.getElementById('app').innerText.slice(0,160)
            }));
            console.log('RUNTIME_STATE',JSON.stringify(state));
            console.log('RUNTIME_ERRORS',JSON.stringify(errs));
            if(!state.hasV4||state.v4!=='learning-foundation-v7'||!state.hasV3||!state.hasApp)throw new Error('runtime bootstrap incomplete '+JSON.stringify(state)+' errors='+JSON.stringify(errs));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload built app even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsg-v4-runtime-diagnose
          path: apps/become-stock-god-v2/dist/index.html
          retention-days: 3
