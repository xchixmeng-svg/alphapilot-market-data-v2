name: R10 Golden Source Hash Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_source_hash_audit.yml"
      - "golden/R10_GOLDEN_MASTER_summary.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare yearly ZIP SHA-256 against official R10 Golden Master
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          g=json.loads(pathlib.Path('golden/R10_GOLDEN_MASTER_summary.json').read_text(encoding='utf-8'))
          base='https://github.com/yukishirotsubasa/tw-stock-data-release/releases/download/daily-close-csv/yearly_{year}.zip'
          bad=[]
          for year in range(2020,2026):
              name=f'yearly_{year}.zip'
              print(f'[SOURCE] downloading {name}', flush=True)
              with urllib.request.urlopen(base.format(year=year), timeout=180) as r:
                  b=r.read()
              got=hashlib.sha256(b).hexdigest()
              exp=g['source_hashes'][name]
              ok=got==exp
              print(f'[SOURCE] {name} bytes={len(b)} sha256={got} expected={exp} match={ok}', flush=True)
              if not ok: bad.append((name,got,exp,len(b)))
          print(f'[SOURCE] matched={6-len(bad)}/6 mismatched={len(bad)}')
          if bad:
              print('[SOURCE] DATA SOURCE MISMATCH: current RELEASE is not the Golden Master OHLCV input')
              for x in bad: print('[SOURCE] mismatch',x)
              raise SystemExit(2)
          print('[SOURCE] PASS: exact Golden Master yearly ZIP inputs')
          PY
