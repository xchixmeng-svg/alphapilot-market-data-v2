name: Pivot Structure Engine
on:
  push:
    branches: [research/pivot-deep-test-20261025]
    paths:
      - 'research/pivot_structure_engine.py'
      - '.github/workflows/pivot_structure_engine.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pivot-deep-test-20261025
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.3.3 numpy==2.3.4 pyarrow==21.0.0
      - run: python research/pivot_structure_engine.py
      - name: save results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/pivot_structure_engine_20261025
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: save pivot structure engine results"
          git push origin HEAD:research/pivot-deep-test-20261025
