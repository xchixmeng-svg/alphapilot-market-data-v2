name: AlphaPilot R10 Five-Year Golden Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_five_year_validation.yml"
      - "scripts/backtest_r10_stress.py"
      - "scripts/r10_fast_validation.py"
      - "scripts/patch_fast_execution_v4.py"
      - "scripts/patch_golden_pool_v7.py"
      - "scripts/patch_golden_full_stream_v10.py"
      - "scripts/patch_golden_price_basis_v11.py"
      - "scripts/r10_locked_validation_v2.py"
      - "scripts/r10_contract_test.py"
      - "tests/fixtures/golden_2021_2025/**"
      - "tests/fixtures/r10_2021_2025_r05_exit_schedule.csv"
      - "tests/fixtures/r10_2021_2025_r05_orders_65.csv"
      - "docs/R10_LOCKED_RULES_SOURCE_OF_TRUTH.md"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: r10-five-year-golden-regression-main
  cancel-in-progress: true

jobs:
  validate:
    name: 2021-2025 formal-workbook regression
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .stress_cache
          key: r10-golden-${{ runner.os }}-v15-price-basis
          restore-keys: |
            r10-fiveyear-fast-${{ runner.os }}-
            r10-fiveyear-validation-${{ runner.os }}-
      - run: pip install requests pandas numpy

      - name: Validate complete golden ledgers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          d=Path('tests/fixtures/golden_2021_2025')
          op=sorted(d.glob('orders_part*.csv'))
          xp=sorted(d.glob('exits_part*.csv'))
          assert len(op)==6, op
          assert len(xp)==3, xp
          o=pd.concat([pd.read_csv(p,dtype={'code':str}) for p in op],ignore_index=True)
          x=pd.concat([pd.read_csv(p,dtype={'code':str}) for p in xp],ignore_index=True)
          assert len(o)==410, len(o)
          assert len(x)==241, len(x)
          assert int((o.status=='FILLED').sum())==241
          assert int((o.status=='MISSED').sum())==169
          assert int((o.strategy=='R7').sum())==345
          assert int((o.strategy=='R05').sum())==65
          assert int((x.strategy=='R7').sum())==197
          assert int((x.strategy=='R05').sum())==44
          for c in ('open_raw','exit_price','shares','proceeds'):
            assert c in x.columns, c
            assert x[c].notna().all(), c
          assert abs(float(x.iloc[2].exit_price)-26.5)<1e-9
          print('Golden ledgers PASS: orders=410 fills=241 misses=169 exits=241 with prices/proceeds')
          PY

      - name: Apply base execution repairs
        run: python scripts/patch_fast_execution_v4.py
      - name: Apply common-pool and DD-cap repairs
        run: python scripts/patch_golden_pool_v7.py
      - name: Apply full historical golden stream
        run: python scripts/patch_golden_full_stream_v10.py
      - name: Apply formal execution price basis
        run: python scripts/patch_golden_price_basis_v11.py

      - name: Syntax check
        run: python -m py_compile scripts/backtest_r10_stress.py scripts/r10_fast_validation.py scripts/r10_locked_validation_v2.py scripts/r10_contract_test.py scripts/patch_golden_pool_v7.py scripts/patch_golden_full_stream_v10.py scripts/patch_golden_price_basis_v11.py

      - name: Golden source gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/r10_fast_validation.py').read_text(encoding='utf-8')
          assert 'golden_orders_by_day' in s
          assert 'golden_order_key' in s
          assert 'golden_exit' in s
          assert 'golden_exec' in s
          assert 'len(go) != 410' in s
          assert 'len(gx) != 241' in s
          assert 'golden fill-status mismatch' in s
          assert 'golden target_cash mismatch' in s
          assert 'golden shares mismatch' in s
          assert 'golden sell-price mismatch' in s
          assert 'golden sell-proceeds mismatch' in s
          assert 'sell_open=float(r.aopen)' in s
          assert 'buy_open=float(r.aopen)' in s
          assert 'dd_cap=bt.MAX_TOTAL' in s
          assert 'target=base_target*bt.dd_multiplier(dd)' not in s
          assert 'AlphaPilot-R10-FastValidation-v11-GOLDEN-PRICE-BASIS' in s
          print('Full golden execution-price source gate: PASS')
          PY

      - name: Contract tests
        run: python scripts/r10_contract_test.py

      - name: Run five-year formal-workbook regression
        run: python scripts/r10_locked_validation_v2.py

      - name: Enforce complete regression result
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, pandas as pd
          out=pathlib.Path('stress_results/latest/validation2021_2025')
          q=json.loads((out/'summary.json').read_text(encoding='utf-8'))
          od=pd.read_csv(out/'orders.csv',dtype={'code':str})
          tr=pd.read_csv(out/'trades.csv',dtype={'code':str})
          buys=od[od.side.eq('BUY')]
          assert q.get('status')=='PASS', q
          assert q.get('historical_regression_uses_full_golden_order_stream') is True, q
          assert q.get('golden_order_fixture_rows')==410, q
          assert q.get('historical_regression_uses_full_golden_exit_stream') is True, q
          assert q.get('golden_exit_fixture_rows')==241, q
          assert len(buys)==410, len(buys)
          assert int(buys.filled.sum())==241, buys.filled.value_counts().to_dict()
          assert len(tr)==241, len(tr)
          print('End NAV:',q.get('end_nav'))
          print('CAGR:',q.get('cagr'))
          print('Max DD:',q.get('max_dd'))
          print('BUY orders:',len(buys),'fills:',int(buys.filled.sum()),'trades:',len(tr))
          PY

      - name: Upload audit even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-2021-2025-golden-price-v15
          path: |
            stress_results/latest/validation2021_2025
            contract_results/r10_contract_summary.json
          if-no-files-found: ignore
          retention-days: 90
