name: AlphaPilot R10 True Causal Five-Year Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_five_year_validation.yml"
      - "scripts/backtest_r10_stress.py"
      - "scripts/r10_full_battery.py"
      - "scripts/r10_fast_validation.py"
      - "scripts/r10_true_validation.py"
      - "scripts/r10_fresh_source_audit.py"
      - "scripts/r10_reference_diff_only.py"
      - "scripts/build_r10_scan.py"
      - "docs/R10_LOCKED_RULES_SOURCE_OF_TRUTH.md"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: r10-five-year-true-causal-main
  cancel-in-progress: true

jobs:
  validate:
    name: 2021-2025 regenerate from raw data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .stress_cache
          key: r10-true-causal-${{ runner.os }}-v3-fresh-audit
          restore-keys: |
            r10-true-causal-${{ runner.os }}-
            r10-fiveyear-fast-${{ runner.os }}-
            r10-fiveyear-validation-${{ runner.os }}-
      - run: pip install requests pandas numpy

      - name: Prove engine/reference separation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/r10_true_validation.py').read_text(encoding='utf-8')
          forbidden=[
            'tests/fixtures', 'golden_2021_2025',
            'r10_2021_2025_r05_exit_schedule', 'r10_2021_2025_r05_orders_65',
            'LEGACY_CONTAMINATED_BENCHMARK', 'CAUSAL_BENCHMARK',
            'golden_orders_by_day', 'golden_exit', 'golden_exec',
          ]
          for token in forbidden:
            assert token not in s, f'forbidden reference input in true engine: {token}'
          required=[
            'bt.load_scenario_ohlcv(cfg)',
            'fast.fetch_institutional_fast',
            'fast.precompute_signals',
            'bt.r05_exit_reason(p, r)',
            'bt.legal_sell_price(float(r.open))',
            'bt.buy_fill(float(r.open), float(r.low), float(o.limit))',
            'fixture_inputs_used": False',
            'future_data_used": False',
          ]
          for token in required:
            assert token in s, f'missing true-engine gate: {token}'
          assert s.index('pending_sells.pop(di') < s.index('pending_buys.pop(di'), 'T+1 must sell before buy'
          print('TRUE ENGINE SEPARATION: PASS')
          PY

      - name: Syntax and sizing contracts
        shell: bash
        run: |
          python -m py_compile scripts/r10_true_validation.py scripts/r10_fresh_source_audit.py scripts/r10_reference_diff_only.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import r10_true_validation as t
          # Generic rule tests only; no historical answer fixtures.
          s,m=t.size_shares_true(260000,27.0,10000000)
          assert s==9000 and m=='BOARD_LOT',(s,m)
          s,m=t.size_shares_true(20000,50.0,10000000)
          assert 0<s<1000 and m=='HIGH_PRICE_ODDLOT',(s,m)
          s,m=t.size_shares_true(49999,50.0,10000000)
          assert s*50.0<=49999+1e-9,(s,m)
          print('TRUE SIZING CONTRACTS: PASS')
          PY

      - name: Run clean five-year causal engine
        run: python scripts/r10_true_validation.py

      - name: Enforce causal portfolio invariants
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, pandas as pd
          out=pathlib.Path('stress_results/latest/true_validation2021_2025')
          q=json.loads((out/'summary.json').read_text(encoding='utf-8'))
          p=json.loads((out/'data_provenance.json').read_text(encoding='utf-8'))
          od=pd.read_csv(out/'orders.csv',dtype={'code':str})
          assert q['status']=='PASS',q
          assert q['fixture_inputs_used'] is False,q
          assert q['future_data_used'] is False,q
          assert p['fixture_inputs_used'] is False,p
          assert p['institutional_eval_dates']>=1214,p
          assert q['min_cash']>=-1e-6,q
          assert q['max_positions']<=5,q
          # MAX_TOTAL=95% is an order-time projected cap. Natural price drift
          # above 95% is not an undocumented forced-sell trigger.
          assert q['max_exposure']<1.0,q
          buys=od[od.side.eq('BUY')]
          assert len(buys)>0
          assert buys.shares.notna().all()
          assert (buys.shares.astype(int)==buys.shares).all()
          print('TRUE RESULT End NAV:',q['end_nav'])
          print('TRUE RESULT CAGR:',q['cagr'])
          print('TRUE RESULT Max DD:',q['max_dd'])
          print('TRUE RESULT observed max exposure:',q['max_exposure'])
          print('TRUE RESULT orders/fills/trades:',q['orders'],q['fills'],q['completed_trades'])
          print('OHLCV SHA256:',p['ohlcv_sha256'])
          print('Institutional SHA256:',p['institutional_sha256'])
          PY

      - name: Fresh official-source audit
        run: python scripts/r10_fresh_source_audit.py

      - name: Compare old references after run only
        if: always()
        run: python scripts/r10_reference_diff_only.py

      - name: Upload true causal audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-2021-2025-true-causal-v3
          path: |
            stress_results/latest/true_validation2021_2025
          if-no-files-found: ignore
          retention-days: 90
