name: AlphaPilot R10 True Causal Five-Year Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_five_year_validation.yml"
      - "scripts/backtest_r10_stress.py"
      - "scripts/patch_r05_runner_state_v1.py"
      - "scripts/patch_true_cash_reservation_v1.py"
      - "scripts/patch_true_pending_sell_semantics_v1.py"
      - "scripts/patch_true_total_return_benchmark_v1.py"
      - "scripts/r10_total_return_benchmark.py"
      - "scripts/r10_0050_total_return_reconstruct_audit.py"
      - "scripts/r10_full_battery.py"
      - "scripts/r10_fast_validation.py"
      - "scripts/r10_true_validation.py"
      - "scripts/r10_fresh_source_audit.py"
      - "scripts/r10_reference_diff_only.py"
      - "scripts/r10_first_divergence_diagnosis.py"
      - "scripts/r10_r05_exit_timing_audit.py"
      - "scripts/r10_contract_test.py"
      - "scripts/r10_exit_causality_contract.py"
      - "scripts/build_r10_scan.py"
      - "docs/R10_LOCKED_RULES_SOURCE_OF_TRUTH.md"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: r10-five-year-true-causal-main
  cancel-in-progress: true

jobs:
  validate:
    name: 2021-2025 regenerate from raw data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .stress_cache
          key: r10-true-causal-${{ runner.os }}-v11c-reconstructed-0050-tr
          restore-keys: |
            r10-true-causal-${{ runner.os }}-
            r10-fiveyear-fast-${{ runner.os }}-
            r10-fiveyear-validation-${{ runner.os }}-
      - run: pip install requests pandas numpy

      - name: Apply documented R0.5 Runner state repair
        run: python scripts/patch_r05_runner_state_v1.py

      - name: Apply formal reconstructed 0050 ETF total-return benchmark
        run: python scripts/patch_true_total_return_benchmark_v1.py

      - name: Apply formal T-day cash reservation repair
        run: python scripts/patch_true_cash_reservation_v1.py

      - name: Apply formal pending-sell exposure semantics
        run: python scripts/patch_true_pending_sell_semantics_v1.py

      - name: Prove engine/reference separation and formal data semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/r10_true_validation.py').read_text(encoding='utf-8')
          forbidden=[
            'tests/fixtures', 'golden_2021_2025',
            'r10_2021_2025_r05_exit_schedule', 'r10_2021_2025_r05_orders_65',
            'LEGACY_CONTAMINATED_BENCHMARK', 'CAUSAL_BENCHMARK',
            'golden_orders_by_day', 'golden_exit', 'golden_exec',
          ]
          for token in forbidden:
            assert token not in s, f'forbidden reference input in true engine: {token}'
          required=[
            'bt.load_scenario_ohlcv(cfg)',
            'fast.fetch_institutional_fast',
            'fast.precompute_signals',
            'trb.load_0050_total_return',
            '"r7_benchmark": benchmark_meta',
            'bt.r05_exit_reason(p, r)',
            'bt.legal_sell_price(float(r.open))',
            'bt.buy_fill(float(r.open), float(r.low), float(o.limit))',
            'reserved_cash', 'rem_cash = max(0.0, cash - reserved_cash)',
            'base_exposure = bt.value_of(positions, feat_idx, di)',
            'base_r7 = bt.value_of(positions, feat_idx, di, strategy="R7")',
            'current_code = bt.value_of(positions, feat_idx, di, code=code)',
            'if strategy == "R7" and k in sell_keys:',
            'fixture_inputs_used": False',
            'future_data_used": False',
          ]
          for token in required:
            assert token in s, f'missing true-engine gate: {token}'
          assert 'base_exposure = bt.value_of(positions, feat_idx, di, exclude=sell_keys)' not in s
          assert 'current_code = bt.value_of(positions, feat_idx, di, code=code, exclude=sell_keys)' not in s
          assert s.index('pending_sells.pop(di') < s.index('pending_buys.pop(di'), 'T+1 must sell before buy'
          print('TRUE ENGINE SEPARATION / FORMAL DATA SEMANTICS: PASS')
          PY

      - name: Syntax and generic sizing contracts
        shell: bash
        run: |
          python -m py_compile scripts/r10_true_validation.py scripts/r10_total_return_benchmark.py scripts/r10_0050_total_return_reconstruct_audit.py scripts/r10_fresh_source_audit.py scripts/r10_reference_diff_only.py scripts/r10_first_divergence_diagnosis.py scripts/r10_r05_exit_timing_audit.py scripts/r10_contract_test.py scripts/r10_exit_causality_contract.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import r10_true_validation as t
          s,m=t.size_shares_true(260000,27.0,10000000)
          assert s==9000 and m=='BOARD_LOT',(s,m)
          s,m=t.size_shares_true(20000,50.0,10000000)
          assert 0<s<1000 and m=='HIGH_PRICE_ODDLOT',(s,m)
          s,m=t.size_shares_true(49999,50.0,10000000)
          assert s*50.0<=49999+1e-9,(s,m)
          print('TRUE SIZING CONTRACTS: PASS')
          PY

      - name: Locked-rule contracts without performance answers
        run: python scripts/r10_contract_test.py

      - name: Strict exit causality contract
        run: python scripts/r10_exit_causality_contract.py

      - name: Run clean five-year causal engine
        run: python scripts/r10_true_validation.py

      - name: Enforce causal portfolio cash and benchmark invariants
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, pandas as pd
          out=pathlib.Path('stress_results/latest/true_validation2021_2025')
          q=json.loads((out/'summary.json').read_text(encoding='utf-8'))
          p=json.loads((out/'data_provenance.json').read_text(encoding='utf-8'))
          od=pd.read_csv(out/'orders.csv',dtype={'code':str})
          nav=pd.read_csv(out/'daily_nav.csv')
          assert q['status']=='PASS',q
          assert q['fixture_inputs_used'] is False,q
          assert q['future_data_used'] is False,q
          assert p['fixture_inputs_used'] is False,p
          assert p['institutional_eval_dates']>=1214,p
          b=p.get('r7_benchmark') or {}
          assert b.get('series')=='0050 ETF Total Return',b
          assert '0050 ETF Total Return reconstructed' in str(b.get('source','')),b
          assert b.get('aligned_dates',0)>=1214,b
          assert len(str(b.get('sha256','')))==64,b
          assert 'forward-fill' in str(b.get('fill_policy','')).lower(),b
          assert float(b.get('annual_max_abs_delta',1))<5e-6,b
          assert abs(float(b.get('end_nav',0))-4889670.977723458)<0.1,b
          assert q['min_cash']>=-1e-6,q
          assert q['max_positions']<=5,q
          assert q['max_exposure']<1.0,q
          buys=od[od.side.eq('BUY')].copy()
          sells=od[od.side.eq('SELL')].copy()
          assert len(buys)>0
          assert buys.shares.notna().all()
          assert (buys.shares.astype(int)==buys.shares).all()
          reserved=buys.groupby('decision_date',as_index=False).reserved_cash.sum()
          chk=reserved.merge(nav[['date','cash']],left_on='decision_date',right_on='date',how='left')
          bad=chk[chk.reserved_cash>chk.cash+1e-6]
          assert bad.empty, bad.sort_values('reserved_cash',ascending=False).head(10).to_dict('records')
          sb={(int(r.decision_date),str(r.strategy),str(r.code).zfill(4)) for r in sells.itertuples(index=False)}
          bb={(int(r.decision_date),str(r.strategy),str(r.code).zfill(4)) for r in buys.itertuples(index=False)}
          churn=sorted(k for k in sb & bb if k[1]=='R7')
          assert not churn, churn[:10]
          print('0050 ETF TOTAL RETURN FINGERPRINT: PASS',b)
          print('T-DAY CASH RESERVATION: PASS days=',len(chk))
          print('R7 SAME-DAY EXIT/REENTRY: PASS')
          print('TRUE RESULT End NAV:',q['end_nav'])
          print('TRUE RESULT CAGR:',q['cagr'])
          print('TRUE RESULT Max DD:',q['max_dd'])
          print('TRUE RESULT observed max exposure:',q['max_exposure'])
          print('TRUE RESULT orders/fills/trades:',q['orders'],q['fills'],q['completed_trades'])
          print('OHLCV SHA256:',p['ohlcv_sha256'])
          print('Institutional SHA256:',p['institutional_sha256'])
          print('0050TR SHA256:',b['sha256'])
          PY

      - name: Diagnose first divergence from formal ledger
        run: python scripts/r10_first_divergence_diagnosis.py

      - name: Audit all formal R0.5 exit decision dates
        run: python scripts/r10_r05_exit_timing_audit.py

      - name: Fresh official-source audit
        run: python scripts/r10_fresh_source_audit.py

      - name: Compare old references after run only
        if: always()
        run: python scripts/r10_reference_diff_only.py

      - name: Upload true causal audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-2021-2025-true-causal-v11c
          path: |
            stress_results/latest/true_validation2021_2025
            contract_results/r10_contract_summary.json
          if-no-files-found: ignore
          retention-days: 90
