name: V6.1 PreLock Corporate-Action-Safe Audit
on:
  push:
    branches: [research-ai-market-reasoning-v6-1-corp-safe-20260918]
    paths:
      - 'research/V6_1_CORP_SAFE_PREREGISTRATION.md'
      - 'scripts/backtest_ai_market_reasoning_v6_1_corp_safe.py'
      - 'scripts/audit_v6_1_prelock.py'
      - '.github/workflows/research_ai_market_reasoning_v6_1_prelock.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scipy==1.18.1 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Download exact frozen Stage0F
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10537510796/zip > /tmp/v6-0f.zip
          mkdir -p /tmp/v6-0f
          unzip -q /tmp/v6-0f.zip -d /tmp/v6-0f
          mkdir -p data/history/v6-layered
          cp -a /tmp/v6-0f/. data/history/v6-layered/
      - name: Run V6.1 pre-lock audit
        run: python -u scripts/audit_v6_1_prelock.py
      - name: Upload pre-lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-1-prelock-corp-safe-audit
          path: v6_1_prelock_audit/
          if-no-files-found: error
          retention-days: 90
