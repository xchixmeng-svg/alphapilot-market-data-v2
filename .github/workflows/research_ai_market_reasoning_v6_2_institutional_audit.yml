name: V6.2 Institutional Supplemental Source Admission Audit
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/audit_v6_2_institutional_source.py'
      - '.github/workflows/research_ai_market_reasoning_v6_2_institutional_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: python -m pip install pandas==2.2.3 pyarrow==18.1.0 numpy==2.3.5
      - name: Audit historical institutional source
        run: python -u scripts/audit_v6_2_institutional_source.py
      - name: Upload institutional admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-2-institutional-source-admission-audit
          path: v6_2_institutional_admission_audit/
          if-no-files-found: error
          retention-days: 90
