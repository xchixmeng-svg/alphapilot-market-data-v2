name: R10 MAX Crash Risk Overlay Backtest

on:
  workflow_dispatch:
  push:
    branches: [r10-crash-risk-overlay-research-20260907]
    paths:
      - scripts/r10_crash_overlay_backtest.py
      - scripts/summarize_crash_overlays.py
      - .github/workflows/r10_crash_overlay_backtest.yml

permissions:
  contents: read

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        policy: [BASE, E_MARKET_SHOCK, E_EXHAUSTION, E_DISTRIBUTION, H_FAST_FAIL, H_STRESS_FAIL, C_SELECTIVE]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Verify immutable baseline and history
        run: |
          test "$(git merge-base HEAD 3728a0045ab77d65b1bd9c73fcbe942f6c0bc0d9)" = "3728a0045ab77d65b1bd9c73fcbe942f6c0bc0d9"
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          cd data/history/2020-2025 && sha256sum --check SHA256SUMS
      - run: python scripts/r10_crash_overlay_backtest.py --policy "${{ matrix.policy }}" --output "results/${{ matrix.policy }}"
      - uses: actions/upload-artifact@v4
        with:
          name: crash-overlay-${{ matrix.policy }}
          path: |
            results/${{ matrix.policy }}/crash_overlay_summary.json
            results/${{ matrix.policy }}/r10max_formal_trades.csv
            results/${{ matrix.policy }}/crash_risk_entry_vetoes.csv
            results/${{ matrix.policy }}/crash_risk_exits.csv
            results/${{ matrix.policy }}/contract_audit.json
          retention-days: 30

  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {pattern: "crash-overlay-*", path: all_results}
      - run: python scripts/summarize_crash_overlays.py | tee aggregate/summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: R10_Crash_Overlay_Complete_Report
          path: aggregate
          retention-days: 30
