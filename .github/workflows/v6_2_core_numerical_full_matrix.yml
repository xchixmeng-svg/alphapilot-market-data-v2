name: V6.2 Core Numerical Full 11-Task Matrix
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/run_v6_2_core_numerical_full_matrix.py'
      - '.github/workflows/v6_2_core_numerical_full_matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  task:
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        task:
          [u5_d3_h5, u5_d3_h10, u5_d3_h20,
           u10_d5_h10, u10_d5_h20, u10_d5_h40, u10_d5_h60,
           u20_d10_h20, u20_d10_h40, u20_d10_h60, u20_d10_h120]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      V1_ARTIFACT: '10570644207'
      ZERO_F_ARTIFACT: '10537510796'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 scikit-learn==1.5.2
      - name: Download exact clean V1 and frozen feature registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/v1 inputs/0f
          get(){ gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" > /tmp/a.zip; unzip -oq /tmp/a.zip -d "$2"; }
          get "$V1_ARTIFACT" inputs/v1
          get "$ZERO_F_ARTIFACT" inputs/0f
          test -s inputs/v1/EVIDENCE_BUNDLE_V1.parquet
          test -s inputs/0f/0F_FINAL_ASSEMBLY/feature_registry.json
      - name: Run fixed numerical barrier task
        run: python -u scripts/run_v6_2_core_numerical_full_matrix.py --task "${{ matrix.task }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-2-core-full-${{ matrix.task }}
          path: v6_2_core_numerical/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: task
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scikit-learn==1.5.2
      - name: Download task artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/tasks
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir inputs/tasks
          find inputs/tasks -type f -printf '%p %s bytes\n' | sort
      - name: Aggregate
        run: python -u scripts/run_v6_2_core_numerical_full_matrix.py --aggregate inputs/tasks
      - uses: actions/upload-artifact@v4
        with:
          name: v6-2-core-numerical-full-matrix
          path: v6_2_core_numerical/
          if-no-files-found: error
          retention-days: 90
