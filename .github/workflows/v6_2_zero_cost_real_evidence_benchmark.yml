name: V6.2 Zero-Cost Real Evidence Reasoning Benchmark
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/v6_2_zero_cost_real_evidence_benchmark.py'
      - '.github/workflows/v6_2_zero_cost_real_evidence_benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      V62_LOCAL_MODEL: qwen2.5:3b
      V1_ARTIFACT: '10570644207'
      NUM_ARTIFACT: '10572172533'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime
        run: |
          python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
          curl -fsSL https://ollama.com/install.sh | sh
      - name: Start model and fetch exact research artifacts
        shell: bash
        run: |
          set -euo pipefail
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 1; done
          ollama pull "$V62_LOCAL_MODEL"
          mkdir -p inputs/v1 inputs/num
          get(){ gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" > /tmp/a.zip; unzip -oq /tmp/a.zip -d "$2"; }
          get "$V1_ARTIFACT" inputs/v1
          get "$NUM_ARTIFACT" inputs/num
          NUMFILE=$(find inputs/num -name 'u10_d5_h20_AUDIT_SAMPLE.csv' -print -quit)
          test -n "$NUMFILE"
          cp "$NUMFILE" inputs/num/u10_d5_h20_AUDIT_SAMPLE.csv
      - name: Run 8-stock real evidence benchmark
        run: python -u scripts/v6_2_zero_cost_real_evidence_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-2-zero-cost-real-evidence-reasoning-benchmark
          path: out/
          if-no-files-found: warn
          retention-days: 60
