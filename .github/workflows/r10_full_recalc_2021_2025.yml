name: R10 Full Recalc 2021-2025

on:
  workflow_dispatch:
  push:
    branches: [r10-full-recalc-20260830]
    paths:
      - '.github/workflows/r10_full_recalc_2021_2025.yml'

permissions:
  contents: read

concurrency:
  group: r10-full-recalc-2021-2025
  cancel-in-progress: false

jobs:
  full-recalc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout research engine
        uses: actions/checkout@v4

      - name: Checkout immutable market data from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: market-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy requests pyarrow

      - name: Use immutable raw OHLCV and institutional data
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('scripts/backtest_r10_stress.py')
          s=p.read_text(encoding='utf-8')

          load_new='''def load_scenario_ohlcv(cfg: dict) -> pd.DataFrame:\n    parts=[]\n    base=ROOT / "market-data" / "data" / "history" / "2020-2025"\n    for y in cfg["years"]:\n        fp=base / f"ohlcv_{y}.parquet"\n        if not fp.exists():\n            raise RuntimeError(f"missing immutable main data: {fp}")\n        parts.append(pd.read_parquet(fp))\n    q=pd.concat(parts,ignore_index=True)\n    q=normalize_ohlcv(q)\n    lo,hi=intdate(cfg["warmup_start"]),intdate(cfg["eval_end"])\n    q=q[(q.date>=lo)&(q.date<=hi)].copy()\n    if q.empty or "0050" not in set(q.code):\n        raise RuntimeError("scenario OHLCV/0050 missing")\n    return q\n'''
          s,n=re.subn(r'def load_scenario_ohlcv\(cfg: dict\) -> pd\.DataFrame:.*?(?=def build_features)',load_new+'\n',s,flags=re.S)
          if n!=1: raise RuntimeError(f'load_scenario_ohlcv patch count={n}')

          features_new='''def build_features(raw: pd.DataFrame) -> Tuple[pd.DataFrame, int, pd.DataFrame]:\n    adj, events = core.adjust(raw)\n    feat = core.features(adj)\n    feat["avgvol20"] = (\n        feat.groupby("code", sort=False).volume.rolling(20, min_periods=20).mean().reset_index(level=0, drop=True)\n    )\n    bm = feat[feat.code.eq("0050")][["date", "aclose"]].dropna().copy()\n    bm = bm.rename(columns={"aclose": "mkt"}).drop_duplicates("date").sort_values("date")\n    # The archived 0050 source has seven documented holes. Formal benchmark\n    # convention is strictly past-only forward fill onto the full market\n    # calendar; never backward-fill or use future data. This is the same\n    # convention audited by r10_0050_total_return_reconstruct_audit.py.\n    cal = pd.DataFrame({"date": sorted(int(x) for x in feat.date.unique())})\n    bm = cal.merge(bm, on="date", how="left").sort_values("date")\n    missing = bm["mkt"].isna()\n    missing_dates = bm.loc[missing, "date"].astype(int).tolist()\n    bm["mkt"] = bm["mkt"].ffill()\n    if bm["mkt"].isna().any():\n        raise RuntimeError(f"0050 benchmark has leading missing values: {bm[bm.mkt.isna()].date.head().tolist()}")\n    log(f"[0050 FORMAL FFILL] missing_source_rows={len(missing_dates)} dates={missing_dates[:20]}")\n    return feat, events, bm\n'''
          s,n=re.subn(r'def build_features\(raw: pd\.DataFrame\) -> Tuple\[pd\.DataFrame, int, pd\.DataFrame\]:.*?(?=def build_inst_features)',features_new+'\n',s,flags=re.S)
          if n!=1: raise RuntimeError(f'build_features patch count={n}')

          inst_new='''def fetch_institutional(feat: pd.DataFrame, eval_start: int, eval_end: int) -> pd.DataFrame:\n    fp=ROOT / "market-data" / "data" / "history" / "2020-2025" / "institutional_2020_2025.parquet"\n    if not fp.exists():\n        raise RuntimeError(f"missing immutable institutional data: {fp}")\n    q=pd.read_parquet(fp).copy()\n    q["code"]=q.code.astype(str).str.strip().str.zfill(4)\n    q["date"]=pd.to_numeric(q.date,errors="coerce")\n    q=q.dropna(subset=["date","code"]).copy(); q["date"]=q.date.astype(int)\n    for c in ("foreign_net","trust_net","dealer_net"):\n        q[c]=pd.to_numeric(q[c],errors="coerce").fillna(0.0)\n    q=q.sort_values(["market","code","date"]).drop_duplicates(["market","code","date"],keep="last")\n    g=q.groupby(["market","code"],sort=False)\n    q["Foreign3D"]=g.foreign_net.transform(lambda x:x.rolling(3,min_periods=3).sum())\n    q["Foreign10D"]=g.foreign_net.transform(lambda x:x.rolling(10,min_periods=10).sum())\n    q["Trust5D"]=g.trust_net.transform(lambda x:x.rolling(5,min_periods=5).sum())\n    target=len([d for d in sorted(feat.date.unique()) if eval_start<=int(d)<=eval_end])\n    coverage=q[q.date.between(eval_start,eval_end)].date.nunique()\n    ratio=coverage/target if target else 0.0\n    log(f"[INST IMMUTABLE] coverage={coverage}/{target} ({ratio:.1%})")\n    if ratio<0.98:\n        raise RuntimeError(f"institutional coverage too low {ratio:.1%}")\n    return q\n'''
          s,n=re.subn(r'def fetch_institutional\(feat: pd\.DataFrame, eval_start: int, eval_end: int\) -> pd\.DataFrame:.*?(?=def dd_multiplier)',inst_new+'\n',s,flags=re.S)
          if n!=1: raise RuntimeError(f'fetch_institutional patch count={n}')
          p.write_text(s,encoding='utf-8')

      - name: Locked contract assertions
        shell: bash
        run: |
          grep -q 'INITIAL_CAPITAL = 1_300_000.0' scripts/backtest_r10_stress.py
          grep -q 'BUY_FEE = 0.000855' scripts/backtest_r10_stress.py
          grep -q 'SELL_FEE = 0.000855' scripts/backtest_r10_stress.py
          grep -q 'SELL_SLIPPAGE = 0.005' scripts/backtest_r10_stress.py
          grep -q 'MAX_POSITIONS = 5' scripts/backtest_r10_stress.py
          grep -q 'MAX_SINGLE = 0.25' scripts/backtest_r10_stress.py
          grep -q 'MAX_TOTAL = 0.95' scripts/backtest_r10_stress.py
          grep -q 'R7_BASE = 0.22' scripts/backtest_r10_stress.py
          grep -q 'R05_BASE = 0.20' scripts/backtest_r10_stress.py
          grep -q 'ADV_CAP = 0.02' scripts/backtest_r10_stress.py
          python -m py_compile scripts/backtest_r10_stress.py scripts/build_r10_scan.py

      - name: Diagnose R7 benchmark/breadth calendar
        shell: bash
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          from scripts import backtest_r10_stress as bt
          cfg=bt.SCENARIOS['validation2021_2025']
          raw=bt.load_scenario_ohlcv(cfg)
          feat,_,bm=bt.build_features(raw)
          lo,hi=bt.intdate(cfg['eval_start']),bt.intdate(cfg['eval_end'])
          eval_dates=sorted(int(x) for x in feat.date.unique() if lo<=int(x)<=hi)
          bm_dates=set(int(x) for x in bm.date.unique())
          missing_bm=[d for d in eval_dates if d not in bm_dates]
          missing_breadth=[]
          for d in eval_dates:
              x=feat[feat.date==d]
              e=x[(x.amt20>=30_000_000)&x.aclose.notna()]
              if e.empty: missing_breadth.append(d)
          print(f'[R7 CALENDAR] eval_dates={len(eval_dates)} bm_dates={len(bm_dates)}')
          print(f'[R7 CALENDAR] missing_benchmark_count={len(missing_bm)} first={missing_bm[:20]}')
          print(f'[R7 CALENDAR] missing_breadth_count={len(missing_breadth)} first={missing_breadth[:20]}')
          if missing_bm or missing_breadth:
              raise RuntimeError('R7 calendar still incomplete after formal 0050 past-only fill')
          PY

      - name: Full daily recalculation 2021-2025
        run: python scripts/backtest_r10_stress.py --scenario validation2021_2025

      - name: Verify result exists
        run: |
          test -s stress_results/latest/validation2021_2025/summary.json
          cat stress_results/latest/validation2021_2025/summary.json

      - name: Upload full evidence
        uses: actions/upload-artifact@v4
        with:
          name: r10-full-recalc-2021-2025
          path: |
            stress_results/latest/validation2021_2025/summary.json
            stress_results/latest/validation2021_2025/daily_nav.csv
            stress_results/latest/validation2021_2025/trades.csv
            stress_results/latest/validation2021_2025/orders.csv
            stress_results/latest/validation2021_2025/risk_events.csv
          retention-days: 30
