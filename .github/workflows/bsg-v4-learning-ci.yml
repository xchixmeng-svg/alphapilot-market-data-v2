name: Validate BSG V4 learning foundation

on:
  push:
    branches: [bsg-learning-system-20261019]
    paths:
      - 'apps/become-stock-god-v2/**'
      - '.github/workflows/bsg-v4-learning-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/become-stock-god-v2/package.json
      - name: Install
        working-directory: apps/become-stock-god-v2
        run: npm install
      - name: Build complete product
        working-directory: apps/become-stock-god-v2
        run: npm run build:web
      - name: Syntax check
        working-directory: apps/become-stock-god-v2
        run: |
          node --check src/engine.js
          node --check src/content.js
          node --check src/chart.js
          node --check src/app.js
      - name: V4 learning contract audit
        working-directory: apps/become-stock-god-v2
        run: npm run audit:learning
      - name: Verify standalone output
        working-directory: apps/become-stock-god-v2
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const html=fs.readFileSync('dist/index.html','utf8')
          for(const s of ['learning-foundation-v2','OHLC 看圖順序｜','看實體｜','看顏色｜','看影線｜','分兩件事｜','從單根進到一段｜','priceGuides','從菜雞到股神']) if(!html.includes(s)) throw new Error('missing built marker '+s)
          if(Buffer.byteLength(html)<5*1024*1024) throw new Error('standalone html unexpectedly small')
          console.log('V4_BUILD_OK', {bytes:Buffer.byteLength(html)})
          NODE
      - name: Browser verify beginner M01-M06 teaching and no-leak practice
        working-directory: apps/become-stock-god-v2
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 -d dist >/tmp/bsg-v4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'NODE'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const errs=[]; page.on('pageerror',e=>errs.push(String(e))); page.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'load',timeout:30000});
            await page.waitForSelector('.hudstats',{timeout:15000});
            const enter=page.locator('[data-ui="enter"]'); if(await enter.count()){await enter.click();await page.waitForSelector('#ckLanding',{state:'detached',timeout:5000}).catch(()=>{});}
            const hook=await page.evaluate(()=>({v4:window.BSG_V4_FOUNDATION&&window.BSG_V4_FOUNDATION.version,v3:window.BSG_V3_VISUALS&&window.BSG_V3_VISUALS.version}));
            if(hook.v4!=='learning-foundation-v2')throw new Error('V4 foundation missing '+JSON.stringify(hook));

            const contract=await page.evaluate(()=>{
              const t=window.BSGV3._test, rows=[];
              for(let mid=1;mid<=6;mid++){
                const exRows=[];
                for(let ex=1;ex<=3;ex++){
                  t.setupMission(mid,ex,'mission');
                  const mm=t.ui.mission,R=t.getR(t.ui.roundId),q=t.question(mm,R,ex),qt=t.qtext(mm,R,ex);
                  if(!t.suitable(mid,R))throw new Error('M0'+mid+' ex'+ex+' unsuitable sample');
                  if(!q||!Array.isArray(q.opts)||q.opts.length<3||new Set(q.opts.map(String)).size!==q.opts.length)throw new Error('M0'+mid+' invalid question '+ex);
                  if(typeof qt!=='string'||!qt.trim())throw new Error('M0'+mid+' empty qtext '+ex);
                  exRows.push({ex,q:qt,opts:q.opts.length});
                }
                t.setupMission(mid,0,'mission');
                const mm=t.ui.mission,R=t.getR(t.ui.roundId),base=t.chartData(mm,R),v3=window.BSG_V3_VISUALS.transform(base,mid),teach=window.BSG_V4_FOUNDATION.transform(v3);
                if(teach.allowCross!==false)throw new Error('M0'+mid+' demo allows OHLC tap reveal');
                t.setupMission(mid,1,'mission');
                const qm=t.ui.mission,QR=t.getR(t.ui.roundId),qb=t.chartData(qm,QR),qv3=window.BSG_V3_VISUALS.transform(qb,mid),quiz=window.BSG_V4_FOUNDATION.transform(qv3);
                if(quiz.allowCross!==false)throw new Error('M0'+mid+' quiz allows OHLC tap reveal');
                rows.push({mid,exRows,teachLabels:(teach.markers||[]).map(x=>x.label),quizLabels:(quiz.markers||[]).map(x=>x.label),teachGuides:(teach.priceGuides||[]).length,quizGuides:(quiz.priceGuides||[]).length,closePath:quiz.closePath||teach.closePath||null});
              }
              return rows;
            });
            const by=id=>contract.find(x=>x.mid===id);
            for(const s of ['最高價','開盤價','收盤價','最低價'])if(!by(1).teachLabels.includes(s))throw new Error('M01 teaching label missing '+s);
            if(by(1).quizLabels.length!==0||by(1).quizGuides!==4)throw new Error('M01 quiz leak '+JSON.stringify(by(1)));
            if(!by(2).teachLabels.includes('開盤')||!by(2).teachLabels.includes('收盤')||by(2).quizLabels.length!==0||by(2).quizGuides<3)throw new Error('M02 contract '+JSON.stringify(by(2)));
            if(!by(3).teachLabels.includes('開盤')||!by(3).teachLabels.includes('收盤')||by(3).quizLabels.length!==0)throw new Error('M03 contract '+JSON.stringify(by(3)));
            for(const s of ['最高價','實體上緣','實體下緣','最低價'])if(!by(4).teachLabels.includes(s))throw new Error('M04 teaching label missing '+s);
            if(by(4).quizLabels.length!==0||by(4).quizGuides<3)throw new Error('M04 quiz leak '+JSON.stringify(by(4)));
            for(const s of ['昨收','今開','今收'])if(!by(5).teachLabels.includes(s)||!by(5).quizLabels.includes(s))throw new Error('M05 evidence missing '+s);
            if(!by(6).closePath||by(6).closePath.length!==2)throw new Error('M06 close path missing '+JSON.stringify(by(6)));

            const m1=page.locator('[data-act="mission"][data-id="1"]').first();
            if(!(await m1.count()))throw new Error('M01 entry missing');
            await m1.click(); await page.waitForSelector('#v3Chart canvas',{timeout:10000}); await page.waitForTimeout(250);
            const teachText=(await page.locator('.prompt').innerText());
            if(!teachText.includes('OHLC 看圖順序')||!teachText.includes('先學會這件事'))throw new Error('M01 teaching copy missing '+teachText);
            fs.mkdirSync('audit',{recursive:true}); await page.screenshot({path:'audit/m01-teaching.png',fullPage:true});
            await page.locator('[data-act="beginQuestions"]').click(); await page.waitForSelector('.answer',{timeout:5000}); await page.waitForTimeout(250);
            const quiz=await page.evaluate(()=>({q:document.querySelector('.question').innerText,answers:[...document.querySelectorAll('.answer')].map(x=>x.innerText),badges:(document.querySelector('#v3Chart').__bsgLayout||{}).badges||[]}));
            if(!quiz.q.includes('哪四種價格')||quiz.badges.length<4)throw new Error('M01 rendered quiz contract failed '+JSON.stringify(quiz));
            await page.screenshot({path:'audit/m01-practice.png',fullPage:true});
            if(errs.length)throw new Error('browser errors: '+errs.join(' | '));
            fs.writeFileSync('audit/beginner_module.json',JSON.stringify({ok:true,contract},null,2));
            console.log('BEGINNER_BROWSER_OK',contract);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bsg-v4-learning-foundation
          path: |
            apps/become-stock-god-v2/dist/index.html
            apps/become-stock-god-v2/audit/learning_contract.json
            apps/become-stock-god-v2/audit/beginner_module.json
            apps/become-stock-god-v2/audit/m01-teaching.png
            apps/become-stock-god-v2/audit/m01-practice.png
          retention-days: 7
