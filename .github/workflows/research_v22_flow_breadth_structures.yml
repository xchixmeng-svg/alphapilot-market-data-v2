name: V22 12 causal flow-breadth structures

on:
  workflow_dispatch:
  push:
    branches: [research-stock-repricing-v22-20260914]
    paths:
      - '.github/workflows/research_v22_flow_breadth_structures.yml'
      - 'scripts/research_v22_flow_breadth_structures.py'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Verify frozen history inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Verify immutable formal fingerprints
        run: |
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          echo "8aaca46ae7c6d2f0b4e1479878352901ffe90a8acaed122d3d2640c70ea817cc  data/reference/official_corporate_actions_2020_2025.csv" | sha256sum --check -
      - name: Reproduce locked R10 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf formal_run && mkdir formal_run
          for f in "$GITHUB_WORKSPACE"/data/history/2020-2025/*.parquet; do ln -s "$f" "$GITHUB_WORKSPACE/formal_run/$(basename "$f")"; done
          ln -s "$GITHUB_WORKSPACE/data/reference/official_corporate_actions_2020_2025.csv" "$GITHUB_WORKSPACE/formal_run/official_corporate_actions_2020_2025.csv"
          cd formal_run
          python ../scripts/r10_max_formal.py > execution.log
          cd ..
          python - <<'PY'
          import json
          a=json.load(open('formal_run/contract_audit.json')); s=json.load(open('formal_run/r10max_formal_summary.json'))['strategy']
          assert a['all_pass'],a
          assert abs(s['end_nav']-2403427.0678222505)<1e-7,s
          assert s['completed_trades']==150 and s['wins']==71 and s['losses']==79,s
          print('Formal R10 baseline unchanged')
          PY

  research:
    needs: guard
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        hypothesis:
          - persistent_sponsor_breakout
          - fresh_sponsor_turn
          - pullback_reaccel
          - calm_accumulation_release
          - residual_repricing_leader
          - broad_sponsorship_consensus
          - uncrowded_acceleration
          - lagged_sponsor_followthrough
          - price_leader_new_sponsor
          - dual_horizon_acceleration
          - two_stage_flow_price
          - adaptive_hold_high_conviction
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Verify frozen inputs and formal fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cd data/history/2020-2025 && sha256sum --check SHA256SUMS && cd ../../..
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          echo "8aaca46ae7c6d2f0b4e1479878352901ffe90a8acaed122d3d2640c70ea817cc  data/reference/official_corporate_actions_2020_2025.csv" | sha256sum --check -
      - name: Materialize causal formal inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf formal_run && mkdir formal_run
          for f in "$GITHUB_WORKSPACE"/data/history/2020-2025/*.parquet; do ln -s "$f" "$GITHUB_WORKSPACE/formal_run/$(basename "$f")"; done
          ln -s "$GITHUB_WORKSPACE/data/reference/official_corporate_actions_2020_2025.csv" "$GITHUB_WORKSPACE/formal_run/official_corporate_actions_2020_2025.csv"
          cd formal_run
          python ../scripts/r10_max_formal.py > execution.log
          test -s ohlcv_causal_2020_2025.csv.gz
          test -s institutional_2020_2025.parquet
          cd ..
      - name: Run structural hypothesis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_v22_flow_breadth_structures.py --hypothesis "${{ matrix.hypothesis }}" | tee "v22_${{ matrix.hypothesis }}.log"
      - name: Show audit
        if: always()
        run: test -f "v22_flow_breadth_out/${{ matrix.hypothesis }}/audit.json" && cat "v22_flow_breadth_out/${{ matrix.hypothesis }}/audit.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22-${{ matrix.hypothesis }}
          path: |
            v22_${{ matrix.hypothesis }}.log
            v22_flow_breadth_out/${{ matrix.hypothesis }}/
          if-no-files-found: warn
          retention-days: 30

