name: V6.2 Zero-Cost Local LLM Probe
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/v6_2_zero_cost_local_llm_probe.py'
      - '.github/workflows/v6_2_zero_cost_local_llm_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install transformers==4.57.1 safetensors==0.6.2
      - name: Run open-weight model locally
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python -u scripts/v6_2_zero_cost_local_llm_probe.py
      - name: Validate response through provider-neutral gate
        run: |
          python scripts/v6_2_reasoning_provider_gate.py             --evidence out/evidence.json             --numerical out/numerical.json             --response out/response.json             --out out/gate_audit.json
      - name: Record hashes
        run: sha256sum out/*.json | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-2-zero-cost-local-llm-probe
          path: out/
          if-no-files-found: error
          retention-days: 30
