name: Whale Radar

on:
  workflow_dispatch:
  schedule:
    # 15:20 Taiwan time, weekdays. GitHub schedule uses UTC.
    - cron: "20 7 * * 1-5"
  pull_request:
    paths:
      - "scripts/whale_radar_*.py"
      - "whale_radar/**"
      - ".github/workflows/whale_radar.yml"

permissions:
  contents: write

concurrency:
  group: whale-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax and deterministic self-tests
        run: |
          python -m py_compile scripts/whale_radar_collect.py scripts/whale_radar_guard.py scripts/whale_radar_rank.py scripts/whale_radar_actor_universe.py scripts/whale_radar_history_score.py scripts/whale_radar_backfill_sec43.py scripts/whale_radar_history_score_combined.py
          python scripts/whale_radar_collect.py --self-test
          python scripts/whale_radar_actor_universe.py --self-test
          python scripts/whale_radar_history_score.py --self-test
          python scripts/whale_radar_backfill_sec43.py --self-test
          python scripts/whale_radar_history_score_combined.py --self-test

      - name: Collect live public disclosures
        run: |
          python scripts/whale_radar_collect.py --allow-partial
          python scripts/whale_radar_guard.py
          python scripts/whale_radar_rank.py
          python scripts/whale_radar_actor_universe.py

      - name: Backfill historical Article 43-1 disclosures
        run: |
          # First research pass: 2024-present. The backfiller refuses to continue
          # unless it can retrieve the known 4194 / 隆欣投資 positive control.
          python scripts/whale_radar_backfill_sec43.py --start-year 113 --allow-partial --sleep 0.35

      - name: Build causal Person Alpha outputs
        run: |
          python scripts/whale_radar_history_score_combined.py

      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-radar-${{ github.run_id }}
          path: data/whale_radar/
          retention-days: 14

      - name: Persist data to repository
        if: github.event_name != 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add data/whale_radar/
          if git diff --cached --quiet; then
            echo "No Whale Radar data changes."
            exit 0
          fi
          git commit -m "data: update Whale Radar public disclosures"
          git push
