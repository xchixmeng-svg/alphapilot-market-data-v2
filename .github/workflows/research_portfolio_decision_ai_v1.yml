name: AlphaPilot Portfolio Decision AI V1

on:
  push:
    branches: [research-portfolio-decision-ai-v1-20260915]
    paths:
      - scripts/backtest_portfolio_decision_ai_v1.py
      - research/PORTFOLIO_DECISION_AI_V1_PREREGISTRATION.md
      - .github/workflows/research_portfolio_decision_ai_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 tabulate==0.9.0 scikit-learn==1.5.2
      - name: Verify immutable market inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Verify locked R10 engine fingerprint
        run: |
          echo '2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py' | sha256sum --check -
          test "$(git rev-parse refs/remotes/origin/r10-no-trail-formal-fix-20260907)" = '3728a0045ab77d65b1bd9c73fcbe942f6c0bc0d9'
      - name: Run Portfolio Decision AI V1
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/backtest_portfolio_decision_ai_v1.py | tee portfolio_decision_ai_v1_execution.log
      - name: Show evidence
        run: |
          cat portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_MODEL_DIAGNOSTICS.csv
          cat portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_ACTION_AUDIT.json
          cat portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_V1_COMPARISON.csv
          cat portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_V1_SUCCESS_GATE.json
      - name: Upload concise evidence
        uses: actions/upload-artifact@v4
        with:
          name: alphapilot-portfolio-decision-ai-v1-results
          path: |
            portfolio_decision_ai_v1_execution.log
            research/PORTFOLIO_DECISION_AI_V1_PREREGISTRATION.md
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_MODEL_DIAGNOSTICS.csv
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_DAILY_AUDIT.csv
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_ACTION_AUDIT.json
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_V1_COMPARISON.csv
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_V1_SUCCESS_GATE.json
            portfolio_decision_ai_v1_results/baseline/r10max_formal_summary.json
            portfolio_decision_ai_v1_results/baseline/contract_audit.json
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_V1/r10max_formal_summary.json
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_V1/contract_audit.json
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_V1/portfolio_ai_decisions.csv
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_V1/r10max_formal_trades.csv
            portfolio_decision_ai_v1_results/PORTFOLIO_DECISION_AI_V1/r10max_formal_orders.csv
          if-no-files-found: error
          retention-days: 30
# trigger
