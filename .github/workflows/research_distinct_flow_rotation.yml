name: Distinct causal flow-rotation strategy research

on:
  workflow_dispatch:
  push:
    branches: [research-distinct-flow-rotation-20260912]
    paths:
      - 'scripts/research_distinct_flow_rotation.py'
      - '.github/workflows/research_distinct_flow_rotation.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Verify frozen history inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Verify locked engine fingerprints
        run: |
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          echo "8aaca46ae7c6d2f0b4e1479878352901ffe90a8acaed122d3d2640c70ea817cc  data/reference/official_corporate_actions_2020_2025.csv" | sha256sum --check -
      - name: Build causal formal data layer only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf formal_run && mkdir formal_run
          for f in "$GITHUB_WORKSPACE"/data/history/2020-2025/*.parquet; do ln -s "$f" "$GITHUB_WORKSPACE/formal_run/$(basename "$f")"; done
          ln -s "$GITHUB_WORKSPACE/data/reference/official_corporate_actions_2020_2025.csv" "$GITHUB_WORKSPACE/formal_run/official_corporate_actions_2020_2025.csv"
          cd formal_run && python ../scripts/r10_max_formal.py | tee execution.log
      - name: Assert frozen baseline remains reproducible
        run: |
          python - <<'PY'
          import json
          a=json.load(open('formal_run/contract_audit.json')); s=json.load(open('formal_run/r10max_formal_summary.json'))['strategy']
          assert a['all_pass']
          assert abs(s['end_nav']-2403427.0678222505)<1e-7
          assert s['completed_trades']==150 and s['wins']==71 and s['losses']==79
          print('LOCKED_BASELINE_PASS')
          PY
      - name: Patch research data-universe guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/research_distinct_flow_rotation.py')
          s=p.read_text(encoding='utf-8')
          old="""valid=px.code.str.fullmatch(r'[1-9]\\d{3}') & ~px.name.astype(str).str.contains('KY',case=False,na=False) & (px.amt20>=30_000_000)\npx=px[valid].copy()\n# market regime: 0050 only, causal and simple\nm=px[px.code=='0050'][['date','aclose']].drop_duplicates('date').sort_values('date')\nm['ma60']=m.aclose.rolling(60,min_periods=60).mean();m['r20']=m.aclose.pct_change(20);m['r60']=m.aclose.pct_change(60)\nm['risk_on']=(m.aclose>m.ma60)&(m.r20>0)&(m.r60>0)\nreg=dict(zip(m.date,m.risk_on.fillna(False)))\n# cross-sectional ranks by date, all based on T-close information\n"""
          new="""# market regime must be built before filtering the stock universe because 0050 is not a 1-9-leading four-digit stock code.\nm=px[px.code=='0050'][['date','aclose']].drop_duplicates('date').sort_values('date')\nm['ma60']=m.aclose.rolling(60,min_periods=60).mean();m['r20']=m.aclose.pct_change(20);m['r60']=m.aclose.pct_change(60)\nm['risk_on']=(m.aclose>m.ma60)&(m.r20>0)&(m.r60>0)\nreg=dict(zip(m.date,m.risk_on.fillna(False)))\nvalid=px.code.str.fullmatch(r'[1-9]\\d{3}') & ~px.name.astype(str).str.contains('KY',case=False,na=False) & (px.amt20>=30_000_000)\npx=px[valid].copy()\n# cross-sectional ranks by date, all based on T-close information\n"""
          if old not in s:
              raise SystemExit('expected market-regime/universe block not found')
          s=s.replace(old,new,1)
          old2="t=pd.DataFrame(trades); nh=pd.DataFrame(nav_hist,columns=['date','nav'])"
          new2="t=pd.DataFrame(trades,columns=['family','code','entry_date','exit_date','entry_price','exit_price','shares','return_net']); nh=pd.DataFrame(nav_hist,columns=['date','nav'])"
          if old2 not in s:
              raise SystemExit('expected trade dataframe block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          print('PATCHED_MARKET_REGIME_AND_EMPTY_TRADE_GUARDS')
          PY
      - name: Run distinct strategy families
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_distinct_flow_rotation.py | tee distinct_flow_execution.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distinct-flow-rotation-research
          path: |
            distinct_flow_execution.log
            research_out_distinct_flow/
          if-no-files-found: warn
