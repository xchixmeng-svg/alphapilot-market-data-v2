name: V6 Source Freeze Evidence

on:
  push:
    branches: [research-ai-market-reasoning-v6-parallel-stage0-20260917]
    paths:
      - 'research/V6_SOURCE_FREEZE.json'
      - 'research/V6_PREREG_LOCK.json'
      - 'research/AI_MARKET_REASONING_FORECAST_V6_CPU_QUANTILE_PREREGISTRATION.md'
      - 'research/AI_MARKET_REASONING_FORECAST_V6_VALIDATION_PROTOCOL.md'
      - 'research/V6_CPU_QUANTILE_HYPOTHESIS_REGISTRY.json'
      - 'research/V6_STAGE0_LAYER_CONTRACT.json'
      - 'scripts/backtest_ai_market_reasoning_v6_cpu_quantile.py'
      - 'scripts/verify_v6_prereg_lock.py'
      - '.github/workflows/research_ai_market_reasoning_v6_formal_stage_a.yml'
      - '.github/workflows/research_ai_market_reasoning_v6_source_freeze.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source_freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scipy==1.18.1 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Download exact Stage0F artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10537510796/zip > /tmp/v6-0f.zip
          mkdir -p /tmp/v6-0f
          unzip -q /tmp/v6-0f.zip -d /tmp/v6-0f
      - name: Verify frozen data container and panel
        run: |
          set -euo pipefail
          sha256sum /tmp/v6-0f.zip || true
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/v6-0f')
          sf=json.loads(Path('research/V6_SOURCE_FREEZE.json').read_text())
          # actions/upload-artifact stores files relative to the least common
          # ancestor (data/history/v6-layered), so the downloaded archive
          # starts at 0F_FINAL_ASSEMBLY/, manifests/, progress/.
          p=root/'0F_FINAL_ASSEMBLY/decision_ticker_panel.parquet'
          m=root/'manifests/0F_FINAL_ASSEMBLY.json'
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          mm=json.loads(m.read_text())
          assert h==sf['stage0_final']['decision_ticker_panel_sha256']
          assert h==mm['file_sha256']['decision_ticker_panel.parquet']
          assert mm['status']=='FROZEN_PASS'
          print('STAGE0F_CONTAINER_PASS',h)
          for layer in ['0A_MARKET','0B_INDUSTRY','0C_COMPANY','0D_MACRO','0E_EVENT_TIME','0F_FINAL_ASSEMBLY']:
              q=root/f'manifests/{layer}.json'
              print('LAYER_MANIFEST_SHA256',layer,hashlib.sha256(q.read_bytes()).hexdigest())
          PY
      - name: Verify machine preregistration lock when present
        run: |
          if [ -f research/V6_PREREG_LOCK.json ]; then
            python scripts/verify_v6_prereg_lock.py
          else
            echo "V6_PREREG_LOCK.json not created yet; source-freeze evidence only"
          fi
      - name: Print locked research-file SHA256
        run: |
          sha256sum             research/V6_SOURCE_FREEZE.json             research/AI_MARKET_REASONING_FORECAST_V6_CPU_QUANTILE_PREREGISTRATION.md             research/AI_MARKET_REASONING_FORECAST_V6_VALIDATION_PROTOCOL.md             research/V6_CPU_QUANTILE_HYPOTHESIS_REGISTRY.json             research/V6_STAGE0_LAYER_CONTRACT.json             scripts/backtest_ai_market_reasoning_v6_cpu_quantile.py             scripts/verify_v6_prereg_lock.py             .github/workflows/research_ai_market_reasoning_v6_formal_stage_a.yml             .github/workflows/research_ai_market_reasoning_v6_source_freeze.yml
          git rev-parse HEAD
