name: V6 Stage A Actionability Audit

on:
  push:
    branches: [research-ai-market-reasoning-v6-parallel-stage0-20260917]
    paths:
      - 'scripts/audit_v6_stage_a_actionability.py'
      - '.github/workflows/research_ai_market_reasoning_v6_actionability.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actionability:
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scipy==1.18.1 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Download exact frozen Stage0F artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10537510796/zip > /tmp/v6-0f.zip
          mkdir -p /tmp/v6-0f
          unzip -q /tmp/v6-0f.zip -d /tmp/v6-0f
          mkdir -p data/history/v6-layered
          cp -a /tmp/v6-0f/. data/history/v6-layered/
      - name: Restore locked workflow file in runner only
        run: |
          git checkout c38e288e30317a34c69f8ce86319976759ba45ad -- .github/workflows/research_ai_market_reasoning_v6_formal_stage_a.yml
      - name: Verify locked scientific state
        run: python scripts/verify_v6_prereg_lock.py
      - name: Run human-readable actionability audit
        run: python -u scripts/audit_v6_stage_a_actionability.py --year ${{ matrix.year }}
      - name: Upload actionability evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-actionability-${{ matrix.year }}
          path: |
            ai_market_reasoning_v6_actionability/V6_ACTIONABILITY_${{ matrix.year }}_TOP5_DETAIL.csv
            ai_market_reasoning_v6_actionability/V6_ACTIONABILITY_${{ matrix.year }}_SUMMARY.csv
            ai_market_reasoning_v6_actionability/V6_ACTIONABILITY_${{ matrix.year }}_META.json
          if-no-files-found: error
          retention-days: 90
