name: V6.2 Numerical Decision Panel Repair Aggregate
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - '.github/workflows/v6_2_numerical_decision_panel_repair.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '35425042469'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Download only successful source-run artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p all_inputs matrix_inputs launch_inputs
          gh run download "${SOURCE_RUN_ID}" -D all_inputs

          # Profit artifacts live under v6-2-full-score-* directories.
          find all_inputs -type f -path '*/v6-2-full-score-*/*_FULL_2024_SCORES.parquet' -exec cp {} matrix_inputs/ \;

          # Launch artifact is kept separate.
          find all_inputs -type f -path '*/v6-2-launch-full-scores/*' -name 'V6_2_LAUNCH_CONDITIONAL_FULL_2024_SCORES.parquet' -exec cp {} launch_inputs/ \;

          echo "profit_files=$(find matrix_inputs -name '*_FULL_2024_SCORES.parquet' | wc -l)"
          echo "launch_files=$(find launch_inputs -name '*.parquet' | wc -l)"
          test "$(find matrix_inputs -name '*_FULL_2024_SCORES.parquet' | wc -l)" -eq 20
          test "$(find launch_inputs -name '*.parquet' | wc -l)" -eq 1
      - name: Build numerical decision panel and audit consistency
        run: python -u scripts/build_v6_2_numerical_decision_panel.py
      - uses: actions/upload-artifact@v4
        with:
          name: v6-2-numerical-decision-panel-2024-repaired
          path: v6_2_numerical_decision_panel/
          if-no-files-found: error
          retention-days: 90
