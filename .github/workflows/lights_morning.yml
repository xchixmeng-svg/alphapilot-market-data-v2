name: Morning lights (夜盤＋美股，早上推播)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [lights-morning]   # 11/24：Cloudflare Worker 準時叫醒（GitHub 排程常延遲）
  push:
    paths: [".github/workflows/lights_morning.yml"]   # 11/24：GitHub 排程大延遲時，改這個檔就能手動補跑
  schedule:
    # 11/22：提早準備，07:00 由 Cloudflare 早報準時一起推。美股 VIX 收盤＝台北 05:15（冬令）／04:15（夏令），
    # 04:20 起每 30 分鐘跑一次；VIX 還沒有昨晚收盤就先不寫，等下一次（06:45 以後不再等，有什麼用什麼）。
    - cron: "20 20 * * 0-4"   # 04:20 台北
    - cron: "50 20 * * 0-4"   # 04:50
    - cron: "20 21 * * 0-4"   # 05:20
    - cron: "50 21 * * 0-4"   # 05:50
    - cron: "20 22 * * 0-4"   # 06:20
    - cron: "50 22 * * 0-4"   # 06:50

permissions:
  contents: write

concurrency:
  group: lights
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5 pandas==2.2.3
      - name: Refresh macro
        continue-on-error: true
        run: python scripts/fetch_macro.py
      - name: Morning text
        run: python scripts/lights_morning.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/extra/lights data/extra/macro
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "data: morning lights $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
