name: R10 MAX regime-conditioned policy research

on:
  workflow_dispatch:
  push:
    branches:
      - research-entry-invalidation-20260911
    paths:
      - scripts/research_regime_policy_portfolio.py
      - .github/workflows/research_regime_policy_portfolio.yml

jobs:
  regime-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 tabulate==0.9.0

      - name: Verify frozen parent inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS

      - name: Verify locked R10 engine fingerprint
        run: |
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          echo "8aaca46ae7c6d2f0b4e1479878352901ffe90a8acaed122d3d2640c70ea817cc  data/reference/official_corporate_actions_2020_2025.csv" | sha256sum --check -

      - name: Reproduce locked formal run once
        shell: bash
        run: |
          set -euo pipefail
          mkdir formal_run
          for f in "$GITHUB_WORKSPACE"/data/history/2020-2025/*.parquet; do
            ln -s "$f" "$GITHUB_WORKSPACE/formal_run/$(basename "$f")"
          done
          ln -s "$GITHUB_WORKSPACE/data/reference/official_corporate_actions_2020_2025.csv" "$GITHUB_WORKSPACE/formal_run/official_corporate_actions_2020_2025.csv"
          cd formal_run
          python ../scripts/r10_max_formal.py | tee execution.log

      - name: Assert frozen baseline unchanged
        run: |
          python - <<'PY'
          import json
          a=json.load(open('formal_run/contract_audit.json'))
          s=json.load(open('formal_run/r10max_formal_summary.json'))['strategy']
          assert a['all_pass'], a
          assert abs(s['end_nav']-2403427.0678222505)<1e-7, s
          assert s['completed_trades']==150, s
          assert s['wins']==71 and s['losses']==79, s
          assert abs(s['max_drawdown']-(-0.19515438907459803))<1e-12, s
          print('LOCKED_BASELINE_PASS')
          PY

      - name: Patch research runner guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/research_regime_policy_portfolio.py')
          s=p.read_text(encoding='utf-8')
          old='sim = "import os, json\\nimport pandas as pd\\nimport numpy as np\\n\\n" + src[pos:]'
          new='sim = "import os, json\\nfrom pathlib import Path\\nimport pandas as pd\\nimport numpy as np\\n\\n" + src[pos:]'
          if old in s:
              s=s.replace(old,new,1)
          old2='    # Locked Bear/Fallback already carries zero R7 exposure and normally no candidates,\n    # but research explicitly blocks to make the policy auditable.\n    if regime in ("Bear", "Fallback/Bear", "Unknown"):\n        return 0.0, 1.0, True, f"{mode}:{regime}:BLOCK"\n\n    if mode == "control":\n        pass\n'
          new2='    # Control must be a byte-for-byte behavioral no-op relative to frozen Step-3.\n    # Do not impose any extra blocking, sizing, or price changes in control.\n    if mode == "control":\n        return 1.0, 1.0, False, f"{mode}:{regime}:{strat}"\n\n    # Research variants may explicitly block Bear/Fallback/Unknown.\n    if regime in ("Bear", "Fallback/Bear", "Unknown"):\n        return 0.0, 1.0, True, f"{mode}:{regime}:BLOCK"\n'
          if old2 not in s:
              raise SystemExit('expected control/bear block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s, encoding='utf-8')
          print('PATCHED_RESEARCH_GUARDS')
          PY

      - name: Run regime-conditioned policy variants
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_regime_policy_portfolio.py | tee regime_policy_execution.log

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## R10 MAX regime-conditioned policy research"
            echo
            echo "- Frozen formal regime classifier; no classifier refit."
            echo "- All policy decisions are made at signal-day close."
            echo "- No T+1 10/15 minute waiting."
            echo "- Development comparison: 2021-2023; validation comparison: 2024-2025."
            echo "- Locked formal branch remains unchanged."
            if [ -f research_out_regime_policy/regime_policy_summary.csv ]; then
              echo "### Results"
              python - <<'PY'
          import pandas as pd
          d=pd.read_csv('research_out_regime_policy/regime_policy_summary.csv')
          cols=['policy','end_nav','cagr','max_drawdown','profit_factor','dev_2021_2023_return','val_2024_2025_return','val_2024_2025_dd','tail_loss_le_15pct','research_pass']
          print(d[cols].to_markdown(index=False))
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r10-regime-policy-research
          path: |
            regime_policy_execution.log
            research_out_regime_policy/regime_policy_summary.csv
            research_out_regime_policy/regime_policy_annual.csv
            research_out_regime_policy/regime_policy_trade_by_regime.csv
            research_out_regime_policy/regime_policy_decision.json
            research_out_regime_policy/*/r10max_formal_summary.json
            research_out_regime_policy/*/contract_audit.json
            research_out_regime_policy/*/r10max_formal_nav.csv
            research_out_regime_policy/*/r10max_formal_trades.csv
            research_out_regime_policy/*/r10max_formal_orders.csv
          if-no-files-found: warn
