name: V6.2 LLM Contract Semantics
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'research/V6_2_LLM_REASONING_SCHEMA.json'
      - 'scripts/test_v6_2_llm_contract.py'
      - '.github/workflows/research_ai_market_reasoning_v6_2_llm_contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Test V6.2 LLM decision contract
        run: python -u scripts/test_v6_2_llm_contract.py
