name: TWD 16:00 close (CBC)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [twd-now]   # 11/24：Cloudflare Worker 準時叫醒（GitHub 排程常延遲）
  push:
    paths: [".github/workflows/fetch_twd_tpe.yml", "scripts/fetch_twd_tpe.py"]
  schedule:
    - cron: "30 9 * * 1-5"   # 17:30 台北

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - name: Run
        continue-on-error: true
        run: python -u scripts/fetch_twd_tpe.py
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/extra/macro/TWD_TPE.csv data/extra/macro/TWD_TPE.raw 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "data: TWD 16:00 close (CBC)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
