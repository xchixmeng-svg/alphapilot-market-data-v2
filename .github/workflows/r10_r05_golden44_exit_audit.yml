name: R10 R05 Golden44 Exit Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_r05_golden44_exit_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas requests
      - name: Audit all 44 Golden R0.5 exits
        run: |
          python - <<'PY'
          import io, zipfile, requests, pandas as pd
          from io import StringIO
          cases_csv='''code,signal_date,entry_date,exit_date,entry_price,holding_days
          1802,20210104,20210105,20210107,21.3,2
          8215,20210105,20210106,20210111,30.5,3
          2426,20210104,20210105,20210413,17.9,60
          6235,20210107,20210108,20210416,20.6,60
          2886,20210111,20210112,20210420,29.85,60
          1319,20210419,20210420,20210504,39.8,9
          2889,20210507,20210510,20210512,17.9,2
          2884,20210415,20210416,20210713,26.75,60
          2030,20210412,20210413,20210720,16.0,68
          6160,20210713,20210714,20210720,24.9,4
          2344,20210805,20210806,20210811,35.2,3
          8064,20210601,20210602,20210826,18.25,60
          2880,20210830,20210831,20211126,20.55,60
          2801,20210830,20210831,20211126,16.55,60
          2371,20210830,20210831,20211126,30.1,60
          5880,20211206,20211207,20220314,24.05,60
          2884,20221129,20221130,20230309,24.35,60
          2892,20221129,20221130,20230309,26.05,60
          2890,20221129,20221130,20230309,17.65,60
          2885,20230519,20230522,20230818,23.3,61
          8150,20230807,20230808,20231103,37.15,60
          2607,20231113,20231114,20231116,33.1,2
          3059,20231120,20231121,20240109,39.05,34
          6163,20240110,20240111,20240126,21.55,11
          2355,20231114,20231115,20240219,38.8,60
          2344,20231115,20231116,20240220,28.45,60
          6179,20240131,20240201,20240506,34.55,56
          1815,20240219,20240220,20240520,17.1,60
          2884,20240520,20240521,20240730,29.25,47
          2880,20240507,20240508,20240805,25.4,60
          2605,20240927,20240930,20241011,29.95,6
          3354,20241021,20241022,20241025,32.9,3
          1402,20240926,20240927,20241128,38.0,40
          2885,20241018,20241021,20250115,33.3,60
          9904,20241028,20241029,20250203,38.1,60
          8096,20250121,20250122,20250303,39.0,20
          2888,20250122,20250203,20250408,12.2,43
          2890,20250609,20250610,20250909,23.95,65
          2337,20250911,20250912,20251031,22.15,31
          1104,20250910,20250911,20251210,31.8,60
          6005,20250910,20250911,20251210,23.55,60
          6163,20251103,20251104,20251231,25.75,40
          2367,20251209,20251210,20251231,27.15,14
          4927,20251209,20251210,20251231,25.15,14'''
          cases=pd.read_csv(StringIO('\n'.join(x.strip() for x in cases_csv.splitlines())))
          frames=[]
          for y in range(2021,2026):
              url=f'https://github.com/yukishirotsubasa/tw-stock-data-release/releases/download/daily-close-csv/yearly_{y}.zip'
              b=requests.get(url,timeout=180).content
              with zipfile.ZipFile(io.BytesIO(b)) as z:
                  n=[x for x in z.namelist() if x.lower().endswith('.csv')][0]
                  q=pd.read_csv(z.open(n),dtype={'code':str})
                  frames.append(q[['date','code','open','high','low','close']])
          q=pd.concat(frames,ignore_index=True)
          q['code']=q.code.astype(str).str.replace(r'\.0$','',regex=True).str.zfill(4)
          q['date']=pd.to_numeric(q.date,errors='coerce').astype('Int64')
          dates=sorted(int(x) for x in q.date.dropna().unique())
          prev={dates[i]:dates[i-1] for i in range(1,len(dates))}
          exact=0; early=0; late=0; no_breach=0; non_time=[]
          for r in cases.itertuples(index=False):
              code=str(r.code).zfill(4); signal=int(r.signal_date); entry=int(r.entry_date); exitd=int(r.exit_date)
              expected_dec=prev.get(exitd)
              s=q[(q.code==code)&(q.date==signal)]
              if s.empty:
                  print('MISSING_SIGNAL',code,signal); continue
              sig_low=float(s.iloc[-1].low)
              path=q[(q.code==code)&(q.date>entry)&(q.date<=expected_dec)].sort_values('date')
              hit=path[path.low.astype(float)<=sig_low+1e-12]
              first=int(hit.iloc[0].date) if not hit.empty else None
              status='NO_BREACH'
              if first is None: no_breach+=1
              elif first==expected_dec: exact+=1; status='EXACT'
              elif first<expected_dec: early+=1; status='EARLIER'
              else: late+=1; status='LATER'
              # Non-time-ish exits are the key sample; 60/61-day records may be time exits.
              if int(r.holding_days) < 60:
                  non_time.append((code,int(r.holding_days),expected_dec,first,status,sig_low))
              print('CASE',code,'hold',int(r.holding_days),'expected_dec',expected_dec,'sig_low',sig_low,'first_breach',first,status)
          print('SUMMARY all44 exact',exact,'earlier',early,'later',late,'no_breach',no_breach)
          ne=sum(x[4]=='EXACT' for x in non_time); nn=len(non_time)
          print('SUMMARY non_time exact',ne,'/',nn)
          for x in non_time: print('NON_TIME',x)
          PY
