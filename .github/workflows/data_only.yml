name: Taiwan Market Data Only

on:
  workflow_dispatch:
  repository_dispatch:
    types: [fetch-now]   # Cloudflare Worker 17:30 / 18:00 準時叫醒（排程常常延遲）
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_today.py'
      - 'scripts/fetch_today_runner.py'
      - 'scripts/fetch_snapshots.py'
      - 'scripts/apfetch/**'
      - '.github/workflows/data_only.yml'
  schedule:
    # Asia/Taipei (UTC+8).
    # Avoid GitHub Actions' busiest :00 window and give the downloader two evening chances.
    - cron: "17 12 * * 1-5"  # 20:17 Taipei, weekdays
    - cron: "47 12 * * 1-5"  # 20:47 Taipei, weekdays
    - cron: "17 15 * * 1-5"  # 23:17 Taipei, delayed-source recovery
    # Next-morning recovery run. If the prior evening schedule was delayed/dropped,
    # official market snapshots should still point to the prior completed trade day.
    - cron: "17 1 * * *"     # 09:17 Taipei, daily catch-up

permissions:
  contents: write

concurrency:
  group: taiwan-market-data-only
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependency
        run: pip install requests==2.32.5 pandas==2.2.3 lxml==5.3.0

      - name: Syntax check downloader
        run: python -m py_compile scripts/fetch_today.py scripts/fetch_today_runner.py

      - name: Fetch and normalize Taiwan market data only
        run: python scripts/fetch_today_runner.py

      - name: Daily snapshots (events / valuation / revenue / shares / ex-rights / industry / TDCC)
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/fetch_snapshots.py

      - name: Commit downloaded data only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git add -f data/extra 2>/dev/null || true
          TRADE_DATE="$(find data -mindepth 2 -maxdepth 2 -name manifest.json | sed 's#^data/##;s#/manifest.json$##' | sort | tail -1)"
          test -n "$TRADE_DATE"
          if git diff --cached --quiet; then
            echo "No new market data to commit; latest snapshot=${TRADE_DATE}."
            exit 0
          fi
          git commit -m "data: Taiwan market data ${TRADE_DATE}"
          # 其他工作（例如歷史補抓）可能同時推送，失敗就先合併最新再推，最多 5 次
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
