name: One-time history backfill (TWSE margin + institutional amounts 2008+)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_credit.py'
      - '.github/workflows/backfill_credit.yml'

permissions:
  contents: write

concurrency:
  group: credit-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        years: ["2008 2011", "2012 2015", "2016 2019", "2020 2023", "2024 2026"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5 pandas==2.2.3 pyarrow==18.1.0
      - name: Run
        continue-on-error: true
        run: python scripts/backfill_credit.py ${{ matrix.years }}
      - name: Commit results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/history/credit 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "data: credit/institutional backfill (${{ matrix.years }})"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
