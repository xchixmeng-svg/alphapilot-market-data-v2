name: Research strategy versus 0050

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/research_beat_0050.py'
      - '.github/workflows/research_beat_0050.yml'

concurrency:
  group: research-beat-0050
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow
      - run: python scripts/research_beat_0050.py
      - uses: actions/upload-artifact@v4
        with:
          name: beat-0050-research
          path: artifacts/beat_0050/
          if-no-files-found: error
