name: V6.2 Evidence Family Gap Audit
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/audit_v6_2_evidence_gap.py'
      - '.github/workflows/research_ai_market_reasoning_v6_2_evidence_gap_audit.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_ARTIFACT: '10570080749'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Download exact admitted Evidence Bundle v1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/evidence
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT}/zip" > /tmp/evidence.zip
          unzip -oq /tmp/evidence.zip -d inputs/evidence
          find inputs/evidence -type f -printf '%p %s bytes\n' | sort
      - name: Audit evidence families without sealed data
        run: python -u scripts/audit_v6_2_evidence_gap.py
      - name: Upload auditable gap manifest
        uses: actions/upload-artifact@v4
        with:
          name: v6-2-evidence-family-gap-audit
          path: v6_2_evidence_gap_audit/
          if-no-files-found: error
          retention-days: 90
