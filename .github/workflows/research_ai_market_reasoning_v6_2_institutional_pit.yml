name: V6.2 Institutional PIT Build
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/build_v6_2_institutional_pit.py'
      - 'scripts/fetch_today.py'
      - '.github/workflows/research_ai_market_reasoning_v6_2_institutional_pit.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  twse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Build TWSE next-session PIT layer
        run: python -u scripts/build_v6_2_institutional_pit.py twse
      - name: Upload TWSE layer
        uses: actions/upload-artifact@v4
        with:
          name: v6-2-institutional-pit-twse
          path: v6_2_institutional_pit/
          if-no-files-found: error
          retention-days: 90

  tpex_rebuild:
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Rebuild TPEx official institutional history
        run: python -u scripts/build_v6_2_institutional_pit.py tpex-year --year "${{ matrix.year }}"
      - name: Upload TPEx year checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v6-2-tpex-rebuild-${{ matrix.year }}
          path: |
            v6_2_institutional_pit/tpex_rebuild_${{ matrix.year }}.parquet
            v6_2_institutional_pit/TPEX_REBUILD_${{ matrix.year }}_AUDIT.json
            v6_2_institutional_pit/tpex_rebuild_${{ matrix.year }}_errors.json
          if-no-files-found: error
          retention-days: 90

  tpex_assemble:
    needs: [tpex_rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Download yearly TPEx checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: v6-2-tpex-rebuild-*
          path: v6_2_institutional_pit/
          merge-multiple: true
      - name: Assemble TPEx next-session PIT layer
        run: python -u scripts/build_v6_2_institutional_pit.py tpex-assemble
      - name: Upload assembled TPEx PIT layer
        uses: actions/upload-artifact@v4
        with:
          name: v6-2-institutional-pit-tpex
          path: v6_2_institutional_pit/
          if-no-files-found: error
          retention-days: 90
