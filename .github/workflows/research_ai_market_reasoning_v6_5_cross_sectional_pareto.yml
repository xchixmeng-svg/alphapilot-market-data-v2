name: V6.5 Cross-Sectional Pareto Development
on:
  push:
    branches: [research-ai-market-reasoning-v6-5-cross-sectional-pareto-20260918]
    paths:
      - 'scripts/research_v6_5_cross_sectional_pareto.py'
      - '.github/workflows/research_ai_market_reasoning_v6_5_cross_sectional_pareto.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  year:
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scipy==1.18.1 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Download exact frozen Stage0F
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10537510796/zip > /tmp/v6-0f.zip
          mkdir -p /tmp/v6-0f && unzip -q /tmp/v6-0f.zip -d /tmp/v6-0f
          mkdir -p data/history/v6-layered
          cp -a /tmp/v6-0f/. data/history/v6-layered/
      - name: Run V6.5 cross-sectional Pareto development
        run: python -u scripts/research_v6_5_cross_sectional_pareto.py --year ${{ matrix.year }}
      - name: Upload year
        uses: actions/upload-artifact@v4
        with:
          name: v6-5-cross-sectional-${{ matrix.year }}
          path: v6_5_cross_sectional_pareto_results/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: year
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scipy==1.18.1 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Download years
        uses: actions/download-artifact@v4
        with:
          pattern: v6-5-cross-sectional-*
          path: /tmp/v6-5
          merge-multiple: true
      - name: Aggregate
        run: python -u scripts/research_v6_5_cross_sectional_pareto.py --aggregate-dir /tmp/v6-5
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: v6-5-cross-sectional-development-aggregate
          path: v6_5_cross_sectional_pareto_results/
          if-no-files-found: error
          retention-days: 90
