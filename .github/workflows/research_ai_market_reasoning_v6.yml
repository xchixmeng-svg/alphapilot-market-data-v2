name: Research AI Market Reasoning V6

on:
  push:
    branches: [research-ai-market-reasoning-forecast-v6-20260915]
    paths:
      - 'research/AI_MARKET_REASONING_FORECAST_V6_PREREGISTRATION.md'
      - 'scripts/build_v6_context_layers.py'
      - 'scripts/backtest_ai_market_reasoning_v6.py'
      - 'scripts/build_2026_ytd_package.py'
      - '.github/workflows/research_ai_market_reasoning_v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 scipy==1.18.1 scikit-learn==1.5.2 requests==2.32.5 lxml==5.3.0
      - name: Syntax check V6 before network work
        run: |
          python -m py_compile scripts/build_v6_context_layers.py
          python -m py_compile scripts/backtest_ai_market_reasoning_v6.py
      - name: Verify immutable 2020-2025 inputs
        run: |
          cd data/history/2020-2025
          sha256sum -c SHA256SUMS
      - name: Verify immutable 2016-2019 archive
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          m=json.loads((root/'data/history/2007-2019/manifest.json').read_text())
          wanted={2016,2017,2018,2019}
          rows=[r for r in m['files'] if int(r['year']) in wanted]
          assert {int(r['year']) for r in rows}==wanted
          for r in rows:
              p=root/r['path']; h=hashlib.sha256(p.read_bytes()).hexdigest()
              assert h==r['sha256'], (p,h,r['sha256'])
              print(p,'OK',h)
          PY
      - name: Assert legacy-engine independence
        run: |
          ! grep -Ei 'r10_max|r10|r7_hard|r05_hard|r7_score|r05_score|backtest_full_market' scripts/backtest_ai_market_reasoning_v6.py
      - name: Rebuild current 2026 YTD market data
        run: python -u scripts/build_2026_ytd_package.py
      - name: Apply bounded transport and parser patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_v6_context_layers.py')
          s=p.read_text()
          a=s.index('def build_macro():')
          b=s.index('\n\n# ---------- B)', a)
          replacement='''def build_macro():\n    frames=[]; failures=[]\n    for short,sid in FRED_SERIES.items():\n        try:\n            url=f"https://fred.stlouisfed.org/graph/fredgraph.csv?id={sid}"\n            r=get(url, timeout=8, tries=1)\n            df=pd.read_csv(io.BytesIO(r.content)).iloc[:,:2].copy()\n            df.columns=["date",short]\n            df["date"]=pd.to_datetime(df["date"],errors="coerce")\n            df[short]=pd.to_numeric(df[short],errors="coerce")\n            df=df[(df["date"].dt.year>=START_YEAR)&(df["date"].dt.date<=END_DATE)]\n            frames.append(df); print("[MACRO]",short,sid,len(df),flush=True)\n        except Exception as e:\n            failures.append({"series":sid,"name":short,"error":str(e)})\n            print("[MACRO FAIL-SOFT]",short,sid,e,flush=True)\n    if frames:\n        out=frames[0]\n        for f in frames[1:]: out=out.merge(f,on="date",how="outer")\n        out=out.sort_values("date"); cols=[c for c in out.columns if c!="date"]; out[cols]=out[cols].ffill()\n    else:\n        out=pd.DataFrame({"date":pd.date_range(date(START_YEAR,1,1),END_DATE,freq="D")})\n    out["date"]=out["date"].dt.strftime("%Y-%m-%d")\n    p=OUT/"macro_daily.csv.gz"; write_gz(p,out.to_dict("records"))\n    return p,failures,len(out)\n'''
          s=s[:a]+replacement+s[b:]
          # TWSE throttles/rate-limits bulk MI_INDEX requests. Run #6 at 8 workers produced only 46 dates.
          # Keep the preregistered official type=IND endpoint but use conservative concurrency and retry transient failures.
          s=s.replace('ThreadPoolExecutor(max_workers=10)', 'ThreadPoolExecutor(max_workers=2)')
          s=s.replace('timeout=60,\n    ).json()', 'timeout=20, tries=3,\n    ).json()')
          old='''def code4(x):\n    s = str(x or "").strip().replace("=", "").replace('"', "")\n    return s if re.fullmatch(r"[1-9]\\d{3}", s) else None'''
          new='''def code4(x):\n    s = str(x or "").strip().replace("=", "").replace('"', "")\n    if re.fullmatch(r"[1-9]\\d{3}\\.0", s):\n        s = s[:-2]\n    return s if re.fullmatch(r"[1-9]\\d{3}", s) else None'''
          if old not in s:
              raise RuntimeError('code4 patch target not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python -m py_compile scripts/build_v6_context_layers.py
      - name: Build V6 causal context layers
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/build_v6_context_layers.py | tee v6_context_build.log
      - name: Show V6 context audit
        run: cat data/history/v6-context/manifest.json
      - name: Run V6 walk-forward path forecast research
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/backtest_ai_market_reasoning_v6.py | tee v6_execution.log
      - name: Show V6 OOS evidence and live forecast
        run: |
          cat ai_market_reasoning_v6_results/V6_YEARLY_OOS.csv
          cat ai_market_reasoning_v6_results/V6_OVERALL.json
          cat ai_market_reasoning_v6_results/V6_GATE.json
          cat ai_market_reasoning_v6_results/V6_LIVE.json
      - name: Upload V6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphapilot-ai-market-reasoning-v6-results
          path: |
            v6_context_build.log
            v6_execution.log
            research/AI_MARKET_REASONING_FORECAST_V6_PREREGISTRATION.md
            data/history/v6-context/manifest.json
            ai_market_reasoning_v6_results/
          retention-days: 30
