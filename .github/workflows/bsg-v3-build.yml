name: Build BSG V3

on:
  push:
    branches: [bsg-v3-product]
    paths:
      - 'apps/become-stock-god-v2/**'
      - '.github/workflows/bsg-v3-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bsg-v3-product
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/become-stock-god-v2/package.json
      - name: Install
        working-directory: apps/become-stock-god-v2
        run: npm install
      - name: Build complete V3
        working-directory: apps/become-stock-god-v2
        run: npm run build:web
      - name: Verify product
        working-directory: apps/become-stock-god-v2
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const bank=JSON.parse(fs.readFileSync('build/bank.json','utf8'));
          const html=fs.readFileSync('dist/index.html','utf8');
          if(bank.history_days!==240) throw new Error('history_days != 240');
          if(bank.future_days!==120) throw new Error('future_days != 120');
          if(!Array.isArray(bank.rounds)||bank.rounds.length!==620) throw new Error('rounds != 620');
          const train=bank.rounds.filter(r=>r.slot==='primary'&&(r.pool==='A'||r.pool==='B')).length;
          const exam=bank.rounds.filter(r=>r.slot==='primary'&&r.pool==='C').length;
          if(train!==400) throw new Error('training primary != 400');
          if(exam!==100) throw new Error('exam primary != 100');
          const sandbox={window:{}}; vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('src/content.js','utf8'),sandbox);
          const CT=sandbox.window.BSG_CONTENT;
          if(!CT||!Array.isArray(CT.MISSIONS)||CT.MISSIONS.length!==36) throw new Error('missions != 36');
          if(!Array.isArray(CT.WORLDS)||CT.WORLDS.length!==6) throw new Error('worlds != 6');
          if(CT.FREE_THROUGH!==6) throw new Error('FREE_THROUGH != 6');
          for(const s of ['成為股神 V3','NEURAL MARKET ACADEMY','Mastery','我卡住了｜系統幫我拆小一步','SCAN LOCKED｜你看對地方了','MISREAD｜你看錯觀察點','400 題實戰','100 題盲測']) if(!html.includes(s)) throw new Error('missing marker '+s);
          if(Buffer.byteLength(html)<5*1024*1024) throw new Error('standalone html unexpectedly small');
          console.log('VERIFY_OK', {rounds:bank.rounds.length,training:train,exam,missions:CT.MISSIONS.length,worlds:CT.WORLDS.length,history:bank.history_days,future:bank.future_days,htmlMB:(Buffer.byteLength(html)/1024/1024).toFixed(2)});
          NODE
      - name: Package artifact
        working-directory: apps/become-stock-god-v2
        run: |
          mkdir -p release
          cp dist/index.html release/become-stock-god-v3.html
          cp build/bank_report.json release/bank_report.json
          sha256sum release/* > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: become-stock-god-v3
          path: apps/become-stock-god-v2/release/
          retention-days: 30
      - name: Publish exact verified build to static branch
        run: |
          mkdir -p /tmp/bsg-v3-static
          cp apps/become-stock-god-v2/dist/index.html /tmp/bsg-v3-static/index.html
          cp apps/become-stock-god-v2/build/bank_report.json /tmp/bsg-v3-static/bank_report.json
          sha256sum /tmp/bsg-v3-static/index.html | awk '{print $1}' > /tmp/bsg-v3-static/SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan bsg-v3-static
          git rm -rf .
          cp /tmp/bsg-v3-static/index.html ./index.html
          cp /tmp/bsg-v3-static/bank_report.json ./bank_report.json
          cp /tmp/bsg-v3-static/SHA256.txt ./SHA256.txt
          git add index.html bank_report.json SHA256.txt
          git commit -m "release: verified Become Stock God V3"
          git push --force origin HEAD:bsg-v3-static
