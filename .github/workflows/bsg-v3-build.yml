name: Build BSG V3

on:
  push:
    branches: [bsg-v3-product]
    paths:
      - 'apps/become-stock-god-v2/**'
      - '.github/workflows/bsg-v3-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bsg-v3-product
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/become-stock-god-v2/package.json
      - name: Install
        working-directory: apps/become-stock-god-v2
        run: npm install
      - name: Build complete V3
        working-directory: apps/become-stock-god-v2
        run: npm run build:web
      - name: Verify product
        working-directory: apps/become-stock-god-v2
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const bank=JSON.parse(fs.readFileSync('build/bank.json','utf8'));
          const html=fs.readFileSync('dist/index.html','utf8');
          if(bank.history_days!==240) throw new Error('history_days != 240');
          if(bank.future_days!==120) throw new Error('future_days != 120');
          if(!Array.isArray(bank.rounds)||bank.rounds.length!==620) throw new Error('rounds != 620');
          const train=bank.rounds.filter(r=>r.slot==='primary'&&(r.pool==='A'||r.pool==='B')).length;
          const exam=bank.rounds.filter(r=>r.slot==='primary'&&r.pool==='C').length;
          if(train!==400) throw new Error('training primary != 400');
          if(exam!==100) throw new Error('exam primary != 100');
          const sandbox={window:{}}; vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('src/content.js','utf8'),sandbox);
          const CT=sandbox.window.BSG_CONTENT;
          if(!CT||!Array.isArray(CT.MISSIONS)||CT.MISSIONS.length!==36) throw new Error('missions != 36');
          if(!Array.isArray(CT.WORLDS)||CT.WORLDS.length!==6) throw new Error('worlds != 6');
          if(CT.FREE_THROUGH!==6) throw new Error('FREE_THROUGH != 6');
          for(const s of ['從菜雞到股神','新手也能學會看 K 線與結構','36 關總覽','bsg_v3_product','我卡住了｜系統幫我拆小一步','SCAN LOCKED｜你看對地方了','MISREAD｜你看錯觀察點','400 題實戰','100 題盲測','BSG_AUDIO_MIXER','lesson-contract-v2','airy-piano-bell-v2']) if(!html.includes(s)) throw new Error('missing marker '+s);
          if(Buffer.byteLength(html)<5*1024*1024) throw new Error('standalone html unexpectedly small');
          for(const s of ['成為股神 V3','NEURAL MARKET ACADEMY','V3 PRODUCT TEST']) if(html.includes(s)) throw new Error('old brand still visible: '+s);
          console.log('VERIFY_OK', {rounds:bank.rounds.length,training:train,exam,missions:CT.MISSIONS.length,worlds:CT.WORLDS.length,history:bank.history_days,future:bank.future_days,htmlMB:(Buffer.byteLength(html)/1024/1024).toFixed(2)});
          NODE
      - name: Browser smoke test + 36 mission visual/logic audit
        working-directory: apps/become-stock-god-v2
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 -d dist >/tmp/bsg-v3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'load',timeout:30000});
            await page.waitForSelector('.hudstats',{timeout:15000});
            await page.waitForSelector('.audioMixer',{timeout:10000});
            const buttons=await page.locator('.audioMixer [data-audio]').count();
            if(buttons!==3)throw new Error('audio mixer buttons != 3');
            await page.locator('body').click({position:{x:420,y:180}});
            await page.waitForTimeout(500);
            let state=await page.evaluate(()=>window.BSG_AUDIO_MIXER&&window.BSG_AUDIO_MIXER.state());
            if(!state||!state.activated)throw new Error('audio mixer did not activate after user gesture');
            if(state.music!=='airy-piano-bell-v2'||state.minHz<220)throw new Error('wrong BGM profile '+JSON.stringify(state));
            const bgm=page.locator('[data-audio="bgm"]');
            await bgm.click();
            await page.waitForTimeout(150);
            let offState=await page.evaluate(()=>window.BSG_AUDIO_MIXER.state());
            if(offState.bgm)throw new Error('BGM toggle off failed');
            await bgm.click();
            await page.waitForTimeout(400);
            let onState=await page.evaluate(()=>window.BSG_AUDIO_MIXER.state());
            if(!onState.bgm)throw new Error('BGM toggle on failed');
            await page.locator('[data-audio="sfx"]').click();
            await page.locator('[data-audio="sfx"]').click();
            await page.locator('[data-audio="voice"]').click();
            await page.locator('[data-audio="voice"]').click();
            await page.waitForTimeout(600);
            const alive=await page.evaluate(()=>({title:document.title,app:!!document.getElementById('app'),mixer:!!document.querySelector('.audioMixer')}));
            if(!alive.app||!alive.mixer)throw new Error('page became unresponsive / mixer disappeared');
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('BROWSER_SMOKE_OK', {state:onState,title:alive.title});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node tools/audit36.mjs
          node tools/audit_portrait.mjs
          # V3.6: geometry audit — 36 missions × 4 exercises × 5 phone viewports (labels, lanes, controls, fold)
          node tools/audit_layout.mjs
          # V4: save compatibility, brand, 36-mission overview, mixed-skill practice / blind exam
          node tools/audit_product.mjs
      - name: Package artifact
        working-directory: apps/become-stock-god-v2
        run: |
          mkdir -p release
          cp dist/index.html release/become-stock-god-v3.html
          cp build/bank_report.json release/bank_report.json
          cp -r audit release/audit
          sha256sum release/become-stock-god-v3.html release/bank_report.json > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: become-stock-god-v3
          path: apps/become-stock-god-v2/release/
          retention-days: 30
      - name: Publish exact verified build to static branch
        run: |
          mkdir -p /tmp/bsg-v3-static
          cp apps/become-stock-god-v2/dist/index.html /tmp/bsg-v3-static/index.html
          cp apps/become-stock-god-v2/build/bank_report.json /tmp/bsg-v3-static/bank_report.json
          cp apps/become-stock-god-v2/audit/audit36.json /tmp/bsg-v3-static/audit36.json
          cp apps/become-stock-god-v2/audit/audit_portrait.json /tmp/bsg-v3-static/audit_portrait.json
          cp apps/become-stock-god-v2/audit/audit_layout.json /tmp/bsg-v3-static/audit_layout.json
          cp apps/become-stock-god-v2/audit/audit_product.json /tmp/bsg-v3-static/audit_product.json
          sha256sum /tmp/bsg-v3-static/index.html | awk '{print $1}' > /tmp/bsg-v3-static/SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan bsg-v3-static
          git rm -rf .
          cp /tmp/bsg-v3-static/index.html ./index.html
          cp /tmp/bsg-v3-static/bank_report.json ./bank_report.json
          cp /tmp/bsg-v3-static/audit36.json ./audit36.json
          cp /tmp/bsg-v3-static/audit_portrait.json ./audit_portrait.json
          cp /tmp/bsg-v3-static/audit_layout.json ./audit_layout.json
          cp /tmp/bsg-v3-static/audit_product.json ./audit_product.json
          cp /tmp/bsg-v3-static/SHA256.txt ./SHA256.txt
          git add index.html bank_report.json audit36.json audit_portrait.json audit_layout.json audit_product.json SHA256.txt
          git commit -m "release: verified 從菜雞到股神 (V3 engine)"
          git push --force origin HEAD:bsg-v3-static
