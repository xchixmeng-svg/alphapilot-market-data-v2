name: One-time backfill (2026 daily prices for breadth)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_prices_2026.py'
      - '.github/workflows/backfill_prices_2026.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5 pandas==2.2.3
      - name: Run
        continue-on-error: true
        run: python scripts/backfill_prices_2026.py
      - name: Commit results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/history/prices_2026 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "data: 2026 daily prices backfill (breadth)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
