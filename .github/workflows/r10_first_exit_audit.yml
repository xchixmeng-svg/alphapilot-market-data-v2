name: R10 First Exit Divergence Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_first_exit_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests
      - name: Audit first Golden exit divergence
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'.')
          from scripts import backtest_r10_stress as bt
          cfg=bt.SCENARIOS['validation2021_2025']
          # only loading full locked source; cache is local to this ephemeral run
          raw=bt.load_scenario_ohlcv(cfg)
          feat,events,bm=bt.build_features(raw)
          for code,entry_date,entry_fill,dates in [
              ('1802',20210105,21.3,[20210105,20210106,20210107,20210108]),
              ('8215',20210106,30.5,[20210106,20210107,20210108,20210111,20210112,20210113]),
          ]:
              er=feat[(feat.code==code)&(feat.date==entry_date)].iloc[-1]
              factor=float(er.aclose/er.close)
              entry_adj=entry_fill*factor
              print(f'\n[AUDIT] code={code} entry_date={entry_date} fill={entry_fill} raw_entry_close={er.close} entry_aclose={er.aclose} factor={factor} entry_adj={entry_adj} hard90={entry_adj*0.90}')
              q=feat[(feat.code==code)&feat.date.isin(dates)][['date','open','high','low','close','aopen','ahigh','alow','aclose']]
              for r in q.itertuples(index=False):
                  print('[DAY]',r)
                  print('[TEST] close_ret=',float(r.aclose)/entry_adj-1,'hard=',float(r.aclose)<=entry_adj*.90)
          print('[CORP_EVENTS]',events)
          PY
