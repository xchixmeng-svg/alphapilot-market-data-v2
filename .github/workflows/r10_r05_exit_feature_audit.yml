name: R10 R05 Exit Feature Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r10_r05_exit_feature_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy requests
      - name: Audit Golden R05 exit features
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'.')
          from scripts import backtest_r10_stress as bt
          cfg=bt.SCENARIOS['validation2021_2025']
          raw=bt.load_scenario_ohlcv(cfg)
          feat,_,_=bt.build_features(raw)
          dates=sorted(int(x) for x in feat.date.unique())
          prev={dates[i]:dates[i-1] for i in range(1,len(dates))}
          cases=[
            ('1802',20210105,21.3,20210106),
            ('8215',20210106,30.5,20210108),
            ('1319',20210420,39.8,20210503),
            ('2889',20210510,17.9,20210511),
            ('6160',20210714,24.9,20210719),
            ('2344',20210806,35.2,20210810),
          ]
          cols=['date','code','close','low','ma20','ma60','ma120','r20','ma20gap','amount_ratio','prior_high10','prior_high60','aclose','alow']
          for code,entry,fill,decision in cases:
              signal=prev.get(entry)
              e=feat[(feat.code==code)&(feat.date==entry)].iloc[-1]
              s=feat[(feat.code==code)&(feat.date==signal)].iloc[-1]
              d=feat[(feat.code==code)&(feat.date==decision)].iloc[-1]
              print('\n[CASE]',code,'signal',signal,'entry',entry,'decision',decision,'fill',fill)
              for tag,r in [('SIGNAL',s),('ENTRY',e),('EXIT_DEC',d)]:
                  print(tag,{c:(float(r[c]) if c not in ('date','code') and r[c]==r[c] else r[c]) for c in cols if c in r.index})
              print('DERIVED',{
                'exit_close_ret_fill':float(d.aclose)/(fill*float(e.aclose/e.close))-1,
                'exit_below_signal_low':bool(float(d.aclose)<float(s.alow)),
                'exit_below_entry_low':bool(float(d.aclose)<float(e.alow)),
                'exit_below_ma20':bool(float(d.aclose)<float(d.ma20)),
                'exit_r20_negative':bool(float(d.r20)<0),
                'exit_amount_ratio_below1':bool(float(d.amount_ratio)<1),
                'exit_no_longer_breakout10':bool(float(d.aclose)<=float(d.prior_high10)),
                'exit_prior60_pos':float(d.aclose)/float(d.prior_high60)-1 if d.prior_high60==d.prior_high60 else None,
              })
          PY
