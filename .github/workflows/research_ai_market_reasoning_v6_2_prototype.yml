name: V6.2 Hybrid AI Architecture Prototype
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'research/V6_2_HYBRID_AI_PROTOTYPE_PROTOCOL.md'
      - 'research/V6_2_LLM_REASONING_SCHEMA.json'
      - 'scripts/prototype_v6_2_hybrid_ai.py'
      - '.github/workflows/research_ai_market_reasoning_v6_2_prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 scipy==1.18.1 scikit-learn==1.5.2 pyarrow==18.1.0
      - name: Download exact frozen Stage0F
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10537510796/zip > /tmp/v6-0f.zip
          mkdir -p /tmp/v6-0f
          unzip -q /tmp/v6-0f.zip -d /tmp/v6-0f
          mkdir -p data/history/v6-layered
          cp -a /tmp/v6-0f/. data/history/v6-layered/
      - name: Run V6.2 architecture prototype
        run: python -u scripts/prototype_v6_2_hybrid_ai.py
      - name: Upload prototype evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-2-hybrid-ai-prototype
          path: v6_2_prototype/
          if-no-files-found: error
          retention-days: 90
