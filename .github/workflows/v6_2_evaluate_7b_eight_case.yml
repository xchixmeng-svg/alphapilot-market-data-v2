name: V6.2 7B Eight-Case Historical Smoke Test
on:
  push:
    branches: [research-ai-market-reasoning-v6-2-dynamic-candidate-pool-20260918]
    paths:
      - 'scripts/v6_2_evaluate_7b_eight_case.py'
      - '.github/workflows/v6_2_evaluate_7b_eight_case.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REASON_ARTIFACT: '10576322171'
      NUM_ARTIFACT: '10572172533'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas==2.2.3
      - name: Download exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs/reason inputs/num
          get(){ gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" > /tmp/a.zip; unzip -oq /tmp/a.zip -d "$2"; }
          get "$REASON_ARTIFACT" inputs/reason
          get "$NUM_ARTIFACT" inputs/num
          test -s inputs/reason/REAL_EVIDENCE_REASONING_RESULTS.csv
          test -s inputs/num/u10_d5_h20_AUDIT_SAMPLE.csv
      - name: Evaluate actual historical outcomes
        run: python -u scripts/v6_2_evaluate_7b_eight_case.py
      - uses: actions/upload-artifact@v4
        with:
          name: v6-2-7b-eight-case-historical-smoke-test
          path: out/
          if-no-files-found: error
          retention-days: 60
