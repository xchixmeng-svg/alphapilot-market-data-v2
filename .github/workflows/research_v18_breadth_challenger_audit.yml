name: V18 frozen breadth challenger audit

on:
  workflow_dispatch:
  push:
    branches: [research-fundamental-repricing-v9-20260913]
    paths:
      - '.github/workflows/research_v18_breadth_challenger_audit.yml'
      - 'scripts/audit_v18_breadth_challenger.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0
      - name: Verify frozen history inputs
        working-directory: data/history/2020-2025
        run: sha256sum --check SHA256SUMS
      - name: Verify causal fingerprints
        run: |
          echo "2fef3ba99b7c83b5db21e29c5f1c2abd8b3df77583840a025e6df937ff81c0d0  scripts/r10_max_formal.py" | sha256sum --check -
          echo "8aaca46ae7c6d2f0b4e1479878352901ffe90a8acaed122d3d2640c70ea817cc  data/reference/official_corporate_actions_2020_2025.csv" | sha256sum --check -
      - name: Build locked R10 baseline and causal daily layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf formal_run && mkdir formal_run
          for f in "$GITHUB_WORKSPACE"/data/history/2020-2025/*.parquet; do ln -s "$f" "$GITHUB_WORKSPACE/formal_run/$(basename "$f")"; done
          ln -s "$GITHUB_WORKSPACE/data/reference/official_corporate_actions_2020_2025.csv" "$GITHUB_WORKSPACE/formal_run/official_corporate_actions_2020_2025.csv"
          cd formal_run
          python ../scripts/r10_max_formal.py > execution.log
      - name: Assert locked R10 unchanged
        run: |
          python - <<'PY'
          import json
          a=json.load(open('formal_run/contract_audit.json'))
          s=json.load(open('formal_run/r10max_formal_summary.json'))['strategy']
          assert a['all_pass'], a
          assert abs(s['end_nav']-2403427.0678222505)<1e-7, s
          assert s['completed_trades']==150 and s['wins']==71 and s['losses']==79, s
          print('R10 baseline unchanged')
          PY
      - name: Run frozen challenger robustness audit
        run: python scripts/audit_v18_breadth_challenger.py | tee v18.log
      - name: Publish audit
        if: always()
        run: |
          test -f v18_breadth_challenger_audit_out/v18_audit.json && cat v18_breadth_challenger_audit_out/v18_audit.json || true
          test -f v18_breadth_challenger_audit_out/slippage_stress.csv && cat v18_breadth_challenger_audit_out/slippage_stress.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v18-breadth-challenger-audit
          path: |
            v18.log
            v18_breadth_challenger_audit_out/
            formal_run/contract_audit.json
            formal_run/r10max_formal_summary.json
            formal_run/r10max_formal_nav.csv
            formal_run/r10max_formal_trades.csv
          if-no-files-found: warn
          retention-days: 30
