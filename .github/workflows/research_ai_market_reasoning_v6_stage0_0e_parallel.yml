name: V6 Stage0 0E Event Time Parallel

on:
  push:
    branches: [research-ai-market-reasoning-v6-parallel-stage0-20260917]
    paths:
      - 'scripts/build_v6_stage0_event_time_layer_parallel.py'
      - '.github/workflows/research_ai_market_reasoning_v6_stage0_0e_parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6-stage0-0e-event-time
  cancel-in-progress: false

jobs:
  event_time_0e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python -m pip install pandas==2.2.3 numpy==2.3.5 pyarrow==18.1.0 requests==2.32.5
      - name: Build 0A calendar evidence locally
        run: python -u scripts/build_v6_stage0_market_layer.py
      - name: Build 0E event/time lane
        run: python -u scripts/build_v6_stage0_event_time_layer_parallel.py
      - name: Upload 0E evidence
        uses: actions/upload-artifact@v4
        with:
          name: alphapilot-v6-stage0-0E-event-time
          path: |
            data/history/v6-layered/0E_EVENT_TIME/
            data/history/v6-layered/manifests/0E_EVENT_TIME.json
            data/history/v6-layered/progress/0E_EVENT_TIME.json
          retention-days: 7
